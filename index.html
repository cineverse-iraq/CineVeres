    /* ===== إصلاحات عامة لمنع أي تداخل أو تمرير أفقي ===== */
    html { width: 100%; height: 100%; }
    body { overflow-x: hidden; width: 100%; overscroll-behavior-y: none; }

    /* ===== نجوم التقييم ===== */
    .star-btn { transition: transform 0.15s ease, color 0.15s ease; }
    .star-btn:active { transform: scale(1.2); }

    /* ===== شبكة بروفايل بأسلوب Letterboxd ===== */

    .video-crop-wrap { position: relative; width: 100%; overflow: hidden; background: #000; }
    .video-crop-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    /* عند تفعيل ملء الشاشة الحقيقي على حاوية القص، نلغي نسبة العرض/الارتفاع الثابتة (aspect-video)
       لتملأ الحاوية كامل الشاشة فعليًا بدل أن تبقى محصورة بنسبة 16:9 وسط شريط أسود */
    .video-crop-wrap:fullscreen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .video-crop-wrap:-webkit-full-screen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .video-crop-wrap:-moz-full-screen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .video-crop-wrap:-ms-fullscreen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    /* ===== وضع ملء الشاشة البديل (Pseudo Fullscreen) للأجهزة اللي ما تدعم ملء شاشة عنصر عادي (آيفون سفاري)
       يبقي الفيديو داخل صفحتنا (وليس بمشغل النظام الأصلي) حتى يبقى القص المخصص شغّالًا 100% ===== */
    .pseudo-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
      aspect-ratio: auto !important;
      background: #000;
    }

    // رفع أي ملف (صورة/فيديو) مباشرة من الجهاز إلى Firebase Storage، مع تتبع نسبة التقدم
    function uploadFile(file, folder, onProgress) {
      return new Promise((resolve, reject) => {
        const safeName = (file.name || `upload_${Date.now()}.jpg`).replace(/[^a-zA-Z0-9.\-_]/g, '_');
        const path = `${folder}/${Date.now()}_${safeName}`;
        const ref = storage.ref().child(path);
        const task = ref.put(file);
        task.on('state_changed',
          snap => onProgress && onProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100)),
          err => reject(err),
          () => ref.getDownloadURL().then(resolve).catch(reject)
        );
      });
    }

    // ضغط أي صورة وتحويلها لـ base64 صالحة للتخزين المباشر في Realtime Database
    // (تُستخدم لصور الحسابات الشخصية بدل الاعتماد على Firebase Storage المقيّد)
    function compressImageToDataUrl(file, maxSize = 300, maxBytes = 260000) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) { reject(new Error('ملف غير صالح')); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height) { if (width > maxSize) { height = Math.round(height * (maxSize / width)); width = maxSize; } }
            else { if (height > maxSize) { width = Math.round(width * (maxSize / height)); height = maxSize; } }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            let quality = 0.8;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            while (dataUrl.length > maxBytes && quality > 0.35) { quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality); }
            if (dataUrl.length > maxBytes + 40000) { reject(new Error('الصورة كبيرة جدًا')); return; }
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error('تعذّرت معالجة هذه الصورة'));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error('تعذّرت قراءة الملف'));
        reader.readAsDataURL(file);
      });
    }

    function normalizeVideoUrl(url) {
      if (!url) return url;
      const clean = url.trim();
      const drive = clean.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (drive) return `https://drive.google.com/file/d/${drive[1]}/preview`;
      const driveOpen = clean.match(/drive\.google\.com\/open\?id=([^&]+)/);

    function useIsMobile() {

        smartphone: <><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></>,
        monitor: <><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></>,
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          {icons[name] || null}
        </svg>
      );
    }

    // شعار CineVerse (نسخة مصغّرة من الشعار الرسمي، بدون النص، لاستخدامه في الهيدر والنوافذ)
    function CineVerseLogo({ className = "w-8 h-8" }) {
      const uid = useRef('lg' + Math.random().toString(36).slice(2)).current;
      return (
        <svg viewBox="0 0 1080 1080" className={className} xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id={`${uid}-stroke`} x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#E9D5FF"/><stop offset="45%" stopColor="#A855F7"/><stop offset="100%" stopColor="#00F0FF"/>
            </linearGradient>
            <linearGradient id={`${uid}-strip`} x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stopColor="#A855F7"/><stop offset="50%" stopColor="#7C3AED"/><stop offset="100%" stopColor="#00F0FF"/>
            </linearGradient>
            <linearGradient id={`${uid}-fill`} x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stopColor="#3b2a5c" stopOpacity="0.85"/><stop offset="100%" stopColor="#161E2E" stopOpacity="0.85"/>
            </linearGradient>
            <linearGradient id={`${uid}-reel`} x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#241536" stopOpacity="0.95"/><stop offset="100%" stopColor="#0E131F" stopOpacity="0.95"/>
            </linearGradient>
          </defs>
          <path d="M 195 555 C 140 500, 150 400, 235 355 C 300 320, 380 340, 420 400" fill="none" stroke={`url(#${uid}-strip)`} strokeWidth="46" strokeLinecap="round" opacity="0.9"/>
          <path d="M 640 400 C 720 330, 810 320, 870 380 C 925 435, 915 520, 850 570" fill="none" stroke={`url(#${uid}-strip)`} strokeWidth="46" strokeLinecap="round" opacity="0.9"/>
          <path d="M 330 660 C 480 610, 640 610, 800 585" fill="none" stroke={`url(#${uid}-strip)`} strokeWidth="46" strokeLinecap="round" opacity="0.9"/>
          <rect x="405" y="430" width="330" height="200" rx="26" fill={`url(#${uid}-fill)`} stroke={`url(#${uid}-stroke)`} strokeWidth="4"/>
          <rect x="345" y="500" width="55" height="70" rx="12" fill={`url(#${uid}-fill)`} stroke={`url(#${uid}-stroke)`} strokeWidth="3"/>
          <rect x="745" y="590" width="55" height="26" rx="8" fill={`url(#${uid}-fill)`} stroke={`url(#${uid}-stroke)`} strokeWidth="3"/>
          <circle cx="480" cy="345" r="95" fill={`url(#${uid}-reel)`} stroke={`url(#${uid}-stroke)`} strokeWidth="5"/>
          <circle cx="660" cy="345" r="95" fill={`url(#${uid}-reel)`} stroke={`url(#${uid}-stroke)`} strokeWidth="5"/>
        </svg>
      );
    }

    // نجوم تقييم تفاعلية (للاستخدام في نموذج التقييم)
    function StarRatingInput({ value, onChange, size = "w-7 h-7" }) {
      const [hover, setHover] = useState(0);
      return (
        <div className="flex items-center gap-1" dir="ltr">
          {[1, 2, 3, 4, 5].map(n => (
            <button key={n} type="button" onClick={() => onChange(n)} onMouseEnter={() => setHover(n)} onMouseLeave={() => setHover(0)}
              className={`star-btn ${(hover || value) >= n ? 'text-amber-400' : 'text-slate-600'}`}>
              <Icon name="star" className={size} />
            </button>
          ))}
        </div>
      );
    }

    // عرض النجوم للقراءة فقط (متوسط التقييم)
    function StarRatingDisplay({ value, size = "w-3.5 h-3.5" }) {
      const rounded = Math.round((value || 0) * 2) / 2;
      return (
        <div className="flex items-center gap-0.5" dir="ltr">
          {[1, 2, 3, 4, 5].map(n => (
            <Icon key={n} name="star" className={`${size} ${rounded >= n ? 'text-amber-400' : 'text-slate-600'}`} />
          ))}
        </div>
      );
    }

    function RatingBadges({ imdb, rt, size }) {
      const hasImdb = imdb !== undefined && imdb !== null && imdb !== '';
      const hasRt = rt !== undefined && rt !== null && rt !== '';
      if (!hasImdb && !hasRt) return null;
      const small = size === 'xs';
      const rtNum = hasRt ? parseInt(String(rt).replace('%', '')) : null;
      const rtGood = rtNum !== null && !isNaN(rtNum) && rtNum >= 60;
      return (
        <div className="flex items-center gap-1.5 flex-wrap">
          {hasImdb && (
            <span className={`inline-flex items-center gap-1 ${small ? 'text-[10px] px-2 py-0.5' : 'text-xs px-2.5 py-1'} rounded-md bg-black/60 backdrop-blur-md text-amber-400 font-bold border border-amber-400/20 shadow-sm`}>
              <Icon name="star" className={small ? 'w-2.5 h-2.5' : 'w-3 h-3'} />IMDb {imdb}
            </span>
          )}
          {hasRt && (
            <span className={`inline-flex items-center gap-1 ${small ? 'text-[10px] px-2 py-0.5' : 'text-xs px-2.5 py-1'} rounded-md bg-black/60 backdrop-blur-md font-bold border border-white/10 ${rtGood ? 'text-emerald-400' : 'text-rose-400'}`}>
              RT {String(rt).includes('%') ? rt : rt + '%'}
            </span>
          )}
        </div>
      );
    }

    function EmptyState({ text }) {
      return (
        <div className="py-20 text-center text-slate-400">
          <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-glass-800 flex items-center justify-center border border-white/5 text-slate-500 shadow-inner">
            <Icon name="film" className="w-8 h-8 opacity-60" />
          </div>
          <p className="text-base font-medium">{text}</p>
        </div>
      );
    }

    function PosterCard({ title, onOpen, compact }) {
      return (
        <button onClick={() => onOpen(title)} className={`group text-right ${compact ? 'shrink-0 w-32 sm:w-38 md:w-44 snap-start' : 'w-full'}`}>
          <div className="relative aspect-[2/3] rounded-xl overflow-hidden glass-card shadow-lg group-hover:scale-[1.02] transition duration-300">
            {title.poster ? (
              <img src={title.poster} alt={title.name} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
            ) : (
              <div className="w-full h-full flex items-center justify-center text-slate-600"><Icon name="film" className="w-8 h-8" /></div>
            )}
            <div className="absolute inset-x-0 bottom-0 p-2 pt-6 bg-gradient-to-t from-black/90 via-black/40 to-transparent">
              <RatingBadges imdb={title.imdbRating} rt={title.rtRating} size="xs" />
            </div>
            <span className="absolute top-2 right-2 text-[10px] px-2 py-0.5 rounded-full bg-black/60 backdrop-blur-md text-accent-cyan font-bold border border-accent-cyan/20">{TYPE_LABELS[title.type]}</span>
          </div>
          <p className="mt-2 text-sm font-bold text-slate-100 line-clamp-1 group-hover:text-accent-cyan transition">{title.name}</p>
          <p className="text-xs text-slate-400 font-medium">{title.year || ''}</p>
        </button>
      );
    }

    function Row({ label, items, onOpen }) {
      if (!items.length) return null;
      return (
        <section className="mb-10">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-lg md:text-xl font-black text-slate-100 flex items-center gap-2.5">
              <span className="w-1.5 h-5 bg-accent-red rounded-full shadow-[0_0_12px_rgba(255,51,75,0.6)]"></span>{label}
            </h2>
          </div>
          <div className="flex gap-4 overflow-x-auto pb-3 pt-1 snap-x scrollbar-hide">
            {items.map(it => <PosterCard key={it.id} title={it} onOpen={onOpen} compact />)}
          </div>
        </section>
      );
    }

    // البنر الرئيسي (Hero): قابل للسحب بالفأرة أو الإصبع، والنقاط تنقل مباشرة لأي بنر
    function Hero({ items, onOpen }) {
      const [idx, setIdx] = useState(0);
      const dragState = useRef({ startX: 0, dragging: false });
      const [dragOffset, setDragOffset] = useState(0);
      const [isDragging, setIsDragging] = useState(false);

      useEffect(() => {
        if (items.length < 2 || isDragging) return;
        const t = setInterval(() => setIdx(i => (i + 1) % items.length), 6000);
        return () => clearInterval(t);
      }, [items.length, isDragging]);

      if (!items.length) return null;

      const go = (i) => setIdx(((i % items.length) + items.length) % items.length);
      const getX = (e) => (e.touches ? e.touches[0].clientX : e.clientX);

      const onDragStart = (e) => {
        if (items.length < 2) return;
        dragState.current = { startX: getX(e), dragging: true };
        setIsDragging(true);
      };
      const onDragMove = (e) => {
        if (!dragState.current.dragging) return;
        setDragOffset(getX(e) - dragState.current.startX);
      };
      const endDrag = () => {
        if (!dragState.current.dragging) return;
        const threshold = 60;
        if (dragOffset > threshold) go(idx - 1);
        else if (dragOffset < -threshold) go(idx + 1);
        dragState.current.dragging = false;
        setDragOffset(0);
        setIsDragging(false);
      };

      const item = items[idx % items.length];
      return (
        <section
          className="relative h-[42vh] min-h-[300px] md:h-[72vh] -mx-4 md:mx-0 mb-8 md:mb-10 md:rounded-3xl overflow-hidden glass-panel border border-white/10 shadow-2xl select-none cursor-grab active:cursor-grabbing"
          style={{ touchAction: 'pan-y' }}
          onMouseDown={onDragStart} onMouseMove={onDragMove} onMouseUp={endDrag} onMouseLeave={endDrag}
          onTouchStart={onDragStart} onTouchMove={onDragMove} onTouchEnd={endDrag}
        >
          {item.backdrop && (
            <img src={item.backdrop} alt="" draggable="false"
              className="absolute inset-0 w-full h-full object-cover opacity-60"
              style={{ transform: `translateX(${dragOffset * 0.3}px) scale(1.05)`, transition: isDragging ? 'none' : 'transform 0.4s ease' }} />
          )}
          <div className="absolute inset-0 bg-gradient-to-t from-glass-950 via-glass-950/60 to-transparent" />
          <div className="absolute inset-x-0 bottom-0 p-5 md:p-12 max-w-2xl">
            <div className="flex items-center gap-2 mb-3 flex-wrap">
              <span className="text-xs px-3 py-1 rounded-full bg-accent-red text-white font-bold shadow-[0_0_15px_rgba(255,51,75,0.4)]">{TYPE_LABELS[item.type]}</span>
              <RatingBadges imdb={item.imdbRating} rt={item.rtRating} />
            </div>
            <h1 className="text-3xl md:text-5xl font-black text-white leading-tight mb-3 drop-shadow-md">{item.name}</h1>
            {item.description && <p className="text-slate-300 text-sm md:text-base line-clamp-2 md:line-clamp-3 mb-5 leading-relaxed font-medium">{item.description}</p>}
            <button onClick={() => onOpen(item)} className="flex items-center gap-2 px-6 py-3 rounded-xl bg-accent-red hover:bg-accent-redHover font-bold text-white shadow-[0_0_20px_rgba(255,51,75,0.5)] transition transform hover:scale-105 active:scale-95">
              <Icon name="play" className="w-5 h-5 fill-current" />مشاهدة الآن
            </button>
          </div>
          {items.length > 1 && (
            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 p-1.5 rounded-full bg-black/40 backdrop-blur-md border border-white/5 z-10">
              {items.map((_, i) => (
                <button key={i} onClick={(e) => { e.stopPropagation(); go(i); }}
                  className={`h-2 rounded-full transition-all duration-300 ${i === idx ? 'bg-accent-cyan w-6 shadow-[0_0_8px_rgba(0,240,255,0.8)]' : 'bg-white/30 w-2 hover:bg-white/50'}`}></button>
              ))}
            </div>
          )}
        </section>
      );
    }

    // شريط "أكمل المشاهدة" (يعتمد على آخر الأعمال المفتوحة، محفوظة محليًا بجهاز الزائر)
    function ContinueWatchingRow({ items, onOpen }) {
      if (!items.length) return null;
      return (
        <section className="mb-10">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-lg md:text-xl font-black text-slate-100 flex items-center gap-2.5">
              <span className="w-1.5 h-5 bg-accent-cyan rounded-full shadow-[0_0_12px_rgba(0,240,255,0.6)]"></span>أكمل المشاهدة
            </h2>
          </div>
          <div className="flex gap-4 overflow-x-auto pb-3 pt-1 snap-x scrollbar-hide">
            {items.map(it => <PosterCard key={it.id} title={it} onOpen={onOpen} compact />)}
          </div>
        </section>
      );
    }

    function HomeView({ items, onOpen, continueItems }) {
      if (!items.length) return <EmptyState text="لا توجد أعمال منشورة بعد. تابعنا قريبًا!" />;
      const featured = items.filter(t => t.featured).length ? items.filter(t => t.featured) : items.slice(0, 5);
      const latest = [...items].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 12);
      const genreCounts = {};
      items.forEach(t => (t.genres || []).forEach(g => genreCounts[g] = (genreCounts[g] || 0) + 1));
      const topGenres = Object.keys(genreCounts).sort((a, b) => genreCounts[b] - genreCounts[a]).slice(0, 6);
      return (
        <div>
          <Hero items={featured} onOpen={onOpen} />
          <ContinueWatchingRow items={continueItems} onOpen={onOpen} />
          <Row label="أُضيف حديثًا" items={latest} onOpen={onOpen} />
          <Row label="أفلام" items={items.filter(t => t.type === 'movie').slice(0, 12)} onOpen={onOpen} />
          <Row label="مسلسلات" items={items.filter(t => t.type === 'series').slice(0, 12)} onOpen={onOpen} />
          <Row label="أنمي" items={items.filter(t => t.type === 'anime').slice(0, 12)} onOpen={onOpen} />
          {topGenres.map(g => (
            <Row key={g} label={`تصنيف: ${g}`} items={items.filter(t => (t.genres || []).includes(g)).slice(0, 12)} onOpen={onOpen} />
          ))}
        </div>
      );
    }

    const SORT_OPTIONS = [
      ['newest', 'الأحدث إضافةً'],
      ['imdb', 'الأعلى تقييم IMDb'],
      ['year', 'سنة الإصدار'],
      ['name', 'الاسم (أ-ي)'],
      ['popular', 'الأكثر مشاهدة'],
    ];

    function sortTitles(items, sortKey) {
      const arr = [...items];
      if (sortKey === 'imdb') arr.sort((a, b) => (parseFloat(b.imdbRating) || 0) - (parseFloat(a.imdbRating) || 0));
      else if (sortKey === 'year') arr.sort((a, b) => (b.year || 0) - (a.year || 0));
      else if (sortKey === 'name') arr.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      else if (sortKey === 'popular') arr.sort((a, b) => (b.views || 0) - (a.views || 0));
      else arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      return arr;
    }

    function TypeGrid({ title, items, onOpen, showGenreFilter, emptyText }) {
      const [genre, setGenre] = useState('');
      const [year, setYear] = useState('');
      const [sortKey, setSortKey] = useState('newest');
      const genres = showGenreFilter ? Array.from(new Set(items.flatMap(t => t.genres || []))) : [];
      const years = Array.from(new Set(items.map(t => t.year).filter(Boolean))).sort((a, b) => b - a);
      let filteredByGenre = genre ? items.filter(t => (t.genres || []).includes(genre)) : items;
      if (year) filteredByGenre = filteredByGenre.filter(t => String(t.year) === String(year));
      const filtered = sortTitles(filteredByGenre, sortKey);
      return (
        <div>
          <div className="flex items-center justify-between gap-3 flex-wrap mb-6">
            <h1 className="text-2xl md:text-3xl font-black text-slate-100">{title}</h1>
            {items.length > 0 && (
              <div className="flex items-center gap-2.5 flex-wrap">
                {years.length > 1 && (
                  <div className="relative shrink-0">
                    <select value={year} onChange={e => setYear(e.target.value)}
                      className="appearance-none bg-glass-900 border border-white/10 rounded-xl pl-8 pr-3 py-2.5 text-xs font-bold text-slate-200 outline-none focus:border-accent-cyan transition cursor-pointer">
                      <option value="">كل السنوات</option>
                      {years.map(y => <option key={y} value={y} className="bg-glass-950">{y}</option>)}
                    </select>
                    <Icon name="chevronDown" className="w-3 h-3 text-accent-cyan absolute top-1/2 -translate-y-1/2 left-2.5 pointer-events-none" />
                  </div>
                )}
                <div className="relative shrink-0">
                  <select value={sortKey} onChange={e => setSortKey(e.target.value)}
                    className="appearance-none bg-glass-900 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-xs font-bold text-slate-200 outline-none focus:border-accent-cyan transition cursor-pointer">
                    {SORT_OPTIONS.map(([k, l]) => <option key={k} value={k} className="bg-glass-950">{l}</option>)}
                  </select>
                  <Icon name="filter" className="w-3.5 h-3.5 text-accent-cyan absolute top-1/2 -translate-y-1/2 left-3 pointer-events-none" />
                </div>
              </div>
            )}
          </div>
          {showGenreFilter && genres.length > 0 && (
            <div className="flex gap-2 flex-wrap mb-6">
              <button onClick={() => setGenre('')} className={`text-xs px-4 py-2 rounded-xl transition font-bold border ${!genre ? 'bg-accent-cyan text-glass-950 border-accent-cyan shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card text-slate-300 hover:border-white/20'}`}>الكل</button>
              {genres.map(g => (
                <button key={g} onClick={() => setGenre(g)} className={`text-xs px-4 py-2 rounded-xl transition font-bold border ${genre === g ? 'bg-accent-cyan text-glass-950 border-accent-cyan shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card text-slate-300 hover:border-white/20'}`}>{g}</button>
              ))}
            </div>
          )}
          {filtered.length === 0 ? (
            <EmptyState text={emptyText || 'لا توجد نتائج.'} />
          ) : (
            <div className="grid grid-cols-2 xs:grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 md:gap-5">
              {filtered.map(t => <PosterCard key={t.id} title={t} onOpen={onOpen} />)}
            </div>
          )}
        </div>
      );
    }

    function Header({ currentUser, view, setView, search, setSearch, onOpenAccount }) {
      const [mobileSearchOpen, setMobileSearchOpen] = useState(false);
      return (
        <header className="sticky top-0 z-40 glass-panel border-b border-white/10 shadow-lg">
          <div className="max-w-7xl mx-auto px-3 md:px-4 py-2.5 md:py-3 flex items-center justify-between gap-3">
            <div className="flex items-center gap-6 min-w-0">
              <button onClick={() => setView('home')} className="flex items-center gap-2 font-black text-lg md:text-xl text-white group shrink-0">
                <span className="w-9 h-9 shrink-0 rounded-xl overflow-hidden group-hover:scale-105 transition"><CineVerseLogo className="w-full h-full" /></span>
                <span className="tracking-wide hidden xs:inline">Cine<span className="text-accent-cyan">Verse</span></span>
              </button>

              <nav className="hidden md:flex items-center gap-1.5 bg-glass-900/80 p-1 rounded-2xl border border-white/5">
                {[['home', 'الرئيسية'], ['movie', 'أفلام'], ['series', 'مسلسلات'], ['anime', 'أنمي'], ['watchlist', 'قائمتي']].map(([k, l]) => (
                  <button key={k} onClick={() => setView(k)} className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${view === k ? 'bg-accent-red text-white shadow-[0_0_15px_rgba(255,51,75,0.4)]' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}>{l}</button>
                ))}
              </nav>
            </div>

            <div className="flex items-center gap-2 md:gap-3 shrink-0">
              <div className="relative hidden md:block md:w-72">
                <Icon name="search" className="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3.5 text-slate-400" />
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="ابحث عن فيلم، مسلسل أو أنمي..."
                  className="w-full bg-glass-900 border border-white/10 rounded-2xl py-2.5 pr-10 pl-4 text-sm text-slate-100 outline-none focus:border-accent-cyan focus:ring-1 focus:ring-accent-cyan transition shadow-inner" />
              </div>

              <button onClick={() => setMobileSearchOpen(v => !v)} className="md:hidden w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-slate-200 shrink-0">
                <Icon name={mobileSearchOpen ? 'x' : 'search'} className="w-[18px] h-[18px]" />
              </button>

              <button onClick={onOpenAccount} className="w-10 h-10 rounded-2xl glass-card flex items-center justify-center hover:border-accent-cyan transition shrink-0 overflow-hidden">
                {currentUser && currentUser.avatar ? (
                  <img src={currentUser.avatar} alt="" className="w-full h-full object-cover" />
                ) : (
                  <Icon name="user" className={`w-5 h-5 ${currentUser ? 'text-accent-cyan' : 'text-slate-300'}`} />

    function AuthModal({ tab: initialTab, onClose, onSuccess }) {
      const [tab, setTab] = useState(initialTab);

      const [password, setPassword] = useState('');
      const [avatar, setAvatar] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        setError('');
        const cleanUser = username.trim().toLowerCase();
        const cleanPass = password.trim();
        const cleanName = name.trim();
        const cleanAvatar = avatar.trim();
        if (!cleanUser || !cleanPass || (tab === 'register' && !cleanName)) { setError('الرجاء ملء جميع الحقول الأساسية.'); return; }
        if (cleanUser.length < 3) { setError('اسم المستخدم قصير جدًا (٣ أحرف على الأقل).'); return; }
        setLoading(true);
        try {
          const snap = await db.ref('users').orderByChild('username').equalTo(cleanUser).once('value');
          const users = snap.val() || {};
          if (tab === 'register') {
            if (Object.keys(users).length > 0) { setError('اسم المستخدم مستخدم مسبقًا، اختر اسمًا آخر.'); setLoading(false); return; }
            const newUser = { name: cleanName, username: cleanUser, password: cleanPass, avatar: cleanAvatar, isModerator: false, banned: false, createdAt: Date.now() };
            const ref = await db.ref('users').push(newUser);
            onSuccess({ ...newUser, id: ref.key });
          } else {
            const matchedKey = Object.keys(users).find(k => users[k].password === cleanPass);
            if (!matchedKey) { setError('اسم المستخدم أو كلمة المرور غير صحيحة.'); setLoading(false); return; }
            if (users[matchedKey].banned) { setError('هذا الحساب محظور من قِبل الإدارة.'); setLoading(false); return; }
            onSuccess({ ...users[matchedKey], id: matchedKey });

        setLoading(false);
      };

    // مشغّل الفيديو: يدعم نطاق تشغيل مخصص (قص زمني)، وطريقة عرض مستقلة للجوال والحاسوب،
    // وقص/تكبير/دوران احترافي دقيق مبني على القياس الفعلي لأبعاد الفيديو الطبيعية وحجم إطار العرض،
    // بحيث تُطبَّق منطقة القص المختارة في لوحة التحكم بدقة أثناء المشاهدة الفعلية (وليست للمنظر فقط)
    function VideoPlayer({ src, onError, trimStart, trimEnd, fitMobile, fitDesktop, crop }) {
      const videoRef = useRef(null);
      const wrapRef = useRef(null);
      const [loading, setLoading] = useState(true);
      const [natural, setNatural] = useState({ w: 0, h: 0 });
      const [stage, setStage] = useState({ w: 0, h: 0 });
      const isMobile = useIsMobile();
      const c = crop || {};
      const fit = (isMobile ? fitMobile : fitDesktop) || 'contain';
      const cropReady = fit === 'crop' && c.active && c.width > 0 && c.height > 0 && stage.w > 0 && stage.h > 0 && natural.w > 0 && natural.h > 0;

      useEffect(() => {
        const videoEl = videoRef.current;
        if (!videoEl || !src) return;
        setLoading(true);
        let hls;
        const isM3u8 = /\.m3u8(\?.*)?$/i.test(src);
        if (isM3u8 && window.Hls && window.Hls.isSupported()) {
          hls = new window.Hls();
          hls.loadSource(src);
          hls.attachMedia(videoEl);
          hls.on(window.Hls.Events.ERROR, (_e, data) => { if (data && data.fatal) onError && onError(); });
        } else {
          videoEl.src = src;
        }
        return () => { if (hls) hls.destroy(); };
      }, [src]);

      // إنفاذ نطاق التشغيل المخصص (قص من البداية/النهاية)، وقراءة أبعاد الفيديو الطبيعية الحقيقية
      useEffect(() => {
        const videoEl = videoRef.current;
        if (!videoEl) return;
        const onLoaded = () => {
          if (trimStart) { try { videoEl.currentTime = trimStart; } catch (e) {} }
          setNatural({ w: videoEl.videoWidth || 0, h: videoEl.videoHeight || 0 });
        };
        const onTime = () => { if (trimEnd && videoEl.currentTime >= trimEnd) videoEl.pause(); };
        videoEl.addEventListener('loadedmetadata', onLoaded);
        videoEl.addEventListener('timeupdate', onTime);
        return () => { videoEl.removeEventListener('loadedmetadata', onLoaded); videoEl.removeEventListener('timeupdate', onTime); };
      }, [src, trimStart, trimEnd]);

      // قياس حجم إطار العرض فعليًا (يتغيّر مع الشاشة/الاتجاه) لحساب القص بدقة بكسل بكسل
      useEffect(() => {
        const el = wrapRef.current;
        if (!el || typeof ResizeObserver === 'undefined') return;
        const ro = new ResizeObserver(entries => {
          const cr = entries[0].contentRect;
          setStage({ w: cr.width, h: cr.height });
        });
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      // حالة عناصر التحكم المخصصة (تُستخدم فقط في وضع القص لأن أزرار المتصفح الأصلية تتحرك مع الفيديو المكبّر)
      const [ctrl, setCtrl] = useState({ playing: true, muted: true, current: 0, duration: 0 });
      useEffect(() => {
        const videoEl = videoRef.current;
        if (!videoEl) return;
        const onPlay = () => setCtrl(c2 => ({ ...c2, playing: true }));
        const onPause = () => setCtrl(c2 => ({ ...c2, playing: false }));
        const onVolume = () => setCtrl(c2 => ({ ...c2, muted: videoEl.muted }));
        const onLoadedMeta = () => setCtrl(c2 => ({ ...c2, duration: videoEl.duration || 0 }));
        const onTimeUpdate = () => setCtrl(c2 => ({ ...c2, current: videoEl.currentTime || 0 }));
        videoEl.addEventListener('play', onPlay);
        videoEl.addEventListener('pause', onPause);
        videoEl.addEventListener('volumechange', onVolume);
        videoEl.addEventListener('loadedmetadata', onLoadedMeta);
        videoEl.addEventListener('timeupdate', onTimeUpdate);
        return () => {
          videoEl.removeEventListener('play', onPlay);
          videoEl.removeEventListener('pause', onPause);
          videoEl.removeEventListener('volumechange', onVolume);
          videoEl.removeEventListener('loadedmetadata', onLoadedMeta);
          videoEl.removeEventListener('timeupdate', onTimeUpdate);
        };
      }, [src]);

      const togglePlay = () => { const v = videoRef.current; if (!v) return; if (v.paused) v.play(); else v.pause(); };
      const toggleMute = () => { const v = videoRef.current; if (!v) return; v.muted = !v.muted; };
      const seekTo = (val) => { const v = videoRef.current; if (v) v.currentTime = Number(val); };
      const skip = (delta) => {
        const v = videoRef.current;
        if (!v) return;
        const dur = v.duration || Infinity;
        v.currentTime = Math.min(Math.max(0, v.currentTime + delta), dur);
      };

      // ملء الشاشة: يجرّب أولاً ملء شاشة حاوية القص نفسها (كل بادئات المتصفحات)، وإن فشل ذلك أو لم تكن الحاوية
      // مدعومة (حالة آيفون سفاري) نلجأ لوضع "ملء شاشة بديل" بواسطة CSS بدل مشغل آيفون الأصلي — وذلك فقط إذا
      // كان هناك قص فعّال (cropReady)، لأن مشغل آيفون الأصلي (webkitEnterFullscreen) يعرض الفيديو خارج صفحتنا
      // بالكامل ولا يطبّق أي تعديل CSS/transform، فيتجاوز القص المخصص كليًا. إن لم يكن هناك قص فعلي، لا داعي
      // للوضع البديل ونستخدم مشغل آيفون الأصلي كما هو (تجربة أفضل: أزرار نظام أصلية، قفل الاتجاه...).
      const [isFs, setIsFs] = useState(false);
      const [pseudoFs, setPseudoFs] = useState(false);
      useEffect(() => {
        const onFsChange = () => {
          const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || document.mozFullScreenElement || document.msFullscreenElement;
          setIsFs(!!fsEl);
        };
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
        document.addEventListener('mozfullscreenchange', onFsChange);
        document.addEventListener('MSFullscreenChange', onFsChange);
        return () => {
          document.removeEventListener('fullscreenchange', onFsChange);
          document.removeEventListener('webkitfullscreenchange', onFsChange);
          document.removeEventListener('mozfullscreenchange', onFsChange);
          document.removeEventListener('MSFullscreenChange', onFsChange);
        };
      }, []);
      // تنظيف: إن أُزيل المشغل من الشجرة وهو بوضع ملء الشاشة البديل، نعيد تمرير الصفحة كما كان
      useEffect(() => () => { if (pseudoFs) document.body.style.overflow = ''; }, [pseudoFs]);
      const toggleFullscreen = () => {
        const el = wrapRef.current;
        const v = videoRef.current;

        // إذا كنا بالفعل بوضع ملء الشاشة البديل، الخروج منه فقط
        if (pseudoFs) {
          setPseudoFs(false);
          document.body.style.overflow = '';
          return;
        }

        const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        if (fsEl) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
          if (exit) exit.call(document);
          return;
        }

        const req = el && (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen);
        if (req) {
          const result = req.call(el);
          if (result && result.catch) {
            result.catch(() => {
              // فشل ملء الشاشة القياسي على حاوية القص (متوقع بآيفون سفاري): لو فيه قص فعّال نستخدم الوضع
              // البديل بدل مشغل آيفون الأصلي، لأن الأخير يتجاوز القص المخصص كليًا. غير هيك، نكمل بمشغل آيفون.
              if (cropReady) { setPseudoFs(true); document.body.style.overflow = 'hidden'; }
              else if (v && v.webkitEnterFullscreen) v.webkitEnterFullscreen();
            });
          }
        } else if (cropReady) {
          setPseudoFs(true);
          document.body.style.overflow = 'hidden';
        } else if (v && v.webkitEnterFullscreen) {
          // مسار آيفون بدون قص فعّال: سفاري آيفون لا يدعم تكبير عنصر عادي، فقط الفيديو نفسه
          v.webkitEnterFullscreen();
        }
      };

      // دعم أسهم لوحة المفاتيح للتقديم/التأخير 5 ثواني، ومفتاح المسافة أو Enter لإيقاف/تشغيل الفيديو (يتجاهل الكتابة داخل الحقول)
      useEffect(() => {
        const onKeyDown = (e) => {
          const active = document.activeElement;
          const tag = active ? active.tagName : '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || (active && active.isContentEditable)) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); skip(5); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); skip(-5); }
          else if (e.key === ' ' || e.code === 'Space' || e.key === 'Spacebar') { e.preventDefault(); togglePlay(); }
          else if (e.key === 'Enter') { e.preventDefault(); togglePlay(); }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      // حساب ستايل العرض بدقة: قص احترافي (منطقة x/y/width/height% من الفيديو الطبيعي + دوران)، أو ملء الشاشة، أو احتواء كامل
      let videoStyle = { objectFit: 'contain' };
      if (cropReady) {
        const rotation = c.rotation || 0;
        const rad = Math.abs(rotation) * Math.PI / 180;
        const overscale = Math.cos(rad) + Math.sin(rad); // تكبير إضافي لتفادي ظهور حواف فارغة عند الدوران
        const boxWpx = (c.width / 100) * natural.w;
        const boxHpx = (c.height / 100) * natural.h;
        const baseScale = Math.max(stage.w / boxWpx, stage.h / boxHpx);
        const scale = baseScale * overscale;
        const renderedW = natural.w * scale;
        const renderedH = natural.h * scale;
        const centerXpx = (((c.x || 0) + c.width / 2) / 100) * natural.w * scale;
        const centerYpx = (((c.y || 0) + c.height / 2) / 100) * natural.h * scale;
        const tx = stage.w / 2 - centerXpx;
        const ty = stage.h / 2 - centerYpx;
        videoStyle = {
          position: 'absolute', top: 0, left: 0,
          width: `${renderedW}px`, height: `${renderedH}px`,
          maxWidth: 'none', maxHeight: 'none',
          transformOrigin: `${(c.x || 0) + c.width / 2}% ${(c.y || 0) + c.height / 2}%`,
          transform: `translate(${tx}px, ${ty}px) rotate(${rotation}deg)`,
          objectFit: 'fill',
        };
      } else if (fit === 'cover') {
        videoStyle = { objectFit: 'cover' };
      }

      return (
        <div ref={wrapRef} className={`video-crop-wrap aspect-video ${pseudoFs ? 'pseudo-fullscreen' : ''}`}>
          {loading && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
              <div className="w-10 h-10 rounded-full border-2 border-white/20 border-t-accent-cyan animate-spin"></div>
            </div>
          )}
          <video ref={videoRef} controls={!cropReady} autoPlay muted playsInline webkit-playsinline="true"
            onCanPlay={() => setLoading(false)} onPlaying={() => setLoading(false)}
            onError={() => { setLoading(false); onError && onError(); }}
            style={videoStyle} />
          {cropReady && (
            <div className="absolute inset-x-0 bottom-0 z-20 flex items-center gap-2 px-2.5 py-2 bg-gradient-to-t from-black/85 via-black/40 to-transparent flex-wrap" style={{ touchAction: 'none' }}>
              <button type="button" onClick={() => skip(-5)} title="رجوع 5 ثواني" className="w-8 h-8 shrink-0 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-white text-[10px] font-black transition">-5</button>
              <button type="button" onClick={togglePlay} className="w-8 h-8 shrink-0 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-white transition">
                <Icon name={ctrl.playing ? 'pause' : 'play'} className="w-3.5 h-3.5 fill-current" />
              </button>
              <button type="button" onClick={() => skip(5)} title="تقديم 5 ثواني" className="w-8 h-8 shrink-0 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-white text-[10px] font-black transition">+5</button>
              <span className="text-[10px] font-mono text-white/80 shrink-0">{formatClock(ctrl.current)}</span>
              <input type="range" min="0" max={ctrl.duration || 0} step="0.1" value={ctrl.current}
                onChange={e => seekTo(e.target.value)} className="flex-1 min-w-[60px] accent-accent-cyan" />
              <span className="text-[10px] font-mono text-white/80 shrink-0">{formatClock(ctrl.duration)}</span>
              <button type="button" onClick={toggleMute} className="w-8 h-8 shrink-0 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-white text-sm transition">
                {ctrl.muted ? '🔇' : '🔊'}
              </button>
              <button type="button" onClick={toggleFullscreen} title={(isFs || pseudoFs) ? 'إنهاء ملء الشاشة' : 'ملء الشاشة'} className="w-8 h-8 shrink-0 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-white transition">
                <Icon name={(isFs || pseudoFs) ? 'minimize' : 'maximize'} className="w-3.5 h-3.5" />
              </button>
            </div>
          )}
        </div>
      );
    }

    function TitleModal({ title, allTitles, currentUser, liked, inWatchlist, onLike, onToggleWatchlist, onClose, onOpenAuth, getRole, onOpenProfile, onOpen }) {
      const [playingUrl, setPlayingUrl] = useState(null);
      const [playingMeta, setPlayingMeta] = useState({});
      const [activeSeason, setActiveSeason] = useState(0);
      const [commentText, setCommentText] = useState('');
      const [comments, setComments] = useState([]);
      const [replyingTo, setReplyingTo] = useState(null);
      const [replyText, setReplyText] = useState('');
      const [videoError, setVideoError] = useState(false);
      const [copied, setCopied] = useState(false);

      const [ratings, setRatings] = useState({});
      const [myStars, setMyStars] = useState(0);
      const [myReview, setMyReview] = useState('');
      const [savingRating, setSavingRating] = useState(false);
      const [ratingMsg, setRatingMsg] = useState('');
      const [deleteCommentTarget, setDeleteCommentTarget] = useState(null);
      const [deleteMyRating, setDeleteMyRating] = useState(false);

      useEffect(() => {
        setPlayingUrl(null); setActiveSeason(0); setCommentText(''); setReplyingTo(null); setVideoError(false);
        const ref = db.ref(`comments/${title.id}`);
        const cb = snap => {
          const data = snap.val();
          const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          list.sort((a, b) => (a.date || 0) - (b.date || 0));
          setComments(list);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [title.id]);

      useEffect(() => {
        const ref = db.ref(`ratings/${title.id}`);
        const cb = snap => {
          const data = snap.val() || {};
          setRatings(data);
          if (currentUser && data[currentUser.id]) {
            setMyStars(data[currentUser.id].stars || 0);
            setMyReview(data[currentUser.id].review || '');
          } else {
            setMyStars(0); setMyReview('');
          }
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [title.id, currentUser && currentUser.id]);

      // تسجيل هذا العمل في "أكمل المشاهدة" (محليًا بجهاز الزائر)
      useEffect(() => {
        try {
          const raw = JSON.parse(localStorage.getItem('cv_continue') || '[]');
          const next = [title.id, ...raw.filter(id => id !== title.id)].slice(0, 12);
          localStorage.setItem('cv_continue', JSON.stringify(next));
        } catch (e) {}
      }, [title.id]);

      const ratingList = Object.keys(ratings).map(uid => ({ uid, ...ratings[uid] })).sort((a, b) => (b.date || 0) - (a.date || 0));
      const avgRating = ratingList.length ? ratingList.reduce((s, r) => s + (r.stars || 0), 0) / ratingList.length : 0;
      const canModerate = currentUser && (() => { const role = getRole ? getRole(currentUser.username) : null; return role === 'admin' || role === 'moderator'; })();

      const submitRating = async () => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!myStars) { setRatingMsg('الرجاء اختيار عدد النجوم أولًا.'); return; }
        setSavingRating(true); setRatingMsg('');
        const payload = { stars: myStars, review: myReview.trim(), author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', date: Date.now() };
        try {
          await db.ref(`ratings/${title.id}/${currentUser.id}`).set(payload);
          await db.ref(`userRatings/${currentUser.id}/${title.id}`).set({ stars: myStars, review: myReview.trim(), date: Date.now() });
          setRatingMsg('تم حفظ تقييمك بنجاح.');
        } catch (e) { setRatingMsg('تعذر حفظ التقييم.'); }
        setSavingRating(false);
        setTimeout(() => setRatingMsg(''), 3000);
      };

      const removeMyRating = async () => {
        if (!currentUser) return;
        await db.ref(`ratings/${title.id}/${currentUser.id}`).remove();
        await db.ref(`userRatings/${currentUser.id}/${title.id}`).remove();
        setMyStars(0); setMyReview(''); setDeleteMyRating(false);
      };

      const roleRank = (username) => {
        const role = getRole ? getRole(username) : null;
        return role === 'admin' ? 2 : role === 'moderator' ? 1 : 0;
      };

      const seasons = (title.seasons || [])
        .map(s => ({ ...s, episodes: (s.episodes || []).slice().sort((a, b) => (a.number || 0) - (b.number || 0)) }))
        .sort((a, b) => (a.number || 0) - (b.number || 0));
      const isSeries = title.type !== 'movie';

      const firstEpisode = () => {
        for (const s of seasons) { if (s.episodes && s.episodes.length) return s.episodes[0]; }
        return null;
      };

      const handlePlay = () => {
        setVideoError(false);
        if (title.type === 'movie') { setPlayingUrl(title.videoUrl || null); setPlayingMeta(title); }
        else { const ep = firstEpisode(); setPlayingUrl(ep ? ep.videoUrl : null); setPlayingMeta(ep || {}); }
      };

      const playEpisode = (ep) => { setVideoError(false); setPlayingUrl(ep.videoUrl); setPlayingMeta(ep); };

      const shareLink = () => {
        const url = `${location.origin}${location.pathname}?t=${title.id}`;
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2200); });
        history.replaceState(null, '', `?t=${title.id}`);
      };

      const submitComment = async () => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!commentText.trim()) return;
        await db.ref(`comments/${title.id}`).push({ author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', text: commentText.trim(), date: Date.now(), likes: 0 });
        setCommentText('');
      };

      const submitReply = async (commentId) => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!replyText.trim()) return;
        const mentionName = (replyingTo && replyingTo.mentionName) ? replyingTo.mentionName : null;
        await db.ref(`comments/${title.id}/${commentId}/replies`).push({ author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', mentionName, text: replyText.trim(), date: Date.now() });
        setReplyText(''); setReplyingTo(null);
      };

      const toggleCommentLike = (commentId, comment) => {
        if (!currentUser) { onOpenAuth('login'); return; }
        const userKey = sanitizeKey(currentUser.username);
        const likedBy = comment.likedBy || {};
        const isLiked = !!likedBy[userKey];
        db.ref(`comments/${title.id}/${commentId}/likedBy/${userKey}`).set(isLiked ? null : true);
        db.ref(`comments/${title.id}/${commentId}/likes`).transaction(v => Math.max(0, (v || 0) + (isLiked ? -1 : 1)));
      };

      // حذف تعليق: صاحب التعليق نفسه أو المشرف/المدير
      const canDeleteComment = (c) => canModerate || (currentUser && currentUser.username === c.username);
      const deleteComment = (commentId) => db.ref(`comments/${title.id}/${commentId}`).remove();
      const deleteReply = (commentId, replyId) => db.ref(`comments/${title.id}/${commentId}/replies/${replyId}`).remove();

      const similarTitles = (allTitles || []).filter(t => t.id !== title.id && t.status === 'published' && (t.genres || []).some(g => (title.genres || []).includes(g))).slice(0, 8);

      return (
        <div className="modal-backdrop fixed inset-0 z-50 bg-black/90 backdrop-blur-lg md:p-6 md:flex md:items-center md:justify-center overflow-y-auto" onClick={onClose}>
          <div onClick={e => e.stopPropagation()} className="sheet-panel glass-panel w-full min-h-screen md:min-h-0 md:max-h-[92vh] md:max-w-3xl md:rounded-3xl overflow-y-auto border border-white/10 shadow-2xl">
            <div className="relative">
              {playingUrl ? (
                <div className="relative">
                  {isDirectVideo(playingUrl) ? (
                    <VideoPlayer key={playingUrl} src={normalizeVideoUrl(playingUrl)} onError={() => setVideoError(true)}
                      trimStart={playingMeta.trimStart} trimEnd={playingMeta.trimEnd}
                      fitMobile={playingMeta.fitMobile} fitDesktop={playingMeta.fitDesktop} crop={playingMeta.crop} />
                  ) : (
                    <iframe key={playingUrl} src={normalizeVideoUrl(playingUrl)} allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowFullScreen
                      referrerPolicy="no-referrer-when-downgrade" className="w-full aspect-video bg-black" />
                  )}
                  {videoError && (
                    <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center gap-3 p-6 text-center">
                      <p className="text-sm text-slate-200 font-bold">تعذّر تشغيل الفيديو على هذا الجهاز.</p>
                      {isIOS && (
                        <p className="text-xs text-slate-400 max-w-xs leading-relaxed">غالبًا السبب أن ملف الفيديو غير مرفوع بصيغة يدعمها الآيفون مباشرة. الأعمال التي تُرفع من لوحة التحكم عبر زر "رفع من الجهاز" تعمل بشكل صحيح على كل الأجهزة.</p>
                      )}
                      <button onClick={() => window.open(normalizeVideoUrl(playingUrl), '_blank', 'noopener,noreferrer')} className="px-5 py-2.5 rounded-xl bg-accent-red hover:bg-accent-redHover text-xs font-bold text-white transition">محاولة فتح الرابط مباشرة</button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="relative w-full aspect-video bg-glass-900">
                  {title.backdrop && <img src={title.backdrop} alt="" className="w-full h-full object-cover" />}
                  <div className="absolute inset-0 bg-gradient-to-t from-glass-950 via-black/40 to-transparent flex items-center justify-center">
                    <button onClick={handlePlay} className="w-[72px] h-[72px] rounded-3xl bg-accent-red hover:bg-accent-redHover flex items-center justify-center shadow-[0_0_30px_rgba(255,51,75,0.6)] transform hover:scale-110 transition">
                      <Icon name="play" className="w-8 h-8 text-white fill-current translate-x-0.5" />
                    </button>
                  </div>
                </div>
              )}
              <button onClick={onClose} className="absolute top-4 left-4 w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-black transition">
                <Icon name="x" className="w-5 h-5" />
              </button>
              <button onClick={shareLink} title="نسخ رابط المشاركة" className="absolute top-4 right-4 w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-black transition">
                <Icon name={copied ? 'check' : 'link'} className={`w-4 h-4 ${copied ? 'text-emerald-400' : ''}`} />
              </button>
            </div>

            <div className="p-5 md:p-8">
              <div className="flex items-center gap-2.5 flex-wrap mb-3">
                <span className="text-xs px-3 py-1 rounded-full bg-accent-red text-white font-bold shadow-[0_0_12px_rgba(255,51,75,0.4)]">{TYPE_LABELS[title.type]}</span>
                <span className="text-xs text-slate-300 font-semibold">{title.year}</span>
                <RatingBadges imdb={title.imdbRating} rt={title.rtRating} />
                {ratingList.length > 0 && (
                  <span className="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-md bg-black/60 backdrop-blur-md text-amber-400 font-bold border border-amber-400/20 shadow-sm">
                    <Icon name="star" className="w-3 h-3" />{avgRating.toFixed(1)} ({ratingList.length})
                  </span>
                )}
              </div>
              <h2 className="text-2xl md:text-3xl font-black mb-3 text-white">{title.name}</h2>
              {title.genres && title.genres.length > 0 && (
                <div className="flex gap-2 flex-wrap mb-4">
                  {title.genres.map(g => <span key={g} className="text-xs px-3 py-1 rounded-xl glass-card text-slate-300 border border-white/5 font-semibold">{g}</span>)}
                </div>
              )}
              {title.description && <p className="text-sm md:text-base text-slate-300 leading-relaxed mb-6 font-medium">{title.description}</p>}
              {(title.director || title.writer) && (
                <div className="flex items-center gap-4 flex-wrap mb-6 -mt-3 text-xs text-slate-400 font-semibold">
                  {title.director && <span>الإخراج: <span className="text-slate-200">{title.director}</span></span>}
                  {title.writer && <span>الكتابة: <span className="text-slate-200">{title.writer}</span></span>}
                </div>
              )}

              <div className="flex items-center gap-3 flex-wrap mb-6">
                <button onClick={handlePlay} className="flex items-center gap-2.5 px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover text-sm font-bold text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition">
                  <Icon name="play" className="w-4 h-4 fill-current" />تشغيل
                </button>
                {title.type === 'movie' && title.downloadUrl && (
                  <a href={title.downloadUrl} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2.5 px-6 py-3 rounded-2xl glass-card border border-white/10 hover:border-accent-cyan text-sm font-bold text-slate-200 transition">
                    <Icon name="download" className="w-4 h-4 text-accent-cyan" />تحميل

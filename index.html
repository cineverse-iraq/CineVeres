<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cinadam - أفلام ومسلسلات وأنمي</title>

  <!-- تحميل خط الموقع أول شي بالصفحة (قبل أي سكربت) حتى ما تطلع شاشة التحميل بخط افتراضي ثم تتبدل -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: { xs: '420px', sm: '640px', md: '768px', lg: '1024px', xl: '1280px', '2xl': '1536px' },
        extend: {
          colors: {
            glass: {
              950: '#07090E',
              900: '#0E131F',
              800: '#161E2E',
              700: '#222D44',
              600: '#33415C',
            },
            accent: {
              red: '#FF334B',
              redHover: '#FF1F38',
              cyan: '#00F0FF',
              purple: '#A855F7',
              gold: '#F59E0B'
            }
          },
          fontFamily: { cairo: ['Cairo','sans-serif'] }
        }
      }

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Cairo', sans-serif; background-color: #07090E; color: #F8FAFC; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    * { -webkit-tap-highlight-color: transparent; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    :root { --liquid: cubic-bezier(0.32, 1.5, 0.55, 1); --spring: cubic-bezier(0.32, 1.5, 0.55, 1); --spring-fast: cubic-bezier(0.3, 1.6, 0.5, 1); --collapse: cubic-bezier(0.4, 0, 0.7, 0.2); }

    @keyframes fadeInBackdrop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOutBackdrop { from { opacity: 1; } to { opacity: 0; } }
    @keyframes scaleInPanel { from { opacity: 0; transform: scale(0.92) translateY(14px); filter: blur(4px); } to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
    @keyframes scaleOutPanel { from { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } to { opacity: 0; transform: scale(0.94) translateY(10px); filter: blur(3px); } }
    @keyframes slideUpSheet { from { opacity: 0; transform: translateY(38px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideDownSheet { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(30px) scale(0.98); } }
    @keyframes fadeInContent { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .modal-backdrop { animation: fadeInBackdrop 0.24s ease-out; backdrop-filter: blur(12px); transition: backdrop-filter 0.24s ease-out; }
    .modal-backdrop-out { animation: fadeOutBackdrop 0.2s var(--collapse) forwards; }
    .modal-panel { animation: scaleInPanel 0.38s var(--liquid); }
    .modal-panel-out { animation: scaleOutPanel 0.22s var(--collapse) forwards; }
    .sheet-panel { animation: slideUpSheet 0.4s var(--liquid); }
    .sheet-panel-out { animation: slideDownSheet 0.24s var(--collapse) forwards; }
    .page-fade-in { animation: fadeInContent 0.32s var(--liquid); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(12px) scale(0.94); } }
    .toast-item { animation: toastIn 0.32s var(--liquid); }
    .toast-item-out { animation: toastOut 0.22s var(--collapse) forwards; }

    @keyframes itemSinkIn { 0% { opacity: 0; transform: scale(0.7) translateY(-16px); } 60% { opacity: 1; transform: scale(1.04) translateY(2px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes itemPopOut { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.6) translateY(14px); } }
    .item-sink-in { animation: itemSinkIn 0.34s var(--spring); }
    .item-pop-out { animation: itemPopOut 0.3s var(--collapse) forwards; }
    @keyframes rowSinkIn { 0% { opacity: 0; transform: translateY(-10px) scale(0.96); max-height: 0; } 100% { opacity: 1; transform: translateY(0) scale(1); max-height: 80px; } }
    @keyframes rowPopOut { 0% { opacity: 1; transform: scale(1) translateX(0); max-height: 80px; } 100% { opacity: 0; transform: scale(0.85) translateX(14px); max-height: 0; } }
    .row-sink-in { animation: rowSinkIn 0.36s var(--spring); overflow: hidden; }
    .row-pop-out { animation: rowPopOut 0.3s var(--collapse) forwards; overflow: hidden; }

    @keyframes islandExpand { 0% { opacity: 0; transform: translateX(-50%) scale(0.35); } 55% { opacity: 1; transform: translateX(-50%) scale(1.04); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
    @keyframes islandCollapse { 0% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; transform: translateX(-50%) scale(0.5); } }
    .island-in { animation: islandExpand 0.5s var(--spring); transform-origin: top center; }
    .island-out { animation: islandCollapse 0.26s var(--collapse) forwards; transform-origin: top center; }

    .nav-pill-active { transition: transform 0.45s var(--spring), width 0.45s var(--spring); }

    .mobile-search-morph { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.3s var(--collapse), opacity 0.2s ease; }
    .mobile-search-morph.open { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.3s var(--liquid), opacity 0.22s ease; }
    .mobile-search-morph > div { overflow: hidden; min-height: 0; }
    img { transition: opacity 0.35s ease; }
    button, a { -webkit-tap-highlight-color: transparent; transition: transform 0.18s var(--spring), background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.3s ease, color 0.25s ease; }
    button:active { transform: scale(0.96); }
    input, textarea, select { font-size: 16px !important; transition: border-color 0.25s ease, box-shadow 0.25s ease; }
    @media (min-width: 768px) { input, textarea, select { font-size: 14px !important; } }

    .glass-panel {
      background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0) 38%), rgba(14, 19, 31, 0.72);
      backdrop-filter: blur(26px) saturate(1.7);
      -webkit-backdrop-filter: blur(26px) saturate(1.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.09);
    }

    .glass-card {
      background: linear-gradient(165deg, rgba(255,255,255,0.07), rgba(255,255,255,0) 45%), rgba(22, 30, 46, 0.55);
      backdrop-filter: blur(16px) saturate(1.6);
      -webkit-backdrop-filter: blur(16px) saturate(1.6);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: all 0.35s var(--liquid, var(--spring));
    }
    .glass-card:hover {
      border-color: rgba(0, 240, 255, 0.42);
      box-shadow: 0 12px 34px -10px rgba(0, 240, 255, 0.25), inset 0 1px 0 rgba(255,255,255,0.12);
      transform: translateY(-1.5px);
    }

    .auth-pill-highlight { transition: inset-inline-start 0.5s var(--liquid, var(--spring)); }

    html { width: 100%; height: 100%; }
    body { overflow-x: hidden; width: 100%; overscroll-behavior-y: none; }
    #root { overflow-x: hidden; min-height: 100%; }

    .star-btn { transition: transform 0.15s ease, color 0.15s ease; }
    .star-btn:active { transform: scale(1.2); }

    .profile-poster-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media (min-width: 640px) { .profile-poster-grid { grid-template-columns: repeat(6, 1fr); gap: 10px; } }
    @media (min-width: 768px) { .profile-poster-grid { grid-template-columns: repeat(8, 1fr); } }

    @media (max-width: 767px) {
      .mobile-safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 84px) !important; }
      h1 { font-size: 1.4rem !important; }
      .glass-panel, .glass-card { border-radius: 18px; }
    }

    .video-crop-wrap { position: relative; width: 100%; overflow: hidden; background: #000; }
    .video-crop-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .video-crop-wrap:fullscreen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .video-crop-wrap:-webkit-full-screen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .video-crop-wrap:-moz-full-screen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .video-crop-wrap:-ms-fullscreen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .ios-fake-fullscreen { position: fixed !important; inset: 0 !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; z-index: 9999 !important; }

    .yt-controls-bottom {
      position: absolute; inset-inline: 0; bottom: 0; z-index: 20;
      background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.35) 60%, transparent);
      padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .yt-controls-bottom.hidden-bar { opacity: 0; pointer-events: none; transform: translateY(6px); }
    .yt-progress:focus, .yt-vol:focus { outline: none !important; box-shadow: none !important; }
    .yt-progress { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.25); outline: none; cursor: pointer; }
    .yt-progress::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #00F0FF; box-shadow: 0 0 8px rgba(0,240,255,0.8); cursor: pointer; margin-top: -4.5px; }
    .yt-progress::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #00F0FF; border: none; box-shadow: 0 0 8px rgba(0,240,255,0.8); cursor: pointer; }
    .yt-progress::-moz-range-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.25); }
    .yt-vol { -webkit-appearance: none; appearance: none; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.3); outline: none; cursor: pointer; }
    .yt-vol::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -3.5px; }
    .yt-vol::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: none; cursor: pointer; }
    .yt-btn { display: flex; align-items: center; justify-content: center; color: #fff; transition: opacity 0.15s ease, transform 0.1s ease; opacity: 0.9; }
    .yt-btn:hover { opacity: 1; }
    .yt-btn:focus, .yt-btn:focus-visible { outline: none !important; box-shadow: none !important; }
    .yt-btn:active { transform: scale(0.9); }
    @keyframes yt-skip-flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
    .yt-skip-flash { animation: yt-skip-flash 0.55s ease-out forwards; }
    @keyframes yt-spin { to { transform: rotate(360deg); } }
    .yt-spinner { animation: yt-spin 0.9s linear infinite; }
    .cv-row-dragger { display: none; }
    @media (min-width: 768px) {
      .cv-row-dragger { display: block; position: relative; height: 14px; margin-top: 1px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; direction: ltr; }
      .cv-row-dragger:active { cursor: grabbing; }
      .cv-row-dragger:focus-visible .cv-row-thumb { box-shadow: 0 0 0 3px rgba(0,240,255,.16), 0 0 10px rgba(0,240,255,.35); }
      .cv-row-track { position: absolute; left: 0; right: 0; top: 5px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.14); }
      .cv-row-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: inherit; background: rgba(0,240,255,.85); pointer-events: none; }
      .cv-row-thumb { position: absolute; top: 50%; width: 30px; height: 6px; border-radius: 999px; background: #00F0FF; transform: translate(-50%,-50%); box-shadow: 0 0 8px rgba(0,240,255,.35); pointer-events: none; }
    }
    .cv-skip-zone { position:absolute; top:18%; bottom:18%; width:31%; z-index:21; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    .cv-skip-zone.left { left:0; } .cv-skip-zone.right { right:0; }
    .cv-skip-circle { width:74px; height:74px; border-radius:9999px; background:rgba(0,0,0,.58); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.28); animation:cvSkipPop .42s ease-out forwards; }
    .cv-skip-circle svg { width:25px; height:25px; }
    .cv-skip-circle span { font-size:11px; font-weight:900; line-height:1; margin-top:3px; direction:ltr; }
    @keyframes cvSkipPop { 0% { opacity:0; transform:scale(.65); } 25% { opacity:1; transform:scale(1.08); } 100% { opacity:0; transform:scale(1); } }
  </style>
  <style>
    .cv-nocursor, .cv-nocursor * { cursor: none !important; }
    html.cv-low-power .glass-panel, html.cv-low-power .glass-card {
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    html.cv-low-power * {
      scroll-behavior: auto !important;
    }
    html.cv-low-power img {
      transition: none !important;
    }
    html.cv-low-power .glass-card:hover {
      transform: none !important;
      box-shadow: none !important;
    }
    html.cv-low-power main section { content-visibility: auto; contain-intrinsic-size: 320px; }
    @media (max-width: 767px) {
      html.cv-low-power .page-fade-in,
      html.cv-low-power .toast-item,
      html.cv-low-power .modal-panel,
      html.cv-low-power .sheet-panel,
      html.cv-low-power .island-in {
        animation-duration: .01ms !important;
      }
    }
    /* Adaptive rendering: keep the UI responsive on old Android/low-memory devices. */
    html.cv-android .glass-panel,
    html.cv-android .glass-card {
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
    }
    html.cv-android .glass-panel { box-shadow: 0 4px 18px rgba(0,0,0,.24) !important; }
    html.cv-android .glass-card { box-shadow: 0 3px 14px rgba(0,0,0,.20) !important; transition: border-color .15s ease, background-color .15s ease !important; }
    html.cv-android .glass-card:hover { transform: none !important; box-shadow: 0 3px 14px rgba(0,0,0,.20) !important; }
    html.cv-android img { content-visibility: auto; contain: paint; }
    html.cv-android .page-fade-in,
    html.cv-android .modal-panel,
    html.cv-android .sheet-panel,
    html.cv-android .island-in { animation-duration: .08s !important; }
    html.cv-very-low * { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    html.cv-very-low .glass-panel,
    html.cv-very-low .glass-card { box-shadow: none !important; background: rgba(14,19,31,.94) !important; }
    html.cv-very-low img { filter: none !important; transition: none !important; }
    html.cv-very-low main section { content-visibility: auto; contain: layout paint style; contain-intrinsic-size: 280px; }
    html.cv-very-low .hero,
    html.cv-very-low [class*="backdrop-blur"] { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    /* لا نريد أي خط تركيز/إطار متصفح يبقى بعد الضغط على أزرار المشغل. */
    button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus:not(:focus-visible), a:focus:not(:focus-visible), [role="button"]:focus:not(:focus-visible) { outline: none !important; box-shadow: none !important; }
    .cv-player-menu { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; user-select: none; -webkit-user-select: none; }
    .cv-player-menu button, .cv-player-menu label { touch-action: manipulation; user-select: none !important; -webkit-user-select: none !important; caret-color: transparent !important; }
    .cv-player-menu input, .cv-player-menu select { user-select: auto; -webkit-user-select: auto; caret-color: auto; }
    /* أزرار المشغل ليست حقول كتابة؛ لا نريد ظهور مؤشر نص/خط تركيز بعد النقر. */
    .yt-btn, .yt-btn *, [data-skip-intro], [data-skip-intro] *, .cv-player-menu button, .cv-player-menu button * { caret-color: transparent !important; }
    .cv-subtitle-overlay { pointer-events: none !important; user-select: none !important; -webkit-user-select: none !important; caret-color: transparent !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }
    </style>
</head>
<body class="bg-glass-950 text-slate-100 min-h-screen selection:bg-accent-red selection:text-white">
  <style>
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    #bootLoader { position: fixed; inset: 0; z-index: 9999; background: #07090E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity 0.35s ease; }
    #bootLoader.fading { opacity: 0; pointer-events: none; }
    #bootLoader .boot-logo { width: 72px; height: 72px; animation: bootPulse 1.6s ease-in-out infinite; }
    @keyframes bootPulse { 0%,100% { opacity: 0.75; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.03); } }
    #bootLoader .spin { width: 30px; height: 30px; border-radius: 9999px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #00F0FF; animation: bootSpin 0.8s linear infinite; }
    #bootLoader p { color: #94a3b8; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; }
    #bootLoader b { color: #00F0FF; }
  </style>
  <div id="bootLoader">
    <svg class="boot-logo" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bootGlassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E9D5FF"/><stop offset="45%" stop-color="#A855F7"/><stop offset="100%" stop-color="#00F0FF"/>

        </linearGradient>
        <linearGradient id="bootGlassFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3b2a5c" stop-opacity="0.7"/><stop offset="100%" stop-color="#161E2E" stop-opacity="0.7"/>

        <linearGradient id="bootReelFill" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#241536" stop-opacity="0.95"/><stop offset="100%" stop-color="#0E131F" stop-opacity="0.95"/>
        </linearGradient>
      </defs>
      <path d="M 195 555 C 140 500, 150 400, 235 355 C 300 320, 380 340, 420 400" fill="none" stroke="url(#bootFilmStrip)" stroke-width="46" stroke-linecap="round" opacity="0.9"/>
      <path d="M 640 400 C 720 330, 810 320, 870 380 C 925 435, 915 520, 850 570" fill="none" stroke="url(#bootFilmStrip)" stroke-width="46" stroke-linecap="round" opacity="0.9"/>

  <script>
    (function () {
      var forceHideTimeout = setTimeout(function () {
        var loader = document.getElementById('bootLoader');
        if (loader && !loader.classList.contains('fading')) {
          loader.innerHTML =

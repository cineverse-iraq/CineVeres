    const FIT_OPTIONS = [['contain', 'احتواء كامل (بدون قص)'], ['cover', 'ملء الشاشة (تمدد)'], ['crop', 'قص احترافي مخصص']];
    const CROP_ASPECTS = [['free', 'حر'], ['16:9', '16:9'], ['9:16', '9:16'], ['1:1', '1:1'], ['4:3', '4:3'], ['3:4', '3:4']];

    function parseAspectRatio(key) {
      if (!key || key === 'free') return null;
      const parts = key.split(':').map(Number);
      return parts[0] / parts[1];
    }

    function formatClock(sec) {
      sec = Math.max(0, sec || 0);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
      const p = n => String(n).padStart(2, '0');
      return h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
    }

    // خوارزمية تغيير حجم صندوق القص عبر المقابض الثمانية (سحب حر لكل حافة/زاوية)، مع دعم قفل نسبة العرض للارتفاع
    function resizeCropBox(handle, start, dxPct, dyPct, ratioLock) {
      const MIN = 5;
      let { x, y, w, h } = start;
      const anchorRight = x + w, anchorBottom = y + h;
      const anchorCenterX = x + w / 2, anchorCenterY = y + h / 2;
      let nx = x, ny = y, nw = w, nh = h;

      if (handle.includes('e')) nw = w + dxPct;
      if (handle.includes('w')) { nw = w - dxPct; nx = x + dxPct; }
      if (handle.includes('s')) nh = h + dyPct;
      if (handle.includes('n')) { nh = h - dyPct; ny = y + dyPct; }

      nw = Math.max(MIN, nw);
      nh = Math.max(MIN, nh);

      if (ratioLock) {
        const isEdgeH = handle === 'e' || handle === 'w';
        const isEdgeV = handle === 'n' || handle === 's';
        const driveW = isEdgeH ? true : isEdgeV ? false : Math.abs(dxPct) >= Math.abs(dyPct);
        if (driveW) nh = Math.max(MIN, nw / ratioLock); else nw = Math.max(MIN, nh * ratioLock);

        if (handle === 'e') { ny = anchorCenterY - nh / 2; }
        else if (handle === 'w') { nx = anchorRight - nw; ny = anchorCenterY - nh / 2; }
        else if (handle === 'n') { nx = anchorCenterX - nw / 2; ny = anchorBottom - nh; }
        else if (handle === 's') { nx = anchorCenterX - nw / 2; }
        else if (handle === 'ne') { ny = anchorBottom - nh; }
        else if (handle === 'sw') { nx = anchorRight - nw; }
        else if (handle === 'nw') { nx = anchorRight - nw; ny = anchorBottom - nh; }
        // se: تبقى x وy كما هي (زاوية الإرساء)
      }

      nx = Math.max(0, Math.min(nx, 100 - nw));
      ny = Math.max(0, Math.min(ny, 100 - nh));
      nw = Math.min(nw, 100 - nx);
      nh = Math.min(nh, 100 - ny);
      return { x: nx, y: ny, w: nw, h: nh };
    }

    // أداة قص احترافية فعلية للفيديو: سحب مقابض حقيقية، قفل نسب عرض/ارتفاع قياسية، دوران دقيق، وخط زمني لمعاينة أي لحظة قبل التأكيد
    function CropStudioModal({ videoUrl, initial, onCancel, onSave }) {
      const videoRef = useRef(null);
      const stageRef = useRef(null);
      const dragRef = useRef(null);
      const [natural, setNatural] = useState({ w: 0, h: 0 });
      const [stageSize, setStageSize] = useState({ w: 0, h: 0 });
      const [boxPct, setBoxPct] = useState(() => ({
        x: initial && initial.x != null ? initial.x : 0,
        y: initial && initial.y != null ? initial.y : 0,
        w: initial && initial.width ? initial.width : 100,
        h: initial && initial.height ? initial.height : 100,
      }));
      const [rotation, setRotation] = useState(initial && initial.rotation ? initial.rotation : 0);
      const [aspect, setAspect] = useState('free');
      const [duration, setDuration] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const el = stageRef.current;
        if (!el || typeof ResizeObserver === 'undefined') return;
        const ro = new ResizeObserver(entries => {
          const cr = entries[0].contentRect;
          setStageSize({ w: cr.width, h: cr.height });
        });
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      useEffect(() => {
        const v = videoRef.current;
        if (!v) return;
        const onLoaded = () => { setNatural({ w: v.videoWidth || 0, h: v.videoHeight || 0 }); setDuration(v.duration || 0); setReady(true); };
        const onTime = () => setCurrentTime(v.currentTime || 0);
        const onPlay = () => setPlaying(true);
        const onPause = () => setPlaying(false);
        v.addEventListener('loadedmetadata', onLoaded);
        v.addEventListener('timeupdate', onTime);
        v.addEventListener('play', onPlay);
        v.addEventListener('pause', onPause);
        return () => {
          v.removeEventListener('loadedmetadata', onLoaded); v.removeEventListener('timeupdate', onTime);
          v.removeEventListener('play', onPlay); v.removeEventListener('pause', onPause);
        };
      }, [videoUrl]);

      // مستطيل عرض الفيديو الفعلي داخل المسرح (الفيديو معروض بوضع "احتواء كامل" فقد تظهر أشرطة سوداء أعلى/أسفل أو يمين/يسار)
      const renderedRect = React.useMemo(() => {
        if (!natural.w || !natural.h || !stageSize.w || !stageSize.h) return { left: 0, top: 0, width: stageSize.w || 0, height: stageSize.h || 0 };
        const stageAspect = stageSize.w / stageSize.h, vidAspect = natural.w / natural.h;
        let w, h;
        if (vidAspect > stageAspect) { w = stageSize.w; h = w / vidAspect; } else { h = stageSize.h; w = h * vidAspect; }
        return { left: (stageSize.w - w) / 2, top: (stageSize.h - h) / 2, width: w, height: h };
      }, [natural, stageSize]);

      // قفل نسبة العرض للارتفاع محسوبًا كنسبة "٪عرض إلى ٪ارتفاع" (وليس بكسل حقيقي) لأن أبعاد الفيديو الطبيعية ليست بالضرورة مربعة
      const ratioLock = React.useMemo(() => {
        const ar = parseAspectRatio(aspect);
        if (!ar || !natural.w || !natural.h) return null;
        return ar * (natural.h / natural.w);
      }, [aspect, natural]);

      useEffect(() => {
        if (!ratioLock) return;
        setBoxPct(prev => {
          const cx = prev.x + prev.w / 2, cy = prev.y + prev.h / 2;
          let w = prev.w, h = w / ratioLock;
          if (h > 100) { h = 100; w = h * ratioLock; }
          if (w > 100) { w = 100; h = w / ratioLock; }
          let x = Math.max(0, Math.min(cx - w / 2, 100 - w));
          let y = Math.max(0, Math.min(cy - h / 2, 100 - h));
          return { x, y, w, h };
        });
        // eslint-disable-next-line
      }, [ratioLock]);

      const beginDrag = (e, mode) => {
        e.preventDefault(); e.stopPropagation();
        dragRef.current = { mode, startX: e.clientX, startY: e.clientY, startBox: { ...boxPct } };
        try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
      };
      const onDragMove = (e) => {
        const drag = dragRef.current;
        if (!drag || !renderedRect.width || !renderedRect.height) return;
        const dxPct = (e.clientX - drag.startX) / renderedRect.width * 100;
        const dyPct = (e.clientY - drag.startY) / renderedRect.height * 100;
        if (drag.mode === 'move') {
          const nx = Math.max(0, Math.min(drag.startBox.x + dxPct, 100 - drag.startBox.w));
          const ny = Math.max(0, Math.min(drag.startBox.y + dyPct, 100 - drag.startBox.h));
          setBoxPct({ ...drag.startBox, x: nx, y: ny });
        } else {
          setBoxPct(resizeCropBox(drag.mode, drag.startBox, dxPct, dyPct, ratioLock));
        }
      };
      const endDrag = () => { dragRef.current = null; };

      const resetAll = () => { setBoxPct({ x: 0, y: 0, w: 100, h: 100 }); setRotation(0); setAspect('free'); };
      const togglePlay = () => { const v = videoRef.current; if (!v) return; if (v.paused) v.play(); else v.pause(); };
      const seek = (val) => { const v = videoRef.current; if (!v) return; v.currentTime = val; setCurrentTime(val); };
      const confirm = () => onSave({ active: true, x: boxPct.x, y: boxPct.y, width: boxPct.w, height: boxPct.h, rotation });

      const corners = [['nw', '0%', '0%', 'nwse-resize'], ['ne', '100%', '0%', 'nesw-resize'], ['sw', '0%', '100%', 'nesw-resize'], ['se', '100%', '100%', 'nwse-resize']];
      const edges = [['n', '50%', '0%', 'ns-resize', 'w-9 h-2.5 rounded-full'], ['s', '50%', '100%', 'ns-resize', 'w-9 h-2.5 rounded-full'], ['w', '0%', '50%', 'ew-resize', 'w-2.5 h-9 rounded-full'], ['e', '100%', '50%', 'ew-resize', 'w-2.5 h-9 rounded-full']];

      return ReactDOM.createPortal((
        <div className="modal-backdrop fixed inset-0 z-[80] bg-black flex flex-col" onClick={e => e.stopPropagation()} style={{ touchAction: 'none' }}>
          <div className="flex items-center justify-between px-4 py-3 border-b border-white/10 shrink-0">
            <span className="flex items-center gap-2 font-black text-white text-sm"><Icon name="crop" className="w-4 h-4 text-accent-cyan" />قص الفيديو الاحترافي</span>
            <button type="button" onClick={onCancel} className="w-9 h-9 rounded-xl glass-card border border-white/10 hover:border-accent-cyan flex items-center justify-center text-slate-300 hover:text-white transition"><Icon name="x" className="w-4 h-4" /></button>
          </div>

          <div ref={stageRef} className="relative flex-1 min-h-0 bg-black overflow-hidden select-none" style={{ touchAction: 'none' }}>
            {!ready && (
              <div className="absolute inset-0 flex items-center justify-center">
                <div className="w-10 h-10 rounded-full border-2 border-white/20 border-t-accent-cyan animate-spin"></div>
              </div>
            )}
            <video ref={videoRef} src={videoUrl} muted playsInline webkit-playsinline="true" preload="metadata"
              className="absolute inset-0 w-full h-full pointer-events-none" style={{ objectFit: 'contain' }} />
            {ready && renderedRect.width > 0 && (
              <div className="absolute" style={{ left: renderedRect.left, top: renderedRect.top, width: renderedRect.width, height: renderedRect.height, overflow: 'hidden' }}>
                <div
                  onPointerDown={e => beginDrag(e, 'move')} onPointerMove={onDragMove} onPointerUp={endDrag}
                  className="absolute cursor-move border-2 border-white"
                  style={{ left: `${boxPct.x}%`, top: `${boxPct.y}%`, width: `${boxPct.w}%`, height: `${boxPct.h}%`, boxShadow: '0 0 0 2000px rgba(0,0,0,0.65)' }}>
                  <div className="absolute left-0 right-0 top-1/2 -translate-y-1/2 border-t border-dashed border-white/50 pointer-events-none"></div>
                  <div className="absolute top-0 bottom-0 left-1/2 -translate-x-1/2 border-r border-dashed border-white/50 pointer-events-none"></div>
                  {corners.map(([id, left, top, cursor]) => (
                    <div key={id} onPointerDown={e => beginDrag(e, id)} onPointerMove={onDragMove} onPointerUp={endDrag}
                      className="absolute w-4 h-4 bg-white rounded-md border border-glass-950 shadow-md -translate-x-1/2 -translate-y-1/2"
                      style={{ left, top, cursor }}></div>
                  ))}
                  {edges.map(([id, left, top, cursor, sizeCls]) => (
                    <div key={id} onPointerDown={e => beginDrag(e, id)} onPointerMove={onDragMove} onPointerUp={endDrag}
                      className={`absolute bg-white border border-glass-950 shadow-md -translate-x-1/2 -translate-y-1/2 ${sizeCls}`}
                      style={{ left, top, cursor }}></div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className="px-4 py-3 border-t border-white/10 shrink-0 space-y-3">
            <div className="flex items-center gap-3">
              <button type="button" onClick={togglePlay} className="w-8 h-8 rounded-lg glass-card border border-white/10 flex items-center justify-center text-accent-cyan shrink-0">
                <Icon name={playing ? 'pause' : 'play'} className="w-3.5 h-3.5" />
              </button>
              <span className="text-xs font-mono text-accent-cyan shrink-0">{formatClock(currentTime)}</span>
              <input type="range" min="0" max={duration || 0} step="0.05" value={currentTime}
                onChange={e => seek(Number(e.target.value))} className="w-full accent-accent-cyan" />
              <span className="text-xs font-mono text-slate-400 shrink-0">{formatClock(duration)}</span>
            </div>

            <div className="grid sm:grid-cols-2 gap-3 items-center">
              <div className="flex items-center gap-2">
                <span className="text-[11px] font-bold text-slate-400 shrink-0 w-12">الدوران</span>
                <input type="range" min="-45" max="45" step="1" value={rotation} onChange={e => setRotation(Number(e.target.value))} className="w-full accent-accent-cyan" />
                <div className="flex items-center gap-1 shrink-0">
                  <input type="number" min="-45" max="45" value={rotation}
                    onChange={e => setRotation(Math.max(-45, Math.min(45, Number(e.target.value) || 0)))}
                    className="w-14 bg-glass-900 border border-white/10 rounded-lg px-2 py-1 text-xs text-white text-center" />
                  <span className="text-[11px] text-slate-400">°</span>
                </div>
              </div>
              <div className="flex items-center gap-2 sm:justify-end">
                <span className="text-[11px] font-bold text-slate-400 shrink-0">نسبة القص</span>
                <select value={aspect} onChange={e => setAspect(e.target.value)} className="bg-glass-900 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white outline-none focus:border-accent-cyan">
                  {CROP_ASPECTS.map(([k, l]) => <option key={k} value={k} className="bg-glass-950">{l}</option>)}
                </select>
              </div>
            </div>

            <div className="flex gap-3 pt-1">
              <button type="button" onClick={resetAll} className="flex-1 py-2.5 rounded-xl glass-card border border-white/10 text-xs font-bold text-slate-300 hover:bg-white/5 transition">إعادة ضبط</button>
              <button type="button" onClick={confirm} disabled={!ready} className="flex-1 py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-xs font-black hover:brightness-110 shadow-[0_0_15px_rgba(0,240,255,0.4)] transition disabled:opacity-50">تأكيد القص</button>
            </div>
          </div>
        </div>
      ), document.body);
    }

    // ضبط عرض الفيديو: نطاق تشغيل (قص زمني)، طريقة عرض مستقلة بين الجوال والحاسوب، وأداة قص احترافية فعلية (سحب مقابض حقيقي، دوران، نسب قياسية) بدل الإعدادات الشكلية السابقة
    function VideoDisplaySettings({ value, onChange }) {
      const [open, setOpen] = useState(false);
      const [showCropStudio, setShowCropStudio] = useState(false);
      const v = value || {};
      const set = (k, val) => onChange({ ...v, [k]: val });
      const crop = v.crop || {};
      const showCropTools = v.fitMobile === 'crop' || v.fitDesktop === 'crop';
      const canCrop = v.videoUrl && isDirectVideo(v.videoUrl);

      return (
        <div className="glass-card rounded-2xl border border-white/10 mt-3">
          <button type="button" onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between px-4 py-3 text-xs font-bold text-slate-200">
            <span className="flex items-center gap-2"><Icon name="crop" className="w-3.5 h-3.5 text-accent-cyan" />إعدادات العرض (اختياري)</span>
            <Icon name="chevronDown" className={`w-3.5 h-3.5 transition ${open ? 'rotate-180' : ''}`} />
          </button>
          {open && (
            <div className="px-4 pb-4 space-y-4 border-t border-white/10 pt-4">
              <div>
                <p className="text-[11px] font-bold text-slate-400 mb-2">قص من بداية أو نهاية الفيديو (بالثواني) — اختياري</p>
                <div className="grid grid-cols-2 gap-2.5">
                  <input type="number" min="0" value={v.trimStart || ''} onChange={e => set('trimStart', Number(e.target.value) || 0)} placeholder="ثانية البداية" className="bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-accent-cyan" />
                  <input type="number" min="0" value={v.trimEnd || ''} onChange={e => set('trimEnd', Number(e.target.value) || 0)} placeholder="ثانية النهاية" className="bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-accent-cyan" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <p className="text-[11px] font-bold text-slate-400 mb-1.5 flex items-center gap-1"><Icon name="smartphone" className="w-3 h-3" />طريقة العرض بالجوال</p>
                  <select value={v.fitMobile || 'contain'} onChange={e => set('fitMobile', e.target.value)} className="w-full bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-accent-cyan">
                    {FIT_OPTIONS.map(([k, l]) => <option key={k} value={k} className="bg-glass-950">{l}</option>)}
                  </select>
                </div>
                <div>
                  <p className="text-[11px] font-bold text-slate-400 mb-1.5 flex items-center gap-1"><Icon name="monitor" className="w-3 h-3" />طريقة العرض بالحاسوب</p>
                  <select value={v.fitDesktop || 'contain'} onChange={e => set('fitDesktop', e.target.value)} className="w-full bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-accent-cyan">
                    {FIT_OPTIONS.map(([k, l]) => <option key={k} value={k} className="bg-glass-950">{l}</option>)}
                  </select>
                </div>
              </div>

              {(v.fitMobile || 'contain') !== (v.fitDesktop || 'contain') && (
                <div className="flex items-center justify-between gap-2.5 bg-amber-500/10 border border-amber-500/20 rounded-xl px-3 py-2.5">
                  <p className="text-[11px] font-bold text-amber-400 leading-relaxed">تنبيه: الجوال والحاسوب مضبوطين على طريقتين مختلفتين — هذا مقصود إذا تريده هيك، لكن إذا تريد نفس الإعداد بكل الأجهزة اضغط الزر.</p>
                  <button type="button" onClick={() => { set('fitMobile', v.fitDesktop || 'contain'); }}
                    className="shrink-0 px-3 py-2 rounded-lg bg-amber-500 text-glass-950 text-[11px] font-black hover:brightness-110 transition">طبّق إعداد الحاسوب على الجوال</button>
                </div>
              )}

              {showCropTools && (
                <div>
                  {canCrop ? (
                    <div className="flex items-center gap-2.5">
                      <button type="button" onClick={() => setShowCropStudio(true)}
                        className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-xs font-black hover:brightness-110 shadow-[0_0_15px_rgba(0,240,255,0.4)] transition">
                        <Icon name="crop" className="w-4 h-4" />{crop.active ? 'تعديل القص' : 'فتح أداة القص الاحترافية'}
                      </button>
                      {crop.active && (
                        <button type="button" onClick={() => set('crop', {})} title="إزالة القص"
                          className="shrink-0 w-10 h-10 rounded-xl glass-card border border-white/10 hover:border-rose-400 text-rose-400 flex items-center justify-center transition">
                          <Icon name="x" className="w-4 h-4" />
                        </button>
                      )}
                    </div>
                  ) : (
                    <p className="text-[11px] font-bold text-amber-400">
                      {v.videoUrl ? 'أداة القص تعمل فقط مع ملفات فيديو مباشرة (mp4, webm...) وليست روابط تضمين/iframe' : 'ارفع ملف الفيديو أولًا لتفعيل أداة القص'}
                    </p>
                  )}
                  {crop.active && <p className="text-[11px] text-slate-400 mt-2">تم ضبط القص بنجاح ✅ — دوران {crop.rotation || 0}°</p>}
                </div>
              )}
            </div>
          )}

          {showCropStudio && (
            <CropStudioModal videoUrl={normalizeVideoUrl(v.videoUrl)} initial={crop}
              onCancel={() => setShowCropStudio(false)}
              onSave={(newCrop) => { set('crop', newCrop); setShowCropStudio(false); }} />
          )}
        </div>
      );
    }

    function emptyForm(type) {
      return { name: '', type: type || 'movie', year: new Date().getFullYear(), genresText: '', poster: '', backdrop: '', description: '', director: '', writer: '', imdbRating: '', rtRating: '', featured: false, status: 'draft', videoUrl: '', downloadUrl: '', trimStart: 0, trimEnd: 0, fitMobile: 'contain', fitDesktop: 'contain', crop: {}, seasons: [] };
    }

    function AdminContentForm({ initial, defaultType, onDone }) {
      const [form, setForm] = useState(() => {
        if (!initial) return emptyForm(defaultType);
        return { ...emptyForm(defaultType), ...initial, genresText: (initial.genres || []).join(', '), seasons: initial.seasons ? JSON.parse(JSON.stringify(initial.seasons)) : [] };
      });
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');

      const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
      const addSeason = () => setForm(prev => ({ ...prev, seasons: [...prev.seasons, { number: prev.seasons.length + 1, episodes: [] }] }));
      const removeSeason = (si) => setForm(prev => ({ ...prev, seasons: prev.seasons.filter((_, i) => i !== si) }));
      const updateSeasonNumber = (si, val) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, number: val }) }));
      const addEpisode = (si) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, episodes: [...s.episodes, { number: s.episodes.length + 1, title: '', videoUrl: '', downloadUrl: '', imdb: '', rt: '', trimStart: 0, trimEnd: 0, fitMobile: 'contain', fitDesktop: 'contain', crop: {} }] }) }));
      const removeEpisode = (si, ei) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, episodes: s.episodes.filter((_, j) => j !== ei) }) }));
      const updateEpisode = (si, ei, key, val) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, episodes: s.episodes.map((e, j) => j !== ei ? e : { ...e, [key]: val }) }) }));

      const save = async () => {
        setError('');
        if (!form.name.trim()) { setError('الرجاء إدخال اسم العمل.'); return; }
        setSaving(true);
        const payload = {
          name: form.name.trim(),
          type: form.type,
          year: Number(form.year) || null,
          genres: form.genresText.split(',').map(s => s.trim()).filter(Boolean),
          poster: form.poster.trim(),
          backdrop: form.backdrop.trim(),
          description: form.description.trim(),
          director: form.director.trim(),
          writer: form.writer.trim(),
          imdbRating: form.imdbRating.trim(),
          rtRating: form.rtRating.trim(),
          featured: !!form.featured,
          status: form.status,
          createdAt: initial ? (initial.createdAt || Date.now()) : Date.now(),
          likes: initial ? (initial.likes || 0) : 0,
          views: initial ? (initial.views || 0) : 0,
        };
        if (form.type === 'movie') {
          payload.videoUrl = form.videoUrl.trim();
          payload.downloadUrl = form.downloadUrl.trim();
          payload.trimStart = Number(form.trimStart) || 0;
          payload.trimEnd = Number(form.trimEnd) || 0;
          payload.fitMobile = form.fitMobile || 'contain';
          payload.fitDesktop = form.fitDesktop || 'contain';
          payload.crop = form.crop || {};
          payload.seasons = [];
        } else {
          payload.seasons = form.seasons.map(s => ({
            number: Number(s.number) || 1,
            episodes: (s.episodes || []).map(e => ({
              number: Number(e.number) || 1, title: (e.title || '').trim(), videoUrl: (e.videoUrl || '').trim(), downloadUrl: (e.downloadUrl || '').trim(), imdb: (e.imdb || '').trim(), rt: (e.rt || '').trim(),
              trimStart: Number(e.trimStart) || 0, trimEnd: Number(e.trimEnd) || 0, fitMobile: e.fitMobile || 'contain', fitDesktop: e.fitDesktop || 'contain', crop: e.crop || {}
            }))
          }));
          payload.videoUrl = ''; payload.downloadUrl = '';
        }
        try {
          if (initial && initial.id) await db.ref(`titles/${initial.id}`).set(payload);
          else await db.ref('titles').push(payload);
          onDone();
        } catch (e) { setError('حدث خطأ أثناء الحفظ.'); }
        setSaving(false);
      };

      const inputCls = "w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner";
      const labelCls = "text-xs font-bold text-slate-300 mb-1.5 block";

      return (
        <div className="glass-panel rounded-3xl p-5 md:p-7 border border-white/10 shadow-2xl">
          <div className="grid md:grid-cols-2 gap-5">
            <div>
              <label className={labelCls}>اسم العمل *</label>
              <input value={form.name} onChange={e => set('name', e.target.value)} className={inputCls} />
            </div>
            <div>
              <label className={labelCls}>النوع</label>
              <select value={form.type} onChange={e => set('type', e.target.value)} className={inputCls}>
                <option value="movie" className="bg-glass-950">فيلم</option>
                <option value="series" className="bg-glass-950">مسلسل</option>
                <option value="anime" className="bg-glass-950">أنمي</option>
              </select>
            </div>
            <div>
              <label className={labelCls}>سنة الإصدار</label>
              <input type="number" value={form.year} onChange={e => set('year', e.target.value)} className={inputCls} />
            </div>
            <div>
              <label className={labelCls}>التصنيفات (مفصولة بفاصلة)</label>
              <input value={form.genresText} onChange={e => set('genresText', e.target.value)} placeholder="أكشن, دراما, غموض" className={inputCls} />
            </div>
            <div>
              <FileUploadField label="صورة البوستر" value={form.poster} onChange={v => set('poster', v)} folder="posters" accept="image/*" />
            </div>
            <div>
              <FileUploadField label="صورة الخلفية" value={form.backdrop} onChange={v => set('backdrop', v)} folder="backdrops" accept="image/*" />
            </div>
            <div>
              <label className={labelCls}>اسم المخرج</label>
              <input value={form.director} onChange={e => set('director', e.target.value)} className={inputCls} />
            </div>
            <div>
              <label className={labelCls}>اسم الكاتب</label>
              <input value={form.writer} onChange={e => set('writer', e.target.value)} className={inputCls} />
            </div>
            <div>
              <label className={labelCls}>تقييم IMDb</label>
              <input value={form.imdbRating} onChange={e => set('imdbRating', e.target.value)} placeholder="8.4" className={inputCls} />
            </div>
            <div>
              <label className={labelCls}>تقييم Rotten Tomatoes</label>
              <input value={form.rtRating} onChange={e => set('rtRating', e.target.value)} placeholder="92" className={inputCls} />
            </div>
          </div>

          <div className="mt-5">
            <label className={labelCls}>الوصف</label>
            <textarea value={form.description} onChange={e => set('description', e.target.value)} rows={3} className={inputCls}></textarea>
          </div>

          {form.type === 'movie' ? (
            <div>
              <div className="grid md:grid-cols-2 gap-5 mt-5">
                <FileUploadField label="ملف الفيلم (فيديو مباشر أو رابط/iframe)" value={form.videoUrl} onChange={v => set('videoUrl', v)} folder="videos" accept="video/*" />
                <FileUploadField label="ملف التحميل" value={form.downloadUrl} onChange={v => set('downloadUrl', v)} folder="downloads" accept="video/*" />
              </div>
              <VideoDisplaySettings value={form} onChange={patch => setForm(prev => ({ ...prev, ...patch }))} />
            </div>
          ) : (
            <div className="mt-6 border-t border-white/10 pt-5">
              <div className="flex items-center justify-between mb-4">
                <h4 className="font-black text-white text-base">المواسم والحلقات</h4>
                <button onClick={addSeason} className="flex items-center gap-1.5 text-xs px-4 py-2 rounded-xl bg-accent-cyan text-glass-950 font-bold hover:brightness-110 transition shadow-sm"><Icon name="plus" className="w-4 h-4" />إضافة موسم</button>
              </div>
              <div className="space-y-4">
                {form.seasons.map((s, si) => (
                  <div key={si} className="glass-card rounded-2xl p-4 border border-white/10">
                    <div className="flex items-center gap-3 mb-4">
                      <span className="text-xs font-bold text-slate-300">رقم الموسم</span>
                      <input type="number" value={s.number} onChange={e => updateSeasonNumber(si, e.target.value)} className="w-20 bg-glass-950 border border-white/10 rounded-xl px-3 py-1.5 text-xs font-bold text-white text-center" />
                      <button onClick={() => removeSeason(si)} className="mr-auto text-rose-400 text-xs font-bold flex items-center gap-1 hover:text-rose-300 transition"><Icon name="trash-2" className="w-4 h-4" />حذف الموسم</button>
                    </div>
                    <div className="space-y-3">
                      {s.episodes.map((e, ei) => (
                        <div key={ei} className="glass-panel rounded-xl p-3 border border-white/5">
                          <div className="grid md:grid-cols-6 gap-2.5 items-center">
                            <input type="number" value={e.number} onChange={ev => updateEpisode(si, ei, 'number', ev.target.value)} placeholder="#" className="bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white text-center md:col-span-1" />
                            <input value={e.title} onChange={ev => updateEpisode(si, ei, 'title', ev.target.value)} placeholder="عنوان الحلقة" className="bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white md:col-span-2" />
                            <div className="md:col-span-2"><FileUploadField compact value={e.videoUrl} onChange={v => updateEpisode(si, ei, 'videoUrl', v)} folder="episodes" accept="video/*" /></div>
                            <div className="md:col-span-2"><FileUploadField compact value={e.downloadUrl} onChange={v => updateEpisode(si, ei, 'downloadUrl', v)} folder="episodes" accept="video/*" /></div>
                            <input value={e.imdb} onChange={ev => updateEpisode(si, ei, 'imdb', ev.target.value)} placeholder="IMDb" className="bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white md:col-span-1" />
                            <input value={e.rt} onChange={ev => updateEpisode(si, ei, 'rt', ev.target.value)} placeholder="RT %" className="bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white md:col-span-1" />
                            <button onClick={() => removeEpisode(si, ei)} className="text-rose-400 flex items-center justify-center md:col-span-1 hover:text-rose-300 transition"><Icon name="trash-2" className="w-4 h-4" /></button>
                          </div>
                          <VideoDisplaySettings value={e} onChange={patch => { Object.keys(patch).forEach(k => updateEpisode(si, ei, k, patch[k])); }} />
                        </div>
                      ))}
                    </div>
                    <button onClick={() => addEpisode(si)} className="mt-3 flex items-center gap-1.5 text-xs px-4 py-2 rounded-xl glass-card border border-white/10 hover:border-accent-cyan text-slate-200 font-bold transition"><Icon name="plus" className="w-3.5 h-3.5 text-accent-cyan" />إضافة حلقة</button>
                  </div>
                ))}
                {form.seasons.length === 0 && <p className="text-xs text-slate-500 font-medium">لا توجد مواسم بعد. اضغط "إضافة موسم" للبدء.</p>}
              </div>
            </div>
          )}

          <div className="flex items-center gap-6 mt-6 flex-wrap">
            <label className="flex items-center gap-2.5 text-sm font-bold text-slate-200 cursor-pointer"><input type="checkbox" checked={form.featured} onChange={e => set('featured', e.target.checked)} className="w-4 h-4 rounded accent-accent-cyan" />إظهار في العرض الرئيسي (Hero)</label>
            <label className="flex items-center gap-2.5 text-sm font-bold text-slate-200 cursor-pointer"><input type="checkbox" checked={form.status === 'published'} onChange={e => set('status', e.target.checked ? 'published' : 'draft')} className="w-4 h-4 rounded accent-accent-cyan" />نشر العمل للزوار مباشرة</label>
          </div>

          {error && <p className="text-rose-400 text-xs font-bold mt-4 bg-rose-500/10 p-3 rounded-xl border border-rose-500/20">{error}</p>}

          <div className="flex gap-3 mt-6">
            <button onClick={save} disabled={saving} className="px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition disabled:opacity-50">{saving ? 'جارٍ الحفظ...' : 'حفظ العمل'}</button>
            <button onClick={onDone} className="px-6 py-3 rounded-2xl glass-card border border-white/10 text-sm font-bold text-slate-300 hover:bg-white/5 transition">إلغاء</button>
          </div>
        </div>
      );
    }

    function AdminComplaints({ currentUser }) {
      const [list, setList] = useState([]);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [replyDrafts, setReplyDrafts] = useState({});
      const [savingReplyId, setSavingReplyId] = useState(null);

      useEffect(() => {
        const ref = db.ref('complaints');
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => b.date - a.date);
          setList(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      const toggleStatus = (c) => db.ref(`complaints/${c.id}/status`).set(c.status === 'resolved' ? 'open' : 'resolved');
      const remove = async (id) => { await db.ref(`complaints/${id}`).remove(); setDeleteTarget(null); };

      const sendReply = async (c) => {
        const text = (replyDrafts[c.id] || '').trim();
        if (!text) return;
        setSavingReplyId(c.id);
        try {
          await db.ref(`complaints/${c.id}`).update({ reply: text, replyDate: Date.now(), replyBy: (currentUser && currentUser.name) || 'الإدارة', status: 'resolved' });
          setReplyDrafts(prev => ({ ...prev, [c.id]: '' }));
        } finally { setSavingReplyId(null); }
      };

      if (!list.length) return <p className="text-sm text-slate-500 font-medium">لا توجد شكاوى أو طلبات حاليًا.</p>;

      return (
        <div className="space-y-3">
          {list.map(c => (
            <div key={c.id} className="glass-card rounded-2xl p-4 border border-white/10">
              <div className="flex items-start justify-between gap-4">
                <div className="min-w-0">
                  <p className="text-xs text-accent-cyan font-bold mb-1.5">{COMPLAINT_TYPES[c.type] || c.type}{c.titleName ? ` · ${c.titleName}` : ''}</p>
                  <p className="text-sm text-slate-200 leading-relaxed">{c.message}</p>
                  <p className="text-[10px] text-slate-500 font-mono mt-2">من {c.name} (@{c.username}) · {fmtDateTime(c.date)}</p>
                </div>
                <span className={`text-[11px] px-3 py-1 rounded-full font-bold shrink-0 ${c.status === 'resolved' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>{c.status === 'resolved' ? 'تم الحل' : 'قيد المراجعة'}</span>
              </div>

              {c.reply && (
                <div className="mt-3 pt-3 border-t border-white/10">
                  <p className="text-[11px] font-bold text-emerald-400 mb-1">ردك السابق:</p>
                  <p className="text-sm text-slate-300">{c.reply}</p>
                </div>
              )}

              <div className="flex gap-2 mt-3">
                <input value={replyDrafts[c.id] || ''} onChange={e => setReplyDrafts(prev => ({ ...prev, [c.id]: e.target.value }))}
                  placeholder={c.reply ? 'تعديل الرد...' : 'اكتب ردًا يظهر للمستخدم...'}
                  className="flex-1 min-w-0 bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-accent-cyan" />
                <button onClick={() => sendReply(c)} disabled={savingReplyId === c.id} className="shrink-0 px-4 py-2 rounded-xl bg-accent-cyan text-glass-950 text-xs font-bold hover:brightness-110 transition disabled:opacity-50">{savingReplyId === c.id ? '...' : 'إرسال الرد'}</button>
              </div>

              <div className="flex gap-2.5 mt-3">
                <button onClick={() => toggleStatus(c)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl glass-card border border-white/10 hover:border-accent-cyan text-xs font-bold text-slate-200 transition"><Icon name="check" className="w-3.5 h-3.5 text-emerald-400" />{c.status === 'resolved' ? 'إعادة فتح' : 'تحديد كمحلول'}</button>
                <button onClick={() => setDeleteTarget(c.id)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 text-xs font-bold transition"><Icon name="trash-2" className="w-3.5 h-3.5" />حذف</button>
              </div>
            </div>
          ))}
          {deleteTarget && (
            <ConfirmDialog title="حذف هذا الطلب؟" body="لا يمكن التراجع عن هذا الإجراء." confirmLabel="نعم، احذف" cancelLabel="إلغاء" onCancel={() => setDeleteTarget(null)} onConfirm={() => remove(deleteTarget)} />
          )}
        </div>
      );
    }

    function AdminUsers() {
      const [list, setList] = useState([]);
      const [query, setQuery] = useState('');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [busyId, setBusyId] = useState(null);

      useEffect(() => {
        const ref = db.ref('users');
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setList(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      const toggleModerator = async (u) => {
        setBusyId(u.id);
        const next = !u.isModerator;
        try {
          await db.ref(`users/${u.id}/isModerator`).set(next);
          await db.ref(`moderators/${sanitizeKey(u.username)}`).set(next ? true : null);
        } finally { setBusyId(null); }
      };

      const toggleBan = async (u) => {
        setBusyId(u.id);
        try { await db.ref(`users/${u.id}/banned`).set(!u.banned); } finally { setBusyId(null); }
      };

      const removeUser = async (u) => {
        await db.ref(`users/${u.id}`).remove();
        if (u.isModerator) await db.ref(`moderators/${sanitizeKey(u.username)}`).remove();
        setDeleteTarget(null);
      };

      const filtered = query.trim()
        ? list.filter(u => (u.username || '').toLowerCase().includes(query.trim().toLowerCase()) || (u.name || '').toLowerCase().includes(query.trim().toLowerCase()))
        : list;

      return (
        <div>
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="بحث بالاسم أو اسم المستخدم..."
            className="w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner mb-5" />

          {filtered.length === 0 ? (
            <p className="text-sm text-slate-500 font-medium">لا يوجد مستخدمون مطابقون.</p>
          ) : (
            <div className="space-y-3">
              {filtered.map(u => (
                <div key={u.id} className="glass-card rounded-2xl p-4 border border-white/10 flex items-center gap-3.5 flex-wrap">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center font-black text-glass-950 shrink-0 overflow-hidden">
                    {u.avatar ? <img src={u.avatar} alt="" className="w-full h-full object-cover" /> : (u.name || '?').charAt(0)}
                  </div>
                  <div className="min-w-[140px] flex-1">
                    <p className="font-bold text-white text-sm truncate flex items-center gap-1.5">
                      {u.name}
                      {u.username === 'mavilovelife' && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold">مدير النظام</span>}
                      {u.isModerator && <span className="text-[10px] px-2 py-0.5 rounded-full bg-accent-cyan/20 text-accent-cyan border border-accent-cyan/30 font-bold">مشرف النظام</span>}
                      {u.banned && <span className="text-[10px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold">محظور</span>}
                    </p>
                    <p className="text-xs text-slate-400">@{u.username}</p>
                  </div>
                  {u.username !== 'mavilovelife' && (
                    <>
                      <button onClick={() => toggleModerator(u)} disabled={busyId === u.id}
                        className={`text-xs px-4 py-2 rounded-xl font-bold transition disabled:opacity-50 ${u.isModerator ? 'bg-accent-cyan/20 text-accent-cyan border border-accent-cyan/30' : 'glass-card border border-white/10 hover:border-accent-cyan text-slate-200'}`}>
                        {u.isModerator ? 'إزالة شارة الإشراف' : 'منح شارة مشرف النظام'}
                      </button>
                      <button onClick={() => toggleBan(u)} disabled={busyId === u.id}
                        className={`text-xs px-4 py-2 rounded-xl font-bold transition disabled:opacity-50 ${u.banned ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/10 border border-amber-500/20 text-amber-400 hover:bg-amber-500/20'}`}>
                        {u.banned ? 'إلغاء الحظر' : 'حظر الحساب'}
                      </button>
                      <button onClick={() => setDeleteTarget(u)} title="حذف الحساب"
                        className="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 flex items-center justify-center text-rose-400 transition shrink-0"><Icon name="trash-2" className="w-4 h-4" /></button>
                    </>
                  )}
                </div>
              ))}
            </div>
          )}

          {deleteTarget && (
            <ConfirmDialog title="حذف هذا الحساب؟" body={`سيتم حذف حساب @${deleteTarget.username} نهائيًا ولا يمكن التراجع عن هذا الإجراء.`}
              confirmLabel="نعم، احذف" cancelLabel="إلغاء" onCancel={() => setDeleteTarget(null)} onConfirm={() => removeUser(deleteTarget)} />
          )}
        </div>
      );
    }

    function AdminPanel({ currentUser, titles, onOpenAuth, moderators }) {
      const [tab, setTab] = useState('content');
      const [contentType, setContentType] = useState('movie');
      const [editing, setEditing] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const isFullAdmin = currentUser && currentUser.username === 'mavilovelife';

      const handleDelete = async (id) => { await db.ref(`titles/${id}`).remove(); await db.ref(`comments/${id}`).remove(); await db.ref(`ratings/${id}`).remove(); setDeleteTarget(null); };
      const togglePublish = (t) => db.ref(`titles/${t.id}/status`).set(t.status === 'published' ? 'draft' : 'published');
      const filteredTitles = titles.filter(t => t.type === contentType);

      return (
        <div>
          <h1 className="text-2xl md:text-3xl font-black mb-6 text-slate-100">لوحة تحكم ورفع الأفلام</h1>
          <div className="flex gap-3 mb-6 border-b border-white/10 pb-3 flex-wrap">
            <button onClick={() => { setTab('content'); setEditing(null); }} className={`px-5 py-2.5 rounded-xl text-sm font-bold transition ${tab === 'content' ? 'bg-accent-cyan text-glass-950 shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card text-slate-300 border border-white/5'}`}>المحتوى (رفع الأفلام)</button>
            <button onClick={() => setTab('complaints')} className={`px-5 py-2.5 rounded-xl text-sm font-bold transition ${tab === 'complaints' ? 'bg-accent-cyan text-glass-950 shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card text-slate-300 border border-white/5'}`}>الشكاوى والطلبات</button>
            {isFullAdmin && (
              <button onClick={() => setTab('users')} className={`px-5 py-2.5 rounded-xl text-sm font-bold transition ${tab === 'users' ? 'bg-accent-cyan text-glass-950 shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card text-slate-300 border border-white/5'}`}>المستخدمون</button>
            )}
          </div>

          {tab === 'content' && (
            editing ? (
              <AdminContentForm initial={editing === 'new' ? null : editing} defaultType={contentType} onDone={() => setEditing(null)} />
            ) : (
              <div>
                <div className="flex gap-2.5 mb-5">
                  {[['movie', 'أفلام'], ['series', 'مسلسلات'], ['anime', 'أنمي']].map(([k, l]) => (
                    <button key={k} onClick={() => setContentType(k)} className={`flex-1 px-4 py-2.5 rounded-xl text-sm font-bold transition ${contentType === k ? 'bg-accent-red text-white shadow-[0_0_15px_rgba(255,51,75,0.4)]' : 'glass-card text-slate-300 border border-white/5'}`}>{l} <span className="opacity-70 text-xs">({titles.filter(t => t.type === k).length})</span></button>
                  ))}
                </div>
                <button onClick={() => setEditing('new')} className="mb-6 flex items-center gap-2 px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition"><Icon name="plus" className="w-4 h-4" />رفع {TYPE_LABELS[contentType]} جديد</button>
                <div className="space-y-3">
                  {filteredTitles.length === 0 && <p className="text-sm text-slate-500 font-medium">لا توجد أعمال في هذا القسم بعد.</p>}
                  {filteredTitles.map(t => (
                    <div key={t.id} className="glass-card rounded-2xl p-4 border border-white/10 flex items-center gap-4 flex-wrap">
                      <div className="w-12 h-16 rounded-xl bg-glass-900 overflow-hidden shrink-0 border border-white/5 shadow-md">
                        {t.poster && <img src={t.poster} className="w-full h-full object-cover" />}
                      </div>
                      <div className="flex-1 min-w-[140px]">
                        <p className="font-bold text-white text-base truncate mb-1">{t.name}</p>
                        <p className="text-xs text-slate-400 font-medium">{TYPE_LABELS[t.type]} · {t.year || ''}</p>
                      </div>
                      <span className={`text-[11px] px-3 py-1 rounded-full font-bold shrink-0 ${t.status === 'published' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-glass-800 text-slate-400 border border-white/5'}`}>{t.status === 'published' ? 'منشور' : 'مسودة'}</span>
                      <button onClick={() => togglePublish(t)} title="تبديل حالة النشر" className="w-9 h-9 rounded-xl glass-card border border-white/10 hover:border-accent-cyan flex items-center justify-center text-slate-200 transition shrink-0"><Icon name="eye" className="w-4 h-4" /></button>
                      <button onClick={() => setEditing(t)} title="تعديل" className="w-9 h-9 rounded-xl glass-card border border-white/10 hover:border-accent-cyan flex items-center justify-center text-slate-200 transition shrink-0"><Icon name="pencil" className="w-4 h-4" /></button>
                      <button onClick={() => setDeleteTarget(t.id)} title="حذف" className="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 flex items-center justify-center text-rose-400 transition shrink-0"><Icon name="trash-2" className="w-4 h-4" /></button>
                    </div>
                  ))}
                </div>
              </div>
            )
          )}

          {tab === 'complaints' && <AdminComplaints currentUser={currentUser} />}
          {tab === 'users' && isFullAdmin && <AdminUsers />}

          {deleteTarget && (
            <ConfirmDialog title="حذف هذا العمل؟" body="سيتم حذف العمل وجميع تعليقاته نهائيًا ولا يمكن استرجاعه." confirmLabel="نعم، احذف" cancelLabel="إلغاء" onCancel={() => setDeleteTarget(null)} onConfirm={() => handleDelete(deleteTarget)} />
          )}
        </div>
      );
    }

    function App() {
      const [titles, setTitles] = useState([]);
      const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('cv_user') || 'null'));
      const [view, setViewRaw] = useState('home');
      const [search, setSearch] = useState('');
      const [activeTitle, setActiveTitle] = useState(null);
      const [authModal, setAuthModal] = useState(null);
      const [accountSheet, setAccountSheet] = useState(false);
      const [devPinModal, setDevPinModal] = useState(false);
      const [watchlist, setWatchlist] = useState(() => JSON.parse(localStorage.getItem('cv_watchlist') || '[]'));
      const [likedIds, setLikedIds] = useState(() => JSON.parse(localStorage.getItem('cv_likes') || '[]'));
      const [moderators, setModerators] = useState({});
      const [profileTarget, setProfileTarget] = useState(null);

      const openProfile = (uname) => { setProfileTarget(uname || null); setActiveTitle(null); setAccountSheet(false); setViewRaw('profile'); window.scrollTo({ top: 0, behavior: 'smooth' }); };

      useEffect(() => {
        const ref = db.ref('moderators');
        const cb = snap => setModerators(snap.val() || {});
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      const getRole = (username) => {
        if (!username) return null;
        if (username === 'mavilovelife') return 'admin';
        return moderators[sanitizeKey(username)] ? 'moderator' : null;
      };

      // مزامنة فورية لحالة المستخدم الحالي (شارة الإشراف / الحظر) دون الحاجة لتسجيل خروج ودخول
      useEffect(() => {
        if (!currentUser) return;
        const ref = db.ref(`users/${currentUser.id}`);
        const cb = snap => {
          const u = snap.val();
          if (!u) return;
          if (u.banned) { setCurrentUser(null); localStorage.removeItem('cv_user'); return; }
          if (u.isModerator !== currentUser.isModerator) {
            const updated = { ...currentUser, isModerator: u.isModerator };
            setCurrentUser(updated);
            localStorage.setItem('cv_user', JSON.stringify(updated));
          }
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser && currentUser.id]);

      const setView = (v) => {
        if (v === 'admin') {
          if (currentUser && (currentUser.username === 'mavilovelife' || currentUser.isModerator)) {
            // المشرفون المعيّنون من قبل الإدارة يدخلون مباشرة دون الحاجة للرمز السري
            if (currentUser.isModerator && currentUser.username !== 'mavilovelife') {
              setViewRaw('admin'); setSearch(''); window.scrollTo({ top: 0, behavior: 'smooth' });
              return;
            }
          }
          // فتح نافذة إدخال رمز الحماية للمطور
          setDevPinModal(true);
          return;
        }
        setViewRaw(v); setSearch(''); window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const [booted, setBooted] = useState(false);

      useEffect(() => {
        const ref = db.ref('titles');
        const cb = snap => {
          const data = snap.val();
          const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setTitles(list);
          setActiveTitle(prev => {
            if (!prev) return prev;
            const updated = list.find(x => x.id === prev.id);
            return updated || prev;
          });
          setBooted(true);
        };
        ref.on('value', cb);
        // شبكة بطيئة أو مشكلة اتصال مؤقتة: لا تترك المستخدم ينتظر إلى الأبد أمام شاشة التحميل
        const safety = setTimeout(() => setBooted(true), 4000);
        return () => { ref.off('value', cb); clearTimeout(safety); };
      }, []);

      useEffect(() => {
        if (!booted) return;
        const loader = document.getElementById('bootLoader');
        if (loader) {
          loader.classList.add('fading');
          setTimeout(() => loader.remove(), 350);
        }
      }, [booted]);

      // فتح عمل تلقائيًا لو الرابط يحتوي على معرّف مشاركة (?t=ID)
      useEffect(() => {
        if (!booted || !titles.length) return;
        const t = new URLSearchParams(location.search).get('t');
        if (t) { const found = titles.find(x => x.id === t); if (found) setActiveTitle(found); }
      }, [booted, titles]);

      const published = titles.filter(t => t.status === 'published');

      const continueWatchingIds = React.useMemo(() => {
        try { return JSON.parse(localStorage.getItem('cv_continue') || '[]'); } catch (e) { return []; }
      }, [titles, activeTitle]);
      const continueItems = continueWatchingIds.map(id => published.find(t => t.id === id)).filter(Boolean).slice(0, 10);

      const toggleWatchlist = (id) => {
        setWatchlist(prev => {
          const next = prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id];
          localStorage.setItem('cv_watchlist', JSON.stringify(next));
          return next;
        });
      };

      const toggleLike = (title) => {
        const isLiked = likedIds.includes(title.id);
        const next = isLiked ? likedIds.filter(x => x !== title.id) : [...likedIds, title.id];
        setLikedIds(next);
        localStorage.setItem('cv_likes', JSON.stringify(next));
        db.ref(`titles/${title.id}/likes`).transaction(v => Math.max(0, (v || 0) + (isLiked ? -1 : 1)));
      };

      const handleLogout = () => { setCurrentUser(null); localStorage.removeItem('cv_user'); setAccountSheet(false); setView('home'); };

      const handleUpdateAvatar = async (dataUrl) => {
        if (!currentUser) return;
        await db.ref(`users/${currentUser.id}/avatar`).set(dataUrl);
        const updated = { ...currentUser, avatar: dataUrl };
        setCurrentUser(updated);
        localStorage.setItem('cv_user', JSON.stringify(updated));
      };

      const handleUpdateName = async (newName) => {
        if (!currentUser) return;
        await db.ref(`users/${currentUser.id}/name`).set(newName);
        const updated = { ...currentUser, name: newName };
        setCurrentUser(updated);
        localStorage.setItem('cv_user', JSON.stringify(updated));
      };

      const handleAuthSuccess = (user) => {
        const u = { id: user.id, name: user.name, username: user.username, avatar: user.avatar || '' };
        setCurrentUser(u);
        localStorage.setItem('cv_user', JSON.stringify(u));
        setAuthModal(null);
      };

      const searching = search.trim().length > 0;
      let mainList = published;
      if (searching) {
        const q = search.trim().toLowerCase();
        mainList = published.filter(t => t.name && t.name.toLowerCase().includes(q));
      }

      return (
        <div className="min-h-screen flex flex-col mobile-safe-bottom md:pb-0">
          <Header currentUser={currentUser} view={view} setView={setView} search={search} setSearch={setSearch} onOpenAccount={() => setAccountSheet(true)} />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 md:py-8">
            <div key={searching ? 'search' : view} className="page-fade-in">
              {searching ? (
                <TypeGrid title={`نتائج البحث عن "${search}"`} items={mainList} onOpen={setActiveTitle} emptyText="لا توجد نتائج مطابقة." />
              ) : view === 'home' ? (
                <HomeView items={published} onOpen={setActiveTitle} continueItems={continueItems} />
              ) : (view === 'movie' || view === 'series' || view === 'anime') ? (
                <TypeGrid title={TYPE_PLURAL[view]} items={published.filter(t => t.type === view)} onOpen={setActiveTitle} showGenreFilter emptyText="لا توجد أعمال في هذا القسم بعد." />
              ) : view === 'watchlist' ? (
                <TypeGrid title="قائمتي المفضلة" items={published.filter(t => watchlist.includes(t.id))} onOpen={setActiveTitle} emptyText="لم تُضف أي عمل إلى قائمتك بعد." />
              ) : view === 'requests' ? (
                <RequestsView currentUser={currentUser} onOpenAuth={setAuthModal} />
              ) : view === 'settings' ? (
                <SettingsView currentUser={currentUser} onUpdateName={handleUpdateName} onUpdateAvatar={handleUpdateAvatar} onOpenAuth={setAuthModal} />
              ) : view === 'profile' ? (
                <ProfileView username={profileTarget} currentUser={currentUser} titles={published} watchlist={watchlist} onOpen={setActiveTitle} onOpenAuth={setAuthModal} />
              ) : view === 'admin' ? (
                <AdminPanel currentUser={currentUser} titles={titles} onOpenAuth={setAuthModal} moderators={moderators} />
              ) : null}
            </div>
          </main>

          <footer className="border-t border-white/10 py-6 text-center text-xs text-slate-500 glass-panel mb-20 md:mb-0">
            <p>تصميم وبرمجة: <span className="text-slate-300 font-bold">محمود احمد</span> &nbsp;|&nbsp; للتواصل: <a href="tel:07734894407" className="font-mono text-accent-cyan font-bold hover:underline">07734894407</a></p>
          </footer>

          <MobileBottomNav view={view} setView={setView} />

          {activeTitle && (
            <TitleModal title={activeTitle} allTitles={published} currentUser={currentUser} liked={likedIds.includes(activeTitle.id)}
              inWatchlist={watchlist.includes(activeTitle.id)} getRole={getRole}
              onLike={() => toggleLike(activeTitle)} onToggleWatchlist={() => toggleWatchlist(activeTitle.id)}
              onClose={() => { setActiveTitle(null); if (new URLSearchParams(location.search).get('t')) history.replaceState(null, '', location.pathname); }}
              onOpenAuth={setAuthModal} onOpenProfile={openProfile} onOpen={setActiveTitle} />
          )}

          {authModal && <AuthModal tab={authModal} onClose={() => setAuthModal(null)} onSuccess={handleAuthSuccess} />}

          {devPinModal && (
            <DevPinModal currentUser={currentUser} onClose={() => setDevPinModal(false)}
              onSuccess={() => { setDevPinModal(false); setViewRaw('admin'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              onOpenAuth={setAuthModal} />
          )}

          {accountSheet && (
            <AccountSheet currentUser={currentUser} onClose={() => setAccountSheet(false)}
              onLogin={() => { setAccountSheet(false); setAuthModal('login'); }}
              onRegister={() => { setAccountSheet(false); setAuthModal('register'); }}
              onLogout={handleLogout}
              onNavigate={(v) => { if (v === 'profile') setProfileTarget(null); setView(v); setAccountSheet(false); }} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

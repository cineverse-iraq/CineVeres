    function getSubtitleProgress(title) {
      if (!title) return { done: 0, total: 0 };
      if (title.type === 'movie') return { done: normalizeSubtitleUrl(title.subtitleUrl || '') ? 1 : 0, total: 1 };
      const episodes = (title.seasons || []).flatMap(se => Array.isArray(se.episodes) ? se.episodes : []);
      return { done: episodes.filter(ep => normalizeSubtitleUrl(ep.subtitleUrl || '')).length, total: episodes.length };
    }

    function AdminPanel({ currentUser, titles, onOpenAuth, moderators }) {
      const [tab, setTab] = useState('content');
      const [contentType, setContentType] = useState('movie');
      const [editing, setEditing] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [query, setQuery] = useState('');
      const isFullAdmin = currentUser && currentUser.username === 'mavilovelife';

      const handleDelete = async (id) => {
        const t = titles.find(x => x.id === id);
        await db.ref(`titles/${id}`).remove(); await db.ref(`comments/${id}`).remove(); await db.ref(`ratings/${id}`).remove();
        logAuditAction(currentUser, 'حذف عمل', t ? t.name : id);
        showToast('تم حذف العمل بنجاح');
        setDeleteTarget(null);
      };
      const togglePublish = async (t) => {
        const willPublish = t.status !== 'published';
        if (!willPublish) {
          await db.ref(`titles/${t.id}/status`).set('draft');
          logAuditAction(currentUser, 'تحويل عمل لمسودة', t.name);
          showToast('تم تحويل العمل لمسودة');
          return;
        }
        showToast('جاري تجهيز الترجمة العربية قبل النشر...');
        try {
          const snap = await db.ref(`titles/${t.id}`).once('value');
          const current = snap.val() || t;
          const prepared = await prepareSubtitlesForPublish(current, current.sourceId || current.imdbId || current.imdb || current.tmdbId || '', null, [current.imdbId, current.tmdbId].filter(Boolean));
          await db.ref(`titles/${t.id}`).set({ ...prepared.payload, status: 'published' });
          logAuditAction(currentUser, 'نشر عمل', current.name || t.name);
          showToast(prepared.failed ? `تم النشر، لكن تعذر تجهيز ${prepared.failed} ترجمة.` : 'تم تجهيز الترجمة ونشر العمل بنجاح');
        } catch (e) {
          showToast('تم النشر بدون تجهيز الترجمة بسبب خطأ مؤقت', 'error');
          await db.ref(`titles/${t.id}/status`).set('published');
          logAuditAction(currentUser, 'نشر عمل', t.name);
        }
      };
      const toggleFeatured = (t) => {
        db.ref(`titles/${t.id}/featured`).set(t.featured !== true);
        logAuditAction(currentUser, t.featured === true ? 'إزالة عمل من العرض الرئيسي' : 'إضافة عمل للعرض الرئيسي', t.name);
        showToast(t.featured === true ? 'تمت إزالة العمل من العرض الرئيسي' : 'تمت إضافة العمل للعرض الرئيسي');
      };
      const filteredTitles = titles.filter(t => t.type === contentType && (!query.trim() || (t.name || '').toLowerCase().includes(query.trim().toLowerCase())));

      return (
        <div>
          <h1 className="text-2xl md:text-3xl font-black mb-6 text-slate-100">لوحة تحكم  </h1>
          <SlidingTabs
            containerClassName="flex gap-1.5 mb-6 flex-wrap bg-glass-900/80 p-1.5 rounded-2xl border border-white/5"
            items={[
              { key: 'content', label: 'المحتوى (رفع )' },
              { key: 'complaints', label: 'الشكاوى والطلبات' },
              ...(isFullAdmin ? [{ key: 'appeals', label: 'الطعون' }] : []),
              ...(isFullAdmin ? [{ key: 'users', label: 'المستخدمون' }] : []),
              ...(isFullAdmin ? [{ key: 'audit', label: 'سجل النشاط' }] : []),
            ]}
            active={tab} onChange={(k) => { setTab(k); if (k === 'content') setEditing(null); }}
            trackClassName="bg-accent-cyan shadow-[0_0_15px_rgba(0,240,255,0.4)]"
            getButtonClassName={(isActive) => `px-5 py-2.5 rounded-xl text-sm font-bold ${isActive ? 'text-glass-950' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
          />

          {tab === 'content' && (
            editing ? (
              <AdminContentForm initial={editing === 'new' ? null : editing} defaultType={contentType} onDone={() => setEditing(null)} />
            ) : (
              <div>
                <SlidingTabs
                  containerClassName="flex gap-1.5 mb-5 bg-glass-900/80 p-1.5 rounded-2xl border border-white/5"
                  items={[['movie', 'أفلام'], ['series', 'مسلسلات'], ['anime', 'أنمي']].map(([k, l]) => ({
                    key: k, render: () => (<>{l} <span className="opacity-70 text-xs">({titles.filter(t => t.type === k).length})</span></>)
                  }))}
                  active={contentType} onChange={setContentType}
                  trackClassName="bg-accent-red shadow-[0_0_15px_rgba(255,51,75,0.4)]"
                  getButtonClassName={(isActive) => `flex-1 px-4 py-2.5 rounded-xl text-sm font-bold ${isActive ? 'text-white' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
                />
                <div className="flex items-center gap-3 mb-6 flex-wrap">
                  <button onClick={() => setEditing('new')} className="flex items-center gap-2 px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition"><Icon name="plus" className="w-4 h-4" />رفع {TYPE_LABELS[contentType]} جديد</button>
                  <div className="relative flex-1 min-w-[180px]">
                    <Icon name="search" className="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3.5 text-slate-400" />
                    <input value={query} onChange={e => setQuery(e.target.value)} placeholder="بحث ضمن هذا القسم..."
                      className="w-full bg-glass-900 border border-white/10 rounded-2xl py-2.5 pr-10 pl-4 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner" />
                  </div>
                </div>
                <div className="space-y-3">
                  {filteredTitles.length === 0 && <p className="text-sm text-slate-500 font-medium">لا توجد أعمال مطابقة في هذا القسم.</p>}
                  {filteredTitles.map(t => {
                    const subProgress = getSubtitleProgress(t);
                    return (
                    <div key={t.id} className="glass-card rounded-2xl p-4 border border-white/10 flex items-center gap-4 flex-wrap">
                      <div className="w-12 h-16 rounded-xl bg-glass-900 overflow-hidden shrink-0 border border-white/5 shadow-md">
                        {t.poster && <img src={t.poster} className="w-full h-full object-cover" />}
                      </div>
                      <div className="flex-1 min-w-[140px]">
                        <p className="font-bold text-white text-base truncate mb-1"><bdi>{t.name}</bdi></p>
                        <p className="text-xs text-slate-400 font-medium">{TYPE_LABELS[t.type]} · {t.year || ''}{t.type !== 'movie' ? ` · ${(t.seasons || []).length} موسم` : ''}</p>
                      </div>
                      <span className={`text-[11px] px-3 py-1 rounded-full font-bold shrink-0 ${t.status === 'published' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-glass-800 text-slate-400 border border-white/5'}`}>{t.status === 'published' ? 'منشور' : 'مسودة'}</span>
                      <span title="عدد الحلقات التي لديها ترجمة من إجمالي الحلقات" className={`text-[10px] px-2.5 py-1 rounded-full font-bold shrink-0 border ${subProgress.total > 0 && subProgress.done === subProgress.total ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-white/5 text-slate-400 border-white/5'}`}>ترجمة {subProgress.done}/{subProgress.total}</span>
                      {t.featured === true && <span className="text-[11px] px-3 py-1 rounded-full font-bold shrink-0 bg-amber-500/20 text-amber-400 border border-amber-500/30">Hero</span>}
                      <button onClick={() => toggleFeatured(t)} title={t.featured === true ? 'إزالة من العرض الرئيسي (Hero)' : 'إظهار في العرض الرئيسي (Hero)'} className={`w-9 h-9 rounded-xl glass-card border flex items-center justify-center transition shrink-0 ${t.featured === true ? 'border-amber-400 text-amber-400' : 'border-white/10 hover:border-accent-cyan text-slate-200'}`}><Icon name="star" className={`w-4 h-4 ${t.featured === true ? 'fill-current' : ''}`} /></button>
                      <button onClick={() => togglePublish(t)} title="تبديل حالة النشر" className="w-9 h-9 rounded-xl glass-card border border-white/10 hover:border-accent-cyan flex items-center justify-center text-slate-200 transition shrink-0"><Icon name="eye" className="w-4 h-4" /></button>
                      <button onClick={() => setEditing(t)} title="تعديل" className="w-9 h-9 rounded-xl glass-card border border-white/10 hover:border-accent-cyan flex items-center justify-center text-slate-200 transition shrink-0"><Icon name="pencil" className="w-4 h-4" /></button>
                      <button onClick={() => setDeleteTarget(t.id)} title="حذف" className="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 flex items-center justify-center text-rose-400 transition shrink-0"><Icon name="trash-2" className="w-4 h-4" /></button>
                    </div>
                    );
                  })}
                </div>
              </div>
            )
          )}

          {tab === 'complaints' && <AdminComplaints currentUser={currentUser} />}
          {tab === 'appeals' && isFullAdmin && <AdminAppeals currentUser={currentUser} />}
          {tab === 'users' && isFullAdmin && <AdminUsers currentUser={currentUser} />}
          {tab === 'audit' && isFullAdmin && <AdminAuditLog />}

          {deleteTarget && (
            <ConfirmDialog title="حذف هذا العمل؟" body="سيتم حذف العمل وجميع تعليقاته نهائيًا ولا يمكن استرجاعه." confirmLabel="نعم، احذف" cancelLabel="إلغاء" onCancel={() => setDeleteTarget(null)} onConfirm={() => handleDelete(deleteTarget)} />
          )}
        </div>
      );
    }

    function isTitleWatched(watchedMap, title) {
      if (!watchedMap || !title) return false;
      const entry = watchedMap[title.id];
      if (!entry) return false;
      if (title.type === 'movie') return !!entry.movie;
      const seasons = title.seasons || [];
      const totalEpisodes = seasons.reduce((s, se) => s + ((se.episodes || []).length), 0);
      if (!totalEpisodes) return false;
      const doneCount = seasons.reduce((s, se) => s + (se.episodes || []).filter(ep => entry.episodes && entry.episodes[`s${se.number}e${ep.number}`]).length, 0);
      return doneCount >= totalEpisodes;
    }

    function loadWatched() {
      try { return JSON.parse(localStorage.getItem('cv_watched') || '{}'); } catch (e) { return {}; }
    }
    function saveWatchedToStorage(data) {
      try { localStorage.setItem('cv_watched', JSON.stringify(data)); } catch (e) {}
    }

    function App() {
      const [titles, setTitles] = useState([]);
      const [currentUser, setCurrentUser] = useState(() => { try { return JSON.parse(localStorage.getItem('cv_user') || 'null'); } catch (e) { return null; } });
      const [view, setViewRaw] = useState('home');
      const [search, setSearch] = useState('');
      const [activeTitle, setActiveTitle] = useState(null);
      const [authModal, setAuthModal] = useState(null);
      const [accountSheet, setAccountSheet] = useState(false);
      const [likedIds, setLikedIds] = useState(() => { try { const v = JSON.parse(localStorage.getItem('cv_likes') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } });
      const [moderators, setModerators] = useState({});
      const [profileTarget, setProfileTarget] = useState(null);
      const [watched, setWatched] = useState(() => loadWatched());

      const openProfile = (uname) => { setProfileTarget(uname || null); setActiveTitle(null); setAccountSheet(false); setViewRaw('profile'); window.scrollTo({ top: 0, behavior: 'smooth' }); };

      const markEpisodeWatched = (titleId, seasonNumber, episodeNumber) => {
        if (seasonNumber == null || episodeNumber == null) return;
        setWatched(prev => {
          const key = `s${seasonNumber}e${episodeNumber}`;
          const entry = { ...(prev[titleId] || {}) };
          entry.episodes = { ...(entry.episodes || {}), [key]: true };
          const next = { ...prev, [titleId]: entry };
          saveWatchedToStorage(next);
          return next;
        });
      };
      const markMovieWatched = (titleId) => {
        setWatched(prev => {
          const entry = { ...(prev[titleId] || {}), movie: true };
          const next = { ...prev, [titleId]: entry };
          saveWatchedToStorage(next);
          return next;
        });
      };
      const isEpisodeWatched = (titleId, seasonNumber, episodeNumber) => {
        if (seasonNumber == null || episodeNumber == null) return false;
        const entry = watched[titleId];
        if (!entry || !entry.episodes) return false;
        return !!entry.episodes[`s${seasonNumber}e${episodeNumber}`];
      };

      useEffect(() => {
        const ref = db.ref('moderators');
        const cb = snap => setModerators(snap.val() || {});
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      const getRole = (username) => {
        if (!username) return null;
        if (username === 'mavilovelife') return 'admin';
        return moderators[sanitizeKey(username)] ? 'moderator' : null;
      };

      const [accountNotice, setAccountNotice] = useState(null);

      useEffect(() => {
        if (!currentUser) return;
        const ref = db.ref(`users/${currentUser.id}`);
        const cb = snap => {
          const u = snap.val();
          if (!u || u.deleted) {
            setCurrentUser(null); localStorage.removeItem('cv_user');
            localStorage.setItem('cv_watch_username', currentUser.username);
            setAccountNotice({ username: currentUser.username, type: 'deleted', message: 'عذرًا، تم حذف حسابك من قِبل الإدارة.' });
            return;
          }
          if (u.banned) {
            if (u.banUntil && u.banUntil <= Date.now()) {
              db.ref(`users/${currentUser.id}`).update({ banned: false, banReason: null, banUntil: null });
            } else {
              const untilTxt = u.banUntil ? ` إلى غاية ${fmtDateTime(u.banUntil)}` : '';
              setCurrentUser(null); localStorage.removeItem('cv_user');
              localStorage.setItem('cv_watch_username', currentUser.username);
              setAccountNotice({ username: currentUser.username, type: 'banned', message: `حسابك محظور من قِبل الإدارة${untilTxt}.${u.banReason ? ' السبب: ' + u.banReason : ''}` });
              return;
            }
          }
          if (u.isModerator !== currentUser.isModerator) {
            const updated = { ...currentUser, isModerator: u.isModerator };
            setCurrentUser(updated);
            localStorage.setItem('cv_user', JSON.stringify(updated));
          }
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser && currentUser.id]);

      useEffect(() => {
        if (currentUser) return;
        const watchUsername = localStorage.getItem('cv_watch_username');
        if (!watchUsername) return;
        checkAppealNotice(watchUsername).then(res => {
          if (res) {
            setAccountNotice({ username: watchUsername, type: null, message: res.message, outcomeOnly: true });
            localStorage.removeItem('cv_watch_username');
          }
        });
      }, []);

      const setView = (v) => {
        if (v === 'admin') {
          if (!currentUser || !(currentUser.username === 'mavilovelife' || currentUser.isModerator)) {
            setAuthModal('login');
            return;
          }
          setViewRaw('admin'); setSearch(''); window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        setViewRaw(v); setSearch(''); window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const [booted, setBooted] = useState(false);

      useEffect(() => {
        const ref = db.ref('titles');
        const cb = snap => {
          const data = snap.val();
          const list = data ? Object.keys(data).map(k => normalizeTitlePlaybackData({ id: k, ...data[k] })) : [];
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setTitles(list);
          setActiveTitle(prev => {
            if (!prev) return prev;
            const updated = list.find(x => x.id === prev.id);
            return updated || prev;
          });
          setBooted(true);
        };
        ref.on('value', cb);
        const safety = setTimeout(() => setBooted(true), 4000);
        return () => { ref.off('value', cb); clearTimeout(safety); };
      }, []);

      useEffect(() => {
        if (!booted) return;
        const loader = document.getElementById('bootLoader');
        if (loader) {
          loader.classList.add('fading');
          setTimeout(() => loader.remove(), 350);
        }
      }, [booted]);

      useEffect(() => {
        if (!booted || !titles.length) return;
        const t = new URLSearchParams(location.search).get('t');
        if (t) { const found = titles.find(x => x.id === t && x.status === 'published'); if (found) setActiveTitle(found); }
        const u = new URLSearchParams(location.search).get('u');
        if (u) openProfile(u);
      }, [booted, titles]);

      const published = titles.filter(t => t.status === 'published');


      const toggleLike = (title) => {
        const isLiked = likedIds.includes(title.id);
        const next = isLiked ? likedIds.filter(x => x !== title.id) : [...likedIds, title.id];
        setLikedIds(next);
        localStorage.setItem('cv_likes', JSON.stringify(next));
        db.ref(`titles/${title.id}/likes`).transaction(v => Math.max(0, (v || 0) + (isLiked ? -1 : 1)));
      };

      const handleLogout = () => { setCurrentUser(null); localStorage.removeItem('cv_user'); setAccountSheet(false); setView('home'); };

      const handleUpdateAvatar = async (dataUrl) => {
        if (!currentUser) return;
        await db.ref(`users/${currentUser.id}/avatar`).set(dataUrl);
        const updated = { ...currentUser, avatar: dataUrl };
        setCurrentUser(updated);
        localStorage.setItem('cv_user', JSON.stringify(updated));
      };

      const handleUpdateName = async (newName) => {
        if (!currentUser) return;
        await db.ref(`users/${currentUser.id}/name`).set(newName);
        const updated = { ...currentUser, name: newName };
        setCurrentUser(updated);
        localStorage.setItem('cv_user', JSON.stringify(updated));
      };

      const handleAuthSuccess = (user) => {
        const u = { id: user.id, name: user.name, username: user.username, avatar: user.avatar || '' };
        setCurrentUser(u);
        localStorage.setItem('cv_user', JSON.stringify(u));
        setAuthModal(null);
      };

      const searching = search.trim().length > 0;
      let mainList = published;
      if (searching) {
        const q = search.trim().toLowerCase();
        mainList = published.filter(t => t.name && t.name.toLowerCase().includes(q));
      }

      return (
        <div className="min-h-screen flex flex-col mobile-safe-bottom md:pb-0">
          <Header currentUser={currentUser} view={view} setView={setView} search={search} setSearch={setSearch} onOpenAccount={() => setAccountSheet(true)} onOpenProfile={openProfile} onOpenTitleFromNotif={(id) => { const t = titles.find(x => x.id === id && x.status === 'published'); if (t) setActiveTitle(t); }} />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 md:py-8">
            <div key={searching ? 'search' : view} className="page-fade-in">
              {searching ? (
                <TypeGrid title={`نتائج البحث عن "${search}"`} items={mainList} onOpen={setActiveTitle} emptyText="لا توجد نتائج مطابقة." watchedMap={watched} />
              ) : view === 'home' ? (
                <HomeView items={published} onOpen={setActiveTitle} watchedMap={watched} />
              ) : (view === 'movie' || view === 'series' || view === 'anime') ? (
                <TypeGrid title={TYPE_PLURAL[view]} items={published.filter(t => t.type === view)} onOpen={setActiveTitle} showGenreFilter emptyText="لا توجد أعمال في هذا القسم بعد." watchedMap={watched} />
              ) : view === 'lists' ? (
                <ListsView currentUser={currentUser} titles={published} onOpen={setActiveTitle} onOpenAuth={setAuthModal} />
              ) : view === 'requests' ? (
                <RequestsView currentUser={currentUser} onOpenAuth={setAuthModal} />
              ) : view === 'settings' ? (
                <SettingsView currentUser={currentUser} onUpdateName={handleUpdateName} onUpdateAvatar={handleUpdateAvatar} onOpenAuth={setAuthModal} />
              ) : view === 'profile' ? (
                <ProfileView username={profileTarget} currentUser={currentUser} titles={published} onOpen={setActiveTitle} onOpenAuth={setAuthModal} onOpenProfile={openProfile} />
              ) : view === 'admin' ? (
                <AdminPanel currentUser={currentUser} titles={titles} onOpenAuth={setAuthModal} moderators={moderators} />
              ) : null}
            </div>
          </main>

          <MobileBottomNav view={view} setView={setView} />
          <ToastHost />

          {activeTitle && (
            <TitleModal title={activeTitle} allTitles={published} currentUser={currentUser} liked={likedIds.includes(activeTitle.id)}
              getRole={getRole}
              onLike={() => toggleLike(activeTitle)}
              onClose={() => { setActiveTitle(null); if (new URLSearchParams(location.search).get('t')) history.replaceState(null, '', location.pathname); }}
              onOpenAuth={setAuthModal} onOpenProfile={openProfile} onOpen={setActiveTitle}
              watched={watched} onMarkEpisodeWatched={markEpisodeWatched} onMarkMovieWatched={markMovieWatched} isEpisodeWatched={isEpisodeWatched} />
          )}

          {authModal && <AuthModal tab={authModal} onClose={() => setAuthModal(null)} onSuccess={handleAuthSuccess} />}

          {accountSheet && (
            <AccountSheet currentUser={currentUser} onClose={() => setAccountSheet(false)}
              onLogin={() => { setAccountSheet(false); setAuthModal('login'); }}
              onRegister={() => { setAccountSheet(false); setAuthModal('register'); }}
              onLogout={handleLogout}
              onNavigate={(v) => { if (v === 'profile') setProfileTarget(null); setView(v); setAccountSheet(false); }} />
          )}

          {accountNotice && (
            <AppealModal username={accountNotice.username} type={accountNotice.type} message={accountNotice.message}
              outcomeOnly={accountNotice.outcomeOnly} onClose={() => setAccountNotice(null)} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Cairo', sans-serif; background-color: #07090E; color: #F8FAFC; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    * { -webkit-tap-highlight-color: transparent; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    :root { --liquid: cubic-bezier(0.32, 1.5, 0.55, 1); --spring: cubic-bezier(0.32, 1.5, 0.55, 1); --spring-fast: cubic-bezier(0.3, 1.6, 0.5, 1); --collapse: cubic-bezier(0.4, 0, 0.7, 0.2); }

    @keyframes fadeInBackdrop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOutBackdrop { from { opacity: 1; } to { opacity: 0; } }
    @keyframes scaleInPanel { from { opacity: 0; transform: scale(0.92) translateY(14px); filter: blur(4px); } to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
    @keyframes scaleOutPanel { from { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } to { opacity: 0; transform: scale(0.94) translateY(10px); filter: blur(3px); } }
    @keyframes slideUpSheet { from { opacity: 0; transform: translateY(38px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideDownSheet { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(30px) scale(0.98); } }
    @keyframes fadeInContent { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .modal-backdrop { animation: fadeInBackdrop 0.24s ease-out; backdrop-filter: blur(12px); transition: backdrop-filter 0.24s ease-out; }
    .modal-backdrop-out { animation: fadeOutBackdrop 0.2s var(--collapse) forwards; }
    .modal-panel { animation: scaleInPanel 0.38s var(--liquid); }
    .modal-panel-out { animation: scaleOutPanel 0.22s var(--collapse) forwards; }
    .sheet-panel { animation: slideUpSheet 0.4s var(--liquid); }
    .sheet-panel-out { animation: slideDownSheet 0.24s var(--collapse) forwards; }
    .page-fade-in { animation: fadeInContent 0.32s var(--liquid); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(12px) scale(0.94); } }
    .toast-item { animation: toastIn 0.32s var(--liquid); }
    .toast-item-out { animation: toastOut 0.22s var(--collapse) forwards; }

    /* عنصر يُضاف/يُحذف من قائمة: دخول وخروج سلس بدل الظهور المفاجئ */
    @keyframes itemSinkIn { 0% { opacity: 0; transform: scale(0.7) translateY(-16px); } 60% { opacity: 1; transform: scale(1.04) translateY(2px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes itemPopOut { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.6) translateY(14px); } }
    .item-sink-in { animation: itemSinkIn 0.34s var(--spring); }
    .item-pop-out { animation: itemPopOut 0.3s var(--collapse) forwards; }
    @keyframes rowSinkIn { 0% { opacity: 0; transform: translateY(-10px) scale(0.96); max-height: 0; } 100% { opacity: 1; transform: translateY(0) scale(1); max-height: 80px; } }
    @keyframes rowPopOut { 0% { opacity: 1; transform: scale(1) translateX(0); max-height: 80px; } 100% { opacity: 0; transform: scale(0.85) translateX(14px); max-height: 0; } }
    .row-sink-in { animation: rowSinkIn 0.36s var(--spring); overflow: hidden; }
    .row-pop-out { animation: rowPopOut 0.3s var(--collapse) forwards; overflow: hidden; }

    /* كبسولة إشعارات بأسلوب Dynamic Island */
    @keyframes islandExpand { 0% { opacity: 0; transform: translateX(-50%) scale(0.35); } 55% { opacity: 1; transform: translateX(-50%) scale(1.04); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
    @keyframes islandCollapse { 0% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; transform: translateX(-50%) scale(0.5); } }
    .island-in { animation: islandExpand 0.5s var(--spring); transform-origin: top center; }
    .island-out { animation: islandCollapse 0.26s var(--collapse) forwards; transform-origin: top center; }

    .nav-pill-active { transition: transform 0.45s var(--spring), width 0.45s var(--spring); }

    /* مربع البحث بالموبايل: يتمدد من الزر بدل الظهور فجأة */
    .mobile-search-morph { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.3s var(--collapse), opacity 0.2s ease; }
    .mobile-search-morph.open { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.3s var(--liquid), opacity 0.22s ease; }
    .mobile-search-morph > div { overflow: hidden; min-height: 0; }
    img { transition: opacity 0.35s ease; }
    button, a { -webkit-tap-highlight-color: transparent; transition: transform 0.18s var(--spring), background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.3s ease, color 0.25s ease; }
    button:active { transform: scale(0.96); }
    input, textarea, select { font-size: 16px !important; transition: border-color 0.25s ease, box-shadow 0.25s ease; }
    @media (min-width: 768px) { input, textarea, select { font-size: 14px !important; } }

    /* زجاج سائل بأسلوب iOS 26: طبقة انعكاس علوية + بريق حي + عمق حقيقي */
    .glass-panel {
      background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0) 38%), rgba(14, 19, 31, 0.72);
      backdrop-filter: blur(26px) saturate(1.7);
      -webkit-backdrop-filter: blur(26px) saturate(1.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.09);

    .glass-card {

    .video-crop-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .video-crop-wrap:fullscreen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }

    .video-crop-wrap:-ms-fullscreen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    .ios-fake-fullscreen { position: fixed !important; inset: 0 !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; z-index: 9999 !important; }

    .yt-controls-bottom {
      position: absolute; inset-inline: 0; bottom: 0; z-index: 20;
      background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.35) 60%, transparent);

    .yt-controls-bottom.hidden-bar { opacity: 0; pointer-events: none; transform: translateY(6px); }
    .yt-progress { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.25); outline: none; cursor: pointer; }
    .yt-progress::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #00F0FF; box-shadow: 0 0 8px rgba(0,240,255,0.8); cursor: pointer; margin-top: -4.5px; }
    .yt-progress::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #00F0FF; border: none; box-shadow: 0 0 8px rgba(0,240,255,0.8); cursor: pointer; }
    .yt-progress::-moz-range-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.25); }
    .yt-vol { -webkit-appearance: none; appearance: none; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.3); outline: none; cursor: pointer; }
    .yt-vol::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -3.5px; }
    .yt-vol::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: none; cursor: pointer; }
    .yt-btn { display: flex; align-items: center; justify-content: center; color: #fff; transition: opacity 0.15s ease, transform 0.1s ease; opacity: 0.9; }
    .yt-btn:hover { opacity: 1; }

    @keyframes yt-skip-flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
    .yt-skip-flash { animation: yt-skip-flash 0.55s ease-out forwards; }
    @keyframes yt-spin { to { transform: rotate(360deg); } }
    .yt-spinner { animation: yt-spin 0.9s linear infinite; }
  </style>

        var loader = document.getElementById('bootLoader');
        if (loader && !loader.classList.contains('fading')) {
          loader.innerHTML =
            '<div style="text-align:center;padding:24px;max-width:320px;">' +
            '<p style="color:#F8FAFC;font-family:Cairo,sans-serif;font-weight:800;font-size:15px;margin-bottom:16px;line-height:1.6;">تعذّر تحميل الموقع، تحقق من اتصال الإنترنت وحاول مجددًا.</p>' +

            '</div>';

      window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT') {
          var loader = document.getElementById('bootLoader');
          if (loader && !loader.classList.contains('fading')) {
            clearTimeout(forceHideTimeout);
            loader.innerHTML =
              '<div style="text-align:center;padding:24px;max-width:320px;">' +
              '<p style="color:#F8FAFC;font-family:Cairo,sans-serif;font-weight:800;font-size:15px;margin-bottom:16px;line-height:1.6;">تعذّر تحميل أحد ملفات الموقع الأساسية. تحقق من اتصال الإنترنت أو جرّب متصفحًا آخر.</p>' +

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const firebaseConfig = {
      databaseURL: "https://mnste-78361-default-rtdb.firebaseio.com",
      storageBucket: "mnste-78361.firebasestorage.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    function uploadFile(file, folder, onProgress) {
      return new Promise((resolve, reject) => {
        const safeName = (file.name || `upload_${Date.now()}.jpg`).replace(/[^a-zA-Z0-9.\-_]/g, '_');
        const path = `${folder}/${Date.now()}_${safeName}`;
        const ref = storage.ref().child(path);
        const task = ref.put(file);
        task.on('state_changed',
          snap => onProgress && onProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100)),
          err => reject(err),
          () => ref.getDownloadURL().then(resolve).catch(reject)
        );
      });
    }

    function compressImageToDataUrl(file, maxSize = 300, maxBytes = 260000) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) { reject(new Error('ملف غير صالح')); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height) { if (width > maxSize) { height = Math.round(height * (maxSize / width)); width = maxSize; } }
            else { if (height > maxSize) { width = Math.round(width * (maxSize / height)); height = maxSize; } }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            let quality = 0.8;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            while (dataUrl.length > maxBytes && quality > 0.35) { quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality); }
            if (dataUrl.length > maxBytes + 40000) { reject(new Error('الصورة كبيرة جدًا')); return; }
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error('تعذّرت معالجة هذه الصورة'));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error('تعذّرت قراءة الملف'));
        reader.readAsDataURL(file);
      });
    }

    const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const sanitizeKey = (s) => (s || '').replace(/[.#$\/\[\]]/g, '_');

    let toastListeners = [];
    let toastIdCounter = 0;
    function showToast(message, type = 'success') {
      const toast = { id: ++toastIdCounter, message, type };
      toastListeners.forEach(fn => fn(toast));
    }

    function pushNotification(toUsername, data) {
      if (!toUsername) return;
      db.ref(`notifications/${sanitizeKey(toUsername)}`).push({ ...data, date: Date.now(), read: false });
    }

    function normalizeVideoUrl(url) {
      if (!url) return url;
      const clean = url.trim();
      const drive = clean.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (drive) return `https://drive.google.com/file/d/${drive[1]}/preview`;
      const driveOpen = clean.match(/drive\.google\.com\/open\?id=([^&]+)/);
      if (driveOpen) return `https://drive.google.com/file/d/${driveOpen[1]}/preview`;
      const dropbox = clean.match(/^https?:\/\/(www\.)?dropbox\.com\/(.+)$/);
      if (dropbox && !clean.includes('raw=1')) return clean.replace('dropbox.com', 'dl.dropboxusercontent.com').split('?')[0];
      return clean;
    }

    const TYPE_LABELS = { movie: 'فيلم', series: 'مسلسل', anime: 'أنمي' };
    const TYPE_PLURAL = { movie: 'الأفلام', series: 'المسلسلات', anime: 'الأنميات' };
    const COMPLAINT_TYPES = { add: 'طلب إضافة عمل', problem: 'مشكلة في التشغيل أو التحميل', suggestion: 'اقتراح عام' };

    const ORDINAL_ONES_F = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة'];
    const ORDINAL_TEENS_F = ['العاشرة', 'الحادية عشرة', 'الثانية عشرة', 'الثالثة عشرة', 'الرابعة عشرة', 'الخامسة عشرة', 'السادسة عشرة', 'السابعة عشرة', 'الثامنة عشرة', 'التاسعة عشرة'];
    const ORDINAL_TENS_F = ['', '', 'العشرون', 'الثلاثون', 'الأربعون', 'الخمسون', 'الستون', 'السبعون', 'الثمانون', 'التسعون'];

    function arabicOrdinalFeminine(n) {
      n = Number(n) || 0;
      if (n <= 0) return `رقم ${n}`;
      if (n < 10) return ORDINAL_ONES_F[n];
      if (n < 20) return ORDINAL_TEENS_F[n - 10];
      if (n < 100) {
        const tens = Math.floor(n / 10), ones = n % 10;
        return ones === 0 ? ORDINAL_TENS_F[tens] : `${ORDINAL_ONES_F[ones]} و${ORDINAL_TENS_F[tens]}`;
      }
      if (n === 100) return 'المئة';
      return `رقم ${n}`;
    }

    function episodeAutoLabel(ep) {
      const ord = arabicOrdinalFeminine(ep && ep.number);
      if (ep && ep.finality === 'season') return `الحلقة ${ord} والأخيرة من الموسم`;
      if (ep && ep.finality === 'series') return `الحلقة ${ord} والأخيرة`;
      return `الحلقة ${ord}`;
    }

    function fmtDateTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' +
             d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    }

    async function checkAppealNotice(username) {
      if (!username) return null;
      const snap = await db.ref('appeals').orderByChild('username').equalTo(username).once('value');
      const data = snap.val() || {};
      const list = Object.keys(data).map(k => ({ id: k, ...data[k] })).filter(a => a.status !== 'pending' && !a.notifiedSeen);
      if (!list.length) return null;
      list.sort((a, b) => (b.respondedAt || 0) - (a.respondedAt || 0));
      const appeal = list[0];
      await db.ref(`appeals/${appeal.id}/notifiedSeen`).set(true);
      const typeLabel = appeal.type === 'deleted' ? 'محذوف' : 'محظور';
      const restoreLabel = appeal.type === 'deleted' ? 'وتمت استعادته' : 'وتمت إزالة الحظر عنه';
      const message = appeal.status === 'approved'
        ? `تمت الموافقة على طعن حساب (${username}) ${restoreLabel}.`
        : `لم تتم الموافقة على طعن حساب (${username})، وسيبقى ${typeLabel}.`;
      return { message, approved: appeal.status === 'approved' };
    }

    async function submitAppeal(username, type, reason) {
      const pendingSnap = await db.ref('appeals').orderByChild('username').equalTo(username).once('value');
      const data = pendingSnap.val() || {};
      const hasPending = Object.values(data).some(a => a.status === 'pending');
      if (hasPending) return { alreadyPending: true };
      await db.ref('appeals').push({ username, type, reason, status: 'pending', submittedAt: Date.now(), notifiedSeen: false });
      return { alreadyPending: false };
    }

    function isDirectVideo(url) {

    // يبني رابط VidAPI مع تفعيل الترجمة العربية تلقائيًا (lang=ar)، ويدعم إرفاق ملف ترجمة مخصص (sub_url) لحل مشكلة عدم التزامن
    function buildVidApiUrl(kind, rawId, season, episode, subUrl) {
      const id = (rawId || '').trim();
      if (!id) return '';
      const base = kind === 'movie'
        ? `https://vaplayer.ru/embed/movie/${id}`
        : `https://vaplayer.ru/embed/tv/${id}/${Number(season) || 1}/${Number(episode) || 1}`;
      const params = new URLSearchParams();
      params.set('lang', 'ar'); // يخلي النظام يبحث ويفعّل ترجمة عربية تلقائيًا من OpenSubtitles
      if (subUrl && subUrl.trim()) {
        params.set('sub_url', subUrl.trim());
        params.set('sub_lang', 'ar');
        params.set('sub_label', 'العربية');
        params.set('sub_default', 'true');
      }
      return `${base}?${params.toString()}`;
    }

    function VidApiHelper({ kind, season, episode, onGenerate, defaultId }) {

      useEffect(() => { if (defaultId) setId(defaultId); }, [defaultId]);
      const [subUrl, setSubUrl] = useState('');

            <button type="button" onClick={generate} disabled={!id.trim()} className="shrink-0 px-4 py-2 rounded-xl bg-accent-cyan text-glass-950 text-xs font-bold hover:brightness-110 transition disabled:opacity-40">توليد الرابط</button>

    // ===== TMDB: تعبئة تلقائية لبيانات العمل من معرف IMDB/TMDB =====
    const TMDB_IMG = 'https://image.tmdb.org/t/p/';

    const TMDB_API_KEY = 'a1ab2b7d22e16c6c20e9e419b8f1c098';
    function getTmdbKey() { return TMDB_API_KEY; }

    async function tmdbFetch(path, params) {
      const key = getTmdbKey();
      if (!key) throw new Error('الرجاء إدخال مفتاح TMDB أولًا');
      const usp = new URLSearchParams(Object.assign({ api_key: key }, params || {}));
      let res;
      try {
        res = await fetch(`https://api.themoviedb.org/3/${path}?${usp.toString()}`);
      } catch (e) {
        throw new Error('تعذر الاتصال بـ TMDB — تحقق من الإنترنت');
      }
      if (res.status === 401) throw new Error('مفتاح TMDB غير صحيح');
      if (res.status === 404) throw new Error('لم يتم العثور على هذا المعرف في TMDB');
      if (!res.ok) throw new Error('خطأ من TMDB (رمز ' + res.status + ')');
      return res.json();
    }

    // OMDb (يسحب من قاعدة بيانات IMDB مباشرة) — نستخدمه احتياط بس إذا TMDB ما عنده اسم الحلقة
    const OMDB_API_KEY = '52191abb';
    async function omdbFetch(params) {
      const usp = new URLSearchParams(Object.assign({ apikey: OMDB_API_KEY }, params || {}));
      let res;
      try {
        res = await fetch(`https://www.omdbapi.com/?${usp.toString()}`);
      } catch (e) {
        throw new Error('تعذر الاتصال بـ OMDb');
      }
      if (!res.ok) throw new Error('خطأ من OMDb (رمز ' + res.status + ')');
      return res.json();
    }

    // يقبل: tt1517268 · 385687 · رابط IMDB · رابط TMDB
    function parseMediaInput(raw) {
      const s = (raw || '').trim();
      if (!s) return null;
      const imdb = s.match(/tt\d{6,}/i);
      if (imdb) return { kind: 'imdb', id: imdb[0].toLowerCase() };
      const url = s.match(/themoviedb\.org\/(movie|tv)\/(\d+)/i);
      if (url) return { kind: 'tmdb', media: url[1].toLowerCase(), id: url[2] };
      if (/^\d+$/.test(s)) return { kind: 'tmdb', id: s };
      return null;
    }

    function tmdbNames(list, limit) {
      return (list || []).slice(0, limit || 3).map(p => p.name).filter(Boolean).join('، ');
    }

    // يرجّع: { patch, sourceId, media }
    async function importFromTmdb(rawInput, currentType, opts) {
      const options = opts || {};
      const parsed = parseMediaInput(rawInput);
      if (!parsed) throw new Error('صيغة غير معروفة — أدخل معرف IMDB مثل tt1517268 أو معرف TMDB رقمي');

      let media, tmdbId, imdbId = '', foundDate = '';
      if (parsed.kind === 'imdb') {
        imdbId = parsed.id;
        const found = await tmdbFetch(`find/${parsed.id}`, { external_source: 'imdb_id', language: 'ar' });
        if ((found.movie_results || []).length) { media = 'movie'; tmdbId = found.movie_results[0].id; foundDate = found.movie_results[0].release_date || ''; }
        else if ((found.tv_results || []).length) { media = 'tv'; tmdbId = found.tv_results[0].id; foundDate = found.tv_results[0].first_air_date || ''; }
        else throw new Error('لم يُعثر على هذا المعرف في TMDB');
      } else {
        tmdbId = parsed.id;
        media = parsed.media || (currentType === 'movie' ? 'movie' : 'tv');
      }

      const data = await tmdbFetch(`${media}/${tmdbId}`, { language: 'ar', append_to_response: 'external_ids' });

      // نجيب النسخة الإنكليزية دايمًا: للاسم، ولأسماء المخرج/الكاتب (حتى تصير موحّدة بالإنكليزي دائمًا وما تصير مرة عربي ومرة انكليزي)
      let en = null;
      try { en = await tmdbFetch(`${media}/${tmdbId}`, { language: 'en-US', append_to_response: 'credits' }); } catch (e) {}

      let name = (en && (en.title || en.name)) || data.original_title || data.original_name || data.title || data.name || '';
      let overview = (data.overview || '').trim();
      if (!overview && en) overview = (en.overview || '').trim();
      let genres = (data.genres || []).map(g => g.name).filter(Boolean);
      if (!genres.length && en) genres = (en.genres || []).map(g => g.name).filter(Boolean);

      if (!imdbId) imdbId = (data.external_ids && data.external_ids.imdb_id) || '';

      // المخرج والكاتب دايمًا بالإنكليزي (أسماء الأشخاص بـTMDB أحيانًا تنترجم عربي وأحيانًا لا، فيصير تشتت لو اعتمدنا النسخة العربية)
      const crew = (en && en.credits && en.credits.crew) || [];
      let director = tmdbNames(crew.filter(c => c.job === 'Director'));
      let writer = tmdbNames(crew.filter(c => ['Writer', 'Screenplay', 'Story', 'Novel', 'Teleplay'].includes(c.job)));
      if (media === 'tv') {
        const creators = tmdbNames((en && en.created_by) || data.created_by);
        if (!director) director = creators;
        if (!writer) writer = creators;
      }

      const dateStr = data.release_date || data.first_air_date || (en && (en.release_date || en.first_air_date)) || foundDate || '';
      const sourceId = imdbId || String(tmdbId);

      const parsedYear = dateStr ? parseInt(dateStr.slice(0, 4), 10) : NaN;

      const patch = {
        name: name,
        year: Number.isFinite(parsedYear) ? parsedYear : new Date().getFullYear(),
        genresText: genres.join(', '),
        poster: data.poster_path ? TMDB_IMG + 'w500' + data.poster_path : '',
        backdrop: data.backdrop_path ? TMDB_IMG + 'original' + data.backdrop_path : '',
        description: overview,
        director: director,
        writer: writer,
        imdbRating: data.vote_average ? Number(data.vote_average).toFixed(1) : '',
      };

      // نوع العمل: نبدّل فيلم/مسلسل فقط، ونترك "أنمي" كما هو
      if (media === 'tv' && currentType === 'movie') patch.type = 'series';
      if (media === 'movie' && currentType !== 'movie') patch.type = 'movie';

      if (media === 'movie') {
        patch.videoUrl = buildVidApiUrl('movie', sourceId);
      }

      if (media === 'tv' && options.withEpisodes) {
        const list = (data.seasons || []).filter(s => Number(s.season_number) > 0);
        const seasons = [];
        for (let i = 0; i < list.length; i++) {
          const s = list[i];
          if (options.onProgress) options.onProgress(`جاري جلب الموسم ${s.season_number} (${i + 1}/${list.length})...`);
          let sd;
          // نجيب الحلقات بالإنكليزي دائمًا: ترجمة أسماء الحلقات عربي بـTMDB غالبًا غير دقيقة/ناقصة
          try { sd = await tmdbFetch(`tv/${tmdbId}/season/${s.season_number}`, { language: 'en-US' }); }
          catch (e) { continue; }

          // احتياط: إذا TMDB ما عنده اسم حلقة، نجيب اسمها من OMDb (قاعدة بيانات IMDB) بطلب واحد لكل موسم
          let omdbEpisodes = null;
          const missingSome = (sd.episodes || []).some(ep => !(ep.name || '').trim());
          if (missingSome && imdbId) {
            try {
              const od = await omdbFetch({ i: imdbId, Season: s.season_number });
              if (od && od.Response === 'True' && Array.isArray(od.Episodes)) omdbEpisodes = od.Episodes;
            } catch (e) {}
          }

          const seasonPoster = s.poster_path ? TMDB_IMG + 'w500' + s.poster_path : '';
          seasons.push({
            number: Number(s.season_number),
            year: (s.air_date || '').slice(0, 4) || '',
            poster: seasonPoster,
            episodeThumbnail: seasonPoster,
            episodes: (sd.episodes || []).map(ep => {
              let epTitle = (ep.name || '').trim();
              if (!epTitle && omdbEpisodes) {
                const match = omdbEpisodes.find(oe => Number(oe.Episode) === Number(ep.episode_number));
                if (match && match.Title && match.Title !== 'N/A') epTitle = match.Title.trim();
              }
              return Object.assign(emptyEpisode(Number(ep.episode_number) || 1), {
                number: Number(ep.episode_number) || 1,
                title: epTitle,
                imdb: ep.vote_average ? Number(ep.vote_average).toFixed(1) : '',
                videoUrl: buildVidApiUrl('tv', sourceId, s.season_number, ep.episode_number),
              });
            }),
          });
        }
        patch.seasons = seasons;
      }

      return { patch: patch, sourceId: sourceId, media: media, tmdbId: tmdbId, imdbId: imdbId };
    }

    function TmdbImportPanel({ type, onApply }) {

    function useIsMobile() {
      const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' ? window.innerWidth < 768 : false);
      useEffect(() => {
        const onResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);
      return isMobile;
    }

    function SlidingTabs({ items, active, onChange, containerClassName = '', trackClassName = 'bg-accent-red shadow-[0_0_15px_rgba(255,51,75,0.4)]', getButtonClassName }) {
      const containerRef = useRef(null);
      const btnRefs = useRef({});
      const [style, setStyle] = useState(null);

      const measure = () => {
        const btn = btnRefs.current[active];
        const container = containerRef.current;
        if (!btn || !container) return;
        const cRect = container.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.width < 1 || bRect.height < 1) return;
        setStyle(prev => {
          const next = { left: bRect.left - cRect.left, top: bRect.top - cRect.top, width: bRect.width, height: bRect.height };
          if (prev && Math.abs(prev.left - next.left) < 0.5 && Math.abs(prev.top - next.top) < 0.5 && Math.abs(prev.width - next.width) < 0.5 && Math.abs(prev.height - next.height) < 0.5) return prev;
          return next;
        });
      };

      useLayoutEffect(measure, [active, items.map(i => i.key).join(',')]);
      useEffect(() => {
        const raf1 = requestAnimationFrame(() => requestAnimationFrame(measure));
        const t = setTimeout(measure, 360);
        const onResize = () => measure();
        window.addEventListener('resize', onResize);
        const ro = typeof ResizeObserver !== 'undefined' && containerRef.current ? new ResizeObserver(onResize) : null;
        if (ro && containerRef.current) ro.observe(containerRef.current);
        return () => { cancelAnimationFrame(raf1); clearTimeout(t); window.removeEventListener('resize', onResize); if (ro) ro.disconnect(); };
      }, [active]);

      return (
        <div ref={containerRef} className={`relative ${containerClassName}`}>
          {style && (
            <div className={`absolute rounded-xl pointer-events-none ${trackClassName}`}
              style={{ left: style.left, top: style.top, width: style.width, height: style.height, transition: 'left 0.45s var(--liquid, var(--spring)), top 0.45s var(--liquid, var(--spring)), width 0.45s var(--liquid, var(--spring)), height 0.45s var(--liquid, var(--spring))' }} />
          )}
          {items.map(it => {
            const isActive = active === it.key;
            return (
              <button key={it.key} ref={el => { if (el) btnRefs.current[it.key] = el; }} onClick={() => onChange(it.key)}
                className={`relative z-10 ${getButtonClassName ? getButtonClassName(isActive) : ''}`}>
                {it.render ? it.render(isActive) : it.label}
              </button>
            );
          })}
        </div>
      );
    }

    }

      const icons = {

      const uid = useRef('fs' + Math.random().toString(36).slice(2)).current;
      const pct = Math.max(0, Math.min(1, fraction)) * 100;

            <clipPath id={`${uid}-clip`}><rect x="0" y="0" width={pct / 100 * 24} height="24" /></clipPath>

            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" className="text-amber-400" clipPath={`url(#${uid}-clip)`} />
          )}
        </svg>
      );
    }

    function StarRatingInput({ value, onChange, size = "w-7 h-7" }) {
      const [hover, setHover] = useState(0);
      const display = hover || value || 0;

      const handleMove = (e, n) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const frac = (e.clientX - rect.left) / rect.width;
        setHover(frac < 0.5 ? n - 0.5 : n);
      };
      const handleClick = (e, n) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const frac = (e.clientX - rect.left) / rect.width;
        onChange(frac < 0.5 ? n - 0.5 : n);
      };

      return (
        <div className="flex items-center gap-1" dir="ltr">
          {[1, 2, 3, 4, 5].map(n => {
            const frac = Math.max(0, Math.min(1, display - (n - 1)));
            return (
              <button key={n} type="button"
                onMouseMove={e => handleMove(e, n)}
                onClick={e => handleClick(e, n)}
                onMouseLeave={() => setHover(0)}
                className="star-btn">
                <FractionalStar fraction={frac} size={size} />
              </button>
            );
          })}
          {display > 0 && <span className="text-xs font-bold text-amber-400 mr-1.5">{display}</span>}
        </div>
      );
    }

    function StarRatingDisplay({ value, size = "w-3.5 h-3.5" }) {
      const rounded = Math.round((value || 0) * 2) / 2;
      return (
        <div className="flex items-center gap-0.5" dir="ltr">
          {[1, 2, 3, 4, 5].map(n => {
            const frac = Math.max(0, Math.min(1, rounded - (n - 1)));
            return <FractionalStar key={n} fraction={frac} size={size} />;
          })}
        </div>
      );
    }

    function RatingBadges({ imdb, rt, size }) {
      const hasImdb = imdb !== undefined && imdb !== null && imdb !== '';
      const hasRt = rt !== undefined && rt !== null && rt !== '';
      if (!hasImdb && !hasRt) return null;
      const small = size === 'xs';
      const rtNum = hasRt ? parseInt(String(rt).replace('%', '')) : null;
      const rtGood = rtNum !== null && !isNaN(rtNum) && rtNum >= 60;
      return (
        <div className="flex items-center gap-1.5 flex-wrap">
          {hasImdb && (
            <span className={`inline-flex items-center gap-1 ${small ? 'text-[10px] px-2 py-0.5' : 'text-xs px-2.5 py-1'} rounded-md bg-black/60 backdrop-blur-md text-amber-400 font-bold border border-amber-400/20 shadow-sm`}>
              <Icon name="star" className={small ? 'w-2.5 h-2.5' : 'w-3 h-3'} />IMDb {imdb}
            </span>
          )}
          {hasRt && (
            <span className={`inline-flex items-center gap-1 ${small ? 'text-[10px] px-2 py-0.5' : 'text-xs px-2.5 py-1'} rounded-md bg-black/60 backdrop-blur-md font-bold border border-white/10 ${rtGood ? 'text-emerald-400' : 'text-rose-400'}`}>
              RT {String(rt).includes('%') ? rt : rt + '%'}
            </span>
          )}
        </div>
      );
    }

    function ToastHost() {
      const [toasts, setToasts] = useState([]);
      useEffect(() => {
        const handler = (toast) => {
          setToasts(prev => [...prev, toast]);
          setTimeout(() => {
            setToasts(prev => prev.map(t => t.id === toast.id ? { ...t, leaving: true } : t));
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== toast.id)), 320);
          }, 3000);
        };
        toastListeners.push(handler);
        return () => { toastListeners = toastListeners.filter(fn => fn !== handler); };
      }, []);

      if (!toasts.length) return null;
      return (
        <div className="fixed z-[100] inset-x-0 bottom-24 md:bottom-8 flex flex-col items-center gap-2.5 px-4 pointer-events-none">
          {toasts.map(t => (
            <div key={t.id} className={`${t.leaving ? 'toast-item-out' : 'toast-item'} pointer-events-auto w-full max-w-sm flex items-center gap-3 px-4 py-3.5 rounded-2xl glass-panel border shadow-2xl ${t.type === 'error' ? 'border-rose-500/30' : 'border-emerald-500/30'}`}>
              <span className={`w-7 h-7 rounded-full flex items-center justify-center shrink-0 ${t.type === 'error' ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                <Icon name={t.type === 'error' ? 'x' : 'check'} className="w-4 h-4" />
              </span>
              <span className="text-sm font-bold text-slate-100 flex-1">{t.message}</span>
            </div>
          ))}
        </div>
      );
    }

    function Row({ label, items, onOpen, watchedMap }) {

    function Hero({ items, onOpen }) {
      const [idx, setIdx] = useState(0);
      const dragState = useRef({ startX: 0, dragging: false });
      const [dragOffset, setDragOffset] = useState(0);
      const [isDragging, setIsDragging] = useState(false);

      useEffect(() => {
        if (items.length < 2 || isDragging) return;
        const t = setInterval(() => setIdx(i => (i + 1) % items.length), 6000);
        return () => clearInterval(t);
      }, [items.length, isDragging]);

      if (!items.length) return null;

      const go = (i) => setIdx(((i % items.length) + items.length) % items.length);
      const getX = (e) => (e.touches ? e.touches[0].clientX : e.clientX);

      const onDragStart = (e) => {
        if (items.length < 2) return;
        dragState.current = { startX: getX(e), dragging: true };
        setIsDragging(true);
      };
      const onDragMove = (e) => {
        if (!dragState.current.dragging) return;
        setDragOffset(getX(e) - dragState.current.startX);
      };
      const endDrag = () => {
        if (!dragState.current.dragging) return;
        const threshold = 60;
        if (dragOffset > threshold) go(idx - 1);
        else if (dragOffset < -threshold) go(idx + 1);
        dragState.current.dragging = false;
        setDragOffset(0);
        setIsDragging(false);
      };

      const item = items[idx % items.length];
      return (
        <section
          className="relative h-[42vh] min-h-[300px] md:h-[72vh] -mx-4 md:mx-0 mb-8 md:mb-10 md:rounded-3xl overflow-hidden glass-panel border border-white/10 shadow-2xl select-none cursor-grab active:cursor-grabbing"
          style={{ touchAction: 'pan-y' }}
          onMouseDown={onDragStart} onMouseMove={onDragMove} onMouseUp={endDrag} onMouseLeave={endDrag}
          onTouchStart={onDragStart} onTouchMove={onDragMove} onTouchEnd={endDrag}
        >
          {item.backdrop && (
            <img src={item.backdrop} alt="" draggable="false"
              className="absolute inset-0 w-full h-full object-cover opacity-60"
              style={{ transform: `translateX(${dragOffset * 0.3}px) scale(1.05)`, transition: isDragging ? 'none' : 'transform 0.4s ease' }} />
          )}
          <div className="absolute inset-0 bg-gradient-to-t from-glass-950 via-glass-950/60 to-transparent" />
          <div className="absolute inset-x-0 bottom-0 p-5 md:p-12 max-w-2xl">
            <div className="flex items-center gap-2 mb-3 flex-wrap">
              <span className="text-xs px-3 py-1 rounded-full bg-accent-red text-white font-bold shadow-[0_0_15px_rgba(255,51,75,0.4)]">{TYPE_LABELS[item.type]}</span>
              <RatingBadges imdb={item.imdbRating} rt={item.rtRating} />
            </div>
            <h1 className="text-3xl md:text-5xl font-black text-white leading-tight mb-3 drop-shadow-md">{item.name}</h1>

            <button onClick={() => onOpen(item)} className="flex items-center gap-2 px-6 py-3 rounded-xl bg-accent-red hover:bg-accent-redHover font-bold text-white shadow-[0_0_20px_rgba(255,51,75,0.5)] transition transform hover:scale-105 active:scale-95">

    function HomeView({ items, onOpen, continueItems, watchedMap }) {
      if (!items.length) return <EmptyState text="لا توجد أعمال منشورة بعد. تابعنا قريبًا!" />;
      const featured = items.filter(t => t.featured).length ? items.filter(t => t.featured) : items.slice(0, 5);
      const latest = [...items].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 12);
      const genreCounts = {};
      items.forEach(t => (t.genres || []).forEach(g => genreCounts[g] = (genreCounts[g] || 0) + 1));

    const SORT_OPTIONS = [
      ['newest', 'الأحدث إضافةً'],
      ['imdb', 'الأعلى تقييم IMDb'],
      ['year', 'سنة الإصدار'],
      ['name', 'الاسم (أ-ي)'],
      ['popular', 'الأكثر مشاهدة'],
    ];

    function sortTitles(items, sortKey) {
      const arr = [...items];
      if (sortKey === 'imdb') arr.sort((a, b) => (parseFloat(b.imdbRating) || 0) - (parseFloat(a.imdbRating) || 0));
      else if (sortKey === 'year') arr.sort((a, b) => (b.year || 0) - (a.year || 0));
      else if (sortKey === 'name') arr.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      else if (sortKey === 'popular') arr.sort((a, b) => (b.views || 0) - (a.views || 0));
      else arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      return arr;
    }

    function NotificationsBell({ currentUser, onOpenProfile, onOpenTitle }) {
      const [open, setOpen] = useState(false);
      const [items, setItems] = useState([]);

      useEffect(() => {
        const ref = db.ref(`notifications/${sanitizeKey(currentUser.username)}`).limitToLast(50);
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => (b.date || 0) - (a.date || 0));
          setItems(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser.username]);

      const unreadCount = items.filter(n => !n.read).length;

      const openPanel = () => {
        setOpen(o => !o);
        if (!open) {
          items.filter(n => !n.read).forEach(n => db.ref(`notifications/${sanitizeKey(currentUser.username)}/${n.id}/read`).set(true));
        }
      };

      const handleClick = (n) => {
        setOpen(false);
        if (n.titleId && onOpenTitle) onOpenTitle(n.titleId);
        else if (n.fromUsername && onOpenProfile) onOpenProfile(n.fromUsername);
      };

      const notifText = (n) => {
        if (n.type === 'follow') return 'بدأ بمتابعتك';
        if (n.type === 'reply') return `رد على تعليقك: ${n.text || ''}`;
        if (n.type === 'reviewReply') return `رد على مراجعتك: ${n.text || ''}`;
        return n.text || '';
      };

      return (
        <div className="relative">
          <button onClick={openPanel} className="relative w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-slate-200 hover:border-accent-cyan transition shrink-0">
            <Icon name="bell" className="w-[18px] h-[18px]" />
            {unreadCount > 0 && <span className="absolute -top-1 -left-1 min-w-[18px] h-[18px] px-1 rounded-full bg-accent-red text-white text-[10px] font-black flex items-center justify-center">{unreadCount > 9 ? '9+' : unreadCount}</span>}
          </button>
          {open && (
            <>
              <div className="fixed inset-0 z-40" onClick={() => setOpen(false)}></div>
              <div className="absolute z-50 top-full left-0 mt-2 w-80 max-w-[85vw] glass-panel border border-white/10 rounded-2xl overflow-hidden shadow-2xl max-h-[70vh] overflow-y-auto">
                <p className="px-4 pt-3 pb-2 text-sm font-black text-white border-b border-white/10">الإشعارات</p>
                {items.length === 0 ? (
                  <p className="text-xs text-slate-500 font-medium text-center py-8">لا توجد إشعارات بعد.</p>
                ) : items.map(n => (
                  <button key={n.id} onClick={() => handleClick(n)} className={`w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 transition text-right border-b border-white/5 ${!n.read ? 'bg-accent-cyan/5' : ''}`}>
                    <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center font-black text-xs text-glass-950 overflow-hidden shrink-0">
                      {n.fromAvatar ? <img src={n.fromAvatar} alt="" className="w-full h-full object-cover" /> : (n.fromName || '?').charAt(0)}
                    </div>
                    <div className="min-w-0 flex-1">
                      <p className="text-xs text-slate-200"><span className="font-bold text-white">{n.fromName}</span> {notifText(n)}</p>
                      <p className="text-[10px] text-slate-500 font-mono mt-0.5">{fmtDateTime(n.date)}</p>
                    </div>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    function MobileBottomNav({ view, setView }) {
      const items = [['home', 'الرئيسية', 'home'], ['movie', 'أفلام', 'film'], ['series', 'مسلسلات', 'tv'], ['anime', 'أنمي', 'sparkles'], ['lists', 'قوائمي', 'list']];
      const [hidden, setHidden] = useState(false);
      const lastY = useRef(0);
      const ticking = useRef(false);

      useEffect(() => {
        lastY.current = window.scrollY || 0;
        const onScroll = () => {
          if (ticking.current) return;
          ticking.current = true;
          requestAnimationFrame(() => {
            const y = window.scrollY || 0;
            const delta = y - lastY.current;
            if (y < 24) {
              setHidden(false);
            } else if (delta > 6) {
              setHidden(true);
            } else if (delta < -6) {
              setHidden(false);
            }
            lastY.current = y;
            ticking.current = false;
          });
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <nav
          className="md:hidden fixed bottom-0 inset-x-0 z-40 glass-panel border-t border-white/10 flex px-2 py-1 shadow-2xl"
          style={{
            paddingBottom: 'calc(env(safe-area-inset-bottom) + 4px)',
            transform: hidden ? 'translateY(115%)' : 'translateY(0)',
            transition: 'transform 0.32s var(--spring)',

            containerClassName="flex-1 flex"

        </nav>
      );

              <button onClick={submit} disabled={loading} className="w-full py-3.5 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition disabled:opacity-50">
                {loading ? 'جارٍ التحقق...' : (tab === 'login' ? 'دخول' : 'إنشاء الحساب')}

    function VideoPlayer({ src, onError, trimStart, trimEnd, fitMobile, fitDesktop, crop, episodeLabel, onComplete }) {
      const videoRef = useRef(null);
      const wrapRef = useRef(null);
      const hideTimerRef = useRef(null);

      const cropReady = fit === 'crop' && c.active && c.width > 0 && c.height > 0 && stage.w > 0 && stage.h > 0 && natural.w > 0 && natural.h > 0;

      useEffect(() => { completedRef.current = false; }, [src]);
      const fireComplete = () => {
        if (completedRef.current) return;
        completedRef.current = true;
        onComplete && onComplete();
      };

      useEffect(() => {
        const videoEl = videoRef.current;
        if (!videoEl || !src) return;
        setLoading(true);
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        try { videoEl.setAttribute('muted', ''); } catch (e) {}
        let hls;
        const isM3u8 = /\.m3u8(\?.*)?$/i.test(src);
        if (isM3u8 && window.Hls && window.Hls.isSupported()) {
          hls = new window.Hls();

          hls.attachMedia(videoEl);
          hls.on(window.Hls.Events.ERROR, (_e, data) => { if (data && data.fatal) onError && onError(); });
        } else {
          videoEl.src = src;
          videoEl.load();
        }
        const tryPlay = () => { const p = videoEl.play(); if (p && p.catch) p.catch(() => {}); };
        tryPlay();
        const stuckTimer = setTimeout(() => { setLoading(false); }, 12000);
        return () => { if (hls) hls.destroy(); clearTimeout(stuckTimer); };
      }, [src]);

      useEffect(() => {

        const onLoaded = () => {
          if (trimStart) { try { videoEl.currentTime = trimStart; } catch (e) {} }
          setNatural({ w: videoEl.videoWidth || 0, h: videoEl.videoHeight || 0 });
        };
        const onTime = () => {
          if (trimEnd && videoEl.currentTime >= trimEnd) { videoEl.pause(); fireComplete(); }
          else if (!trimEnd && videoEl.duration && videoEl.currentTime >= videoEl.duration - 0.6) { fireComplete(); }
        };
        videoEl.addEventListener('loadedmetadata', onLoaded);
        videoEl.addEventListener('timeupdate', onTime);
        return () => { videoEl.removeEventListener('loadedmetadata', onLoaded); videoEl.removeEventListener('timeupdate', onTime); };
      }, [src, trimStart, trimEnd]);

      const [ctrl, setCtrl] = useState({ playing: false, muted: true, volume: 1, current: 0, duration: 0, buffered: 0, rate: 1 });
      const [barVisible, setBarVisible] = useState(true);
      const [skipFlash, setSkipFlash] = useState(null);
      const [showSpeedMenu, setShowSpeedMenu] = useState(false);
      const [fakeFullscreen, setFakeFullscreen] = useState(false);

      useEffect(() => {
        const videoEl = videoRef.current;
        if (!videoEl) return;
        const onPlay = () => { setCtrl(c2 => ({ ...c2, playing: true })); setLoading(false); };
        const onPause = () => setCtrl(c2 => ({ ...c2, playing: false }));
        const onVolume = () => setCtrl(c2 => ({ ...c2, muted: videoEl.muted, volume: videoEl.volume }));
        const onLoadedMeta = () => setCtrl(c2 => ({ ...c2, duration: videoEl.duration || 0 }));
        const onTimeUpdate = () => setCtrl(c2 => ({ ...c2, current: videoEl.currentTime || 0 }));
        const onProgress = () => {
          try {
            const b = videoEl.buffered;
            if (b && b.length) setCtrl(c2 => ({ ...c2, buffered: b.end(b.length - 1) }));
          } catch (e) {}
        };
        const onRate = () => setCtrl(c2 => ({ ...c2, rate: videoEl.playbackRate || 1 }));
        const onWaiting = () => setLoading(true);
        const onStalled = () => setLoading(true);
        const onLoadedData = () => setLoading(false);
        const onEnded = () => { fireComplete(); };
        videoEl.addEventListener('play', onPlay);
        videoEl.addEventListener('pause', onPause);
        videoEl.addEventListener('volumechange', onVolume);
        videoEl.addEventListener('loadedmetadata', onLoadedMeta);
        videoEl.addEventListener('timeupdate', onTimeUpdate);
        videoEl.addEventListener('progress', onProgress);
        videoEl.addEventListener('ratechange', onRate);
        videoEl.addEventListener('waiting', onWaiting);
        videoEl.addEventListener('stalled', onStalled);
        videoEl.addEventListener('loadeddata', onLoadedData);
        videoEl.addEventListener('ended', onEnded);
        return () => {
          videoEl.removeEventListener('play', onPlay);
          videoEl.removeEventListener('pause', onPause);
          videoEl.removeEventListener('volumechange', onVolume);
          videoEl.removeEventListener('loadedmetadata', onLoadedMeta);
          videoEl.removeEventListener('timeupdate', onTimeUpdate);
          videoEl.removeEventListener('progress', onProgress);
          videoEl.removeEventListener('ratechange', onRate);
          videoEl.removeEventListener('waiting', onWaiting);
          videoEl.removeEventListener('stalled', onStalled);
          videoEl.removeEventListener('loadeddata', onLoadedData);
          videoEl.removeEventListener('ended', onEnded);
        };
      }, [src]);

      const togglePlay = () => {
        const v = videoRef.current;
        if (!v) return;
        if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
        else v.pause();
      };
      const toggleMute = () => { const v = videoRef.current; if (!v) return; v.muted = !v.muted; if (!v.muted && v.volume === 0) v.volume = 0.5; };
      const setVolume = (val) => { const v = videoRef.current; if (!v) return; const num = Number(val); v.volume = num; v.muted = num === 0; };
      const seekTo = (val) => { const v = videoRef.current; if (v) v.currentTime = Number(val); };
      const setRate = (r) => { const v = videoRef.current; if (!v) return; v.playbackRate = r; setShowSpeedMenu(false); };
      const skip = (delta) => {

        if (!v) return;

      };

      const [isFs, setIsFs] = useState(false);
      useEffect(() => {
        const onFsChange = () => {

      const effectiveFs = isFs
      const toggleFullscreen = () => {
  const v = videoRef.current;
  if (isIOS && v && v.webkitEnterFullscreen) {

  }
  const el = wrapRef.current;

  if (req) req.call(el);
};
      useEffect(() => {
        if (!fakeFullscreen) return;
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = prevOverflow; };
      }, [fakeFullscreen]);

      const showBarTemporarily = () => {
        setBarVisible(true);
        if (hideTimerRef.current) clearTimeout(hideTimerRef.current);
        hideTimerRef.current = setTimeout(() => { if (videoRef.current && !videoRef.current.paused) setBarVisible(false); }, 3000);
      };
      useEffect(() => {
        if (!ctrl.playing) { setBarVisible(true); if (hideTimerRef.current) clearTimeout(hideTimerRef.current); }
        else showBarTemporarily();
        // eslint-disable-next-line
      }, [ctrl.playing]);
      useEffect(() => () => { if (hideTimerRef.current) clearTimeout(hideTimerRef.current); }, []);

      useEffect(() => {
        const onKeyDown = (e) => {
          const active = document.activeElement;
          const tag = active ? active.tagName : '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || (active && active.isContentEditable)) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); skip(5); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); skip(-5); }
          else if (e.key === ' ' || e.code === 'Space' || e.key === 'Spacebar') { e.preventDefault(); togglePlay(); showBarTemporarily(); }
          else if (e.key === 'Enter') { e.preventDefault(); togglePlay(); showBarTemporarily(); }
          else if (e.key === 'm' || e.key === 'M') { toggleMute(); showBarTemporarily(); }
          else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }

        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [fakeFullscreen]);

      const clickState = useRef({ count: 0, timer: null });
      const onStageClick = (e) => {
        if (e.target.closest && e.target.closest('.yt-controls-bottom')) return;
        const rect = wrapRef.current.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width;
        clickState.current.count += 1;
        if (clickState.current.timer) clearTimeout(clickState.current.timer);
        clickState.current.timer = setTimeout(() => {
          if (clickState.current.count === 1) { setBarVisible(v => !v); if (!barVisible) showBarTemporarily(); }
          clickState.current.count = 0;
        }, 260);
        if (clickState.current.count === 2) {
          clickState.current.count = 0;
          if (clickState.current.timer) clearTimeout(clickState.current.timer);

              <span className="w-16 h-16 rounded-full bg-accent-red/90 flex items-center justify-center shadow-[0_0_25px_rgba(255,51,75,0.6)]">
                <Icon name="play" className="w-7 h-7 text-white fill-current translate-x-0.5" />
              </span>
            </button>

                onChange={e => seekTo(e.target.value)} className="yt-progress w-full mb-1.5" style={{
                  background: `linear-gradient(to left, #00F0FF ${(ctrl.current / (ctrl.duration || 1)) * 100}%, rgba(255,255,255,0.25) ${(ctrl.current / (ctrl.duration || 1)) * 100}%)`
                }} />

                <button type="button" onClick={togglePlay} className="yt-btn yt-btn-main w-8 h-8 shrink-0" title={ctrl.playing ? 'إيقاف مؤقت (مسافة)' : 'تشغيل (مسافة)'}>
                  <Icon name={ctrl.playing ? 'pause' : 'play'} className="w-4 h-4 fill-current" />
                </button>
                <button type="button" onClick={() => skip(-5)} className="yt-btn w-7 h-7 shrink-0" title="رجوع 5 ثواني (السهم الأيسر)">
                  <Icon name="rotateCcw5" className="w-3.5 h-3.5" />
                </button>
                <button type="button" onClick={() => skip(5)} className="yt-btn w-7 h-7 shrink-0" title="تقديم 5 ثواني (السهم الأيمن)">
                  <Icon name="rotateCw5" className="w-3.5 h-3.5" />
                </button>

                <div className="hidden sm:flex items-center gap-1.5 group/vol shrink-0">
                  <button type="button" onClick={toggleMute} className="yt-btn w-7 h-7" title="كتم/تشغيل الصوت (M)">
                    <Icon name={ctrl.muted || ctrl.volume === 0 ? 'volumeX' : 'volume2'} className="w-3.5 h-3.5" />
                  </button>
                  <input type="range" min="0" max="1" step="0.05" value={ctrl.muted ? 0 : ctrl.volume}
                    onChange={e => setVolume(e.target.value)} className="yt-vol w-14 md:w-16" />
                </div>
                <button type="button" onClick={toggleMute} className="yt-btn w-7 h-7 shrink-0 sm:hidden" title="كتم/تشغيل الصوت">
                  <Icon name={ctrl.muted || ctrl.volume === 0 ? 'volumeX' : 'volume2'} className="w-3.5 h-3.5" />
                </button>

                <span className="text-[10px] font-mono text-white/90 shrink-0 mr-0.5">{formatClock(ctrl.current)} / {formatClock(ctrl.duration)}</span>

                <span className="flex-1"></span>

                <div className="relative shrink-0">
                  <button type="button" onClick={() => setShowSpeedMenu(v => !v)} className="yt-btn h-7 px-2 gap-1 text-[11px] font-bold" title="سرعة التشغيل">
                    <Icon name="gauge" className="w-3.5 h-3.5" /><span className="hidden xs:inline">{ctrl.rate}×</span>
                  </button>
                  {showSpeedMenu && (
                    <div className="absolute bottom-10 left-0 bg-black/90 backdrop-blur-md rounded-xl border border-white/10 p-1.5 flex flex-col gap-0.5 shadow-2xl min-w-[64px] z-30">
                      {RATE_OPTIONS.map(r => (
                        <button key={r} type="button" onClick={() => setRate(r)}
                          className={`text-[11px] font-bold px-3 py-1.5 rounded-lg transition ${ctrl.rate === r ? 'bg-accent-cyan text-glass-950' : 'text-white hover:bg-white/10'}`}>{r}×</button>
                      ))}
                    </div>
                  )}
                </div>

                <button type="button" onClick={toggleFullscreen} title={effectiveFs ? 'إنهاء ملء الشاشة (F)' : 'ملء الشاشة (F)'} className="yt-btn w-7 h-7 shrink-0">
                  <Icon name={effectiveFs ? 'minimize' : 'maximize'} className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TitleModal({ title, allTitles, currentUser, liked, onLike, onClose, onOpenAuth, getRole, onOpenProfile, onOpen, watched, onMarkEpisodeWatched, onMarkMovieWatched, isEpisodeWatched }) {
      const [closing, requestClose] = useClosable(onClose);
      const [playingUrl, setPlayingUrl] = useState(null);
      const [playingMeta, setPlayingMeta] = useState({});
      const [playingLabel, setPlayingLabel] = useState('');
      const [playingSeasonNumber, setPlayingSeasonNumber] = useState(null);
      const [activeSeason, setActiveSeason] = useState(0);
      const [seasonView, setSeasonView] = useState(false);
      const [showAllEpisodes, setShowAllEpisodes] = useState(false);
      const [commentText, setCommentText] = useState('');
      const [comments, setComments] = useState([]);
      const [replyingTo, setReplyingTo] = useState(null);
      const [replyText, setReplyText] = useState('');
      const [videoError, setVideoError] = useState(false);
      const [copied, setCopied] = useState(false);

      const [ratings, setRatings] = useState({});
      const [myStars, setMyStars] = useState(0);
      const [reviewReplyingTo, setReviewReplyingTo] = useState(null);
      const [reviewReplyText, setReviewReplyText] = useState('');
      const [myFollowingSet, setMyFollowingSet] = useState({});
      const [showAddToList, setShowAddToList] = useState(false);

      useEffect(() => {
        if (!currentUser) { setMyFollowingSet({}); return; }
        const ref = db.ref(`following/${sanitizeKey(currentUser.username)}`);
        const cb = snap => setMyFollowingSet(snap.val() || {});
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser && currentUser.username]);
      const [myReview, setMyReview] = useState('');
      const [savingRating, setSavingRating] = useState(false);
      const [ratingMsg, setRatingMsg] = useState('');
      const [deleteCommentTarget, setDeleteCommentTarget] = useState(null);
      const [deleteMyRating, setDeleteMyRating] = useState(false);

      useEffect(() => {

        const ref = db.ref(`comments/${title.id}`);
        const cb = snap => {
          const data = snap.val();
          const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          list.sort((a, b) => (a.date || 0) - (b.date || 0));

        ref.on('value', cb);
        return () => ref.off('value', cb);

      useEffect(() => {

        return () => ref.off('value', cb);
      }, [title.id, currentUser && currentUser.id]);

      useEffect(() => {
        try {
          const raw = JSON.parse(localStorage.getItem('cv_continue') || '[]');
          const next = [title.id, ...raw.filter(id => id !== title.id)].slice(0, 12);
          localStorage.setItem('cv_continue', JSON.stringify(next));
        } catch (e) {}
      }, [title.id]);

      const ratingList = Object.keys(ratings).map(uid => ({ uid, ...ratings[uid] })).sort((a, b) => (b.date || 0) - (a.date || 0));
      const followersRatings = ratingList.filter(r => myFollowingSet[sanitizeKey(r.username)]);

      const submitReviewReply = async (ratingUid) => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!reviewReplyText.trim()) return;
        await db.ref(`ratings/${title.id}/${ratingUid}/replies`).push({ author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', text: reviewReplyText.trim(), date: Date.now() });
        const targetRating = ratingList.find(r => r.uid === ratingUid);
        if (targetRating && targetRating.username && targetRating.username !== currentUser.username) {
          pushNotification(targetRating.username, { type: 'reviewReply', fromUsername: currentUser.username, fromName: currentUser.name, fromAvatar: currentUser.avatar || '', titleId: title.id, titleName: title.name, text: reviewReplyText.trim().slice(0, 80) });
        }
        setReviewReplyText(''); setReviewReplyingTo(null);
      };
      const avgRating = ratingList.length ? ratingList.reduce((s, r) => s + (r.stars || 0), 0) / ratingList.length : 0;
      const canModerate = currentUser && (() => { const role = getRole ? getRole(currentUser.username) : null; return role === 'admin' || role === 'moderator'; })();

      const submitRating = async () => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!myStars) { setRatingMsg('الرجاء اختيار عدد النجوم أولًا.'); return; }
        setSavingRating(true); setRatingMsg('');
        const payload = { stars: myStars, review: myReview.trim(), author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', date: Date.now() };
        try {
          await db.ref(`ratings/${title.id}/${currentUser.id}`).set(payload);
          await db.ref(`userRatings/${currentUser.id}/${title.id}`).set({ stars: myStars, review: myReview.trim(), date: Date.now() });
          setRatingMsg('تم حفظ تقييمك بنجاح.');
        } catch (e) { setRatingMsg('تعذر حفظ التقييم.'); }
        setSavingRating(false);
        setTimeout(() => setRatingMsg(''), 3000);
      };

      const removeMyRating = async () => {
        if (!currentUser) return;
        await db.ref(`ratings/${title.id}/${currentUser.id}`).remove();
        await db.ref(`userRatings/${currentUser.id}/${title.id}`).remove();
        setMyStars(0); setMyReview(''); setDeleteMyRating(false);
      };

      const roleRank = (username) => {
        const role = getRole ? getRole(username) : null;
        return role === 'admin' ? 2 : role === 'moderator' ? 1 : 0;
      };

      const seasons = (title.seasons || [])
        .map(s => ({ ...s, episodes: (s.episodes || []).slice().sort((a, b) => (a.number || 0) - (b.number || 0)) }))
        .sort((a, b) => (a.number || 0) - (b.number || 0));
      const isSeries = title.type !== 'movie';

      const allEpisodesFlat = React.useMemo(() => {
        const flat = [];
        seasons.forEach(s => { (s.episodes || []).forEach(ep => flat.push({ ...ep, seasonNumber: s.number, episodeThumbnail: s.episodeThumbnail })); });
        return flat;
      }, [title.id, JSON.stringify(seasons.map(s => ({ n: s.number, c: (s.episodes || []).length })))]);

      const firstEpisode = () => {
        for (const s of seasons) { if (s.episodes && s.episodes.length) return { ep: s.episodes[0], seasonNumber: s.number }; }
        return null;
      };

      const handlePlay = () => {
        setVideoError(false);
        if (title.type === 'movie') { setPlayingUrl(title.videoUrl || null); setPlayingMeta(title); setPlayingLabel(title.name); }
        else {
          const found = firstEpisode();
          const ep = found ? found.ep : null;
          setPlayingUrl(ep ? ep.videoUrl : null); setPlayingMeta(ep || {}); setPlayingSeasonNumber(found ? found.seasonNumber : null);
          setPlayingLabel(ep ? `${title.name} · ${ep.title || `الحلقة ${ep.number || 1}`}` : title.name);
        }
      };

      const playEpisode = (ep, seasonNumber) => {
        setVideoError(false);
        setPlayingUrl(ep.videoUrl);
        setPlayingMeta(ep);
        setPlayingSeasonNumber(seasonNumber != null ? seasonNumber : null);
        setPlayingLabel(`${title.name} · ${ep.title || `الحلقة ${ep.number != null ? ep.number : ''}`}`);
      };
      const openSeason = (i) => { setActiveSeason(i); setSeasonView(true); setShowAllEpisodes(false); };
      const openAllEpisodes = () => { setShowAllEpisodes(true); setSeasonView(false); };

      const playNextEpisode = () => {
        const season = seasons[activeSeason];
        if (!season) return;
        const idx = season.episodes.findIndex(e => e.videoUrl === playingMeta.videoUrl && e.number === playingMeta.number);
        if (idx > -1 && idx < season.episodes.length - 1) playEpisode(season.episodes[idx + 1], season.number);
      };

      const shareLink = () => {
        const url = `${location.origin}${location.pathname}?t=${title.id}`;
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2200); });
        history.replaceState(null, '', `?t=${title.id}`);
      };

      const submitComment = async () => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!commentText.trim()) return;
        await db.ref(`comments/${title.id}`).push({ author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', text: commentText.trim(), date: Date.now(), likes: 0 });
        setCommentText('');
      };

      const submitReply = async (commentId) => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!replyText.trim()) return;
        const mentionName = (replyingTo && replyingTo.mentionName) ? replyingTo.mentionName : null;
        await db.ref(`comments/${title.id}/${commentId}/replies`).push({ author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', mentionName, text: replyText.trim(), date: Date.now() });
        const parentComment = comments.find(c => c.id === commentId);
        if (parentComment && parentComment.username && parentComment.username !== currentUser.username) {
          pushNotification(parentComment.username, { type: 'reply', fromUsername: currentUser.username, fromName: currentUser.name, fromAvatar: currentUser.avatar || '', titleId: title.id, titleName: title.name, text: replyText.trim().slice(0, 80) });
        }
        setReplyText(''); setReplyingTo(null);
      };

      const toggleCommentLike = (commentId, comment) => {
        if (!currentUser) { onOpenAuth('login'); return; }
        const userKey = sanitizeKey(currentUser.username);
        const likedBy = comment.likedBy || {};
        const isLiked = !!likedBy[userKey];
        db.ref(`comments/${title.id}/${commentId}/likedBy/${userKey}`).set(isLiked ? null : true);
        db.ref(`comments/${title.id}/${commentId}/likes`).transaction(v => Math.max(0, (v || 0) + (isLiked ? -1 : 1)));
      };

      const canDeleteComment = (c) => canModerate || (currentUser && currentUser.username === c.username);
      const deleteComment = (commentId) => db.ref(`comments/${title.id}/${commentId}`).remove();
      const deleteReply = (commentId, replyId) => db.ref(`comments/${title.id}/${commentId}/replies/${replyId}`).remove();

      const similarTitles = (allTitles || []).filter(t => t.id !== title.id && t.status === 'published' && (t.genres || []).some(g => (title.genres || []).includes(g))).slice(0, 8);

      const movieWatched = title.type === 'movie' && watched && watched[title.id] && watched[title.id].movie;

      const handleEpisodeComplete = () => {
        if (title.type === 'movie') return;
        onMarkEpisodeWatched && onMarkEpisodeWatched(title.id, playingSeasonNumber, playingMeta.number);
      };
      const handleMovieComplete = () => { onMarkMovieWatched && onMarkMovieWatched(title.id); };

      return (
        <div className={`${closing ? 'modal-backdrop-out' : 'modal-backdrop'} fixed inset-0 z-50 bg-black/90 md:p-6 md:flex md:items-center md:justify-center overflow-y-auto`} onClick={requestClose}>
          <div onClick={e => e.stopPropagation()} className={`${closing ? 'sheet-panel-out' : 'sheet-panel'} glass-panel w-full min-h-screen md:min-h-0 md:max-h-[92vh] md:max-w-3xl md:rounded-3xl overflow-y-auto border border-white/10 shadow-2xl`}>
            <div className="relative">
              {playingUrl ? (
                <div className="relative">
                  {isDirectVideo(playingUrl) ? (
                    <VideoPlayer key={playingUrl} src={normalizeVideoUrl(playingUrl)} onError={() => setVideoError(true)}
                      trimStart={playingMeta.trimStart} trimEnd={playingMeta.trimEnd}
                      fitMobile={playingMeta.fitMobile} fitDesktop={playingMeta.fitDesktop} crop={playingMeta.crop}
                      episodeLabel={playingLabel}
                      onComplete={title.type === 'movie' ? handleMovieComplete : handleEpisodeComplete} />
                  ) : (
                    <iframe key={playingUrl} src={normalizeVideoUrl(playingUrl)} allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowFullScreen
                      referrerPolicy="no-referrer-when-downgrade" className="w-full aspect-video bg-black" />
                  )}
                  {videoError && (
                    <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center gap-3 p-6 text-center">

                        <p className="text-xs text-slate-400 max-w-xs leading-relaxed">غالبًا السبب أن ملف الفيديو غير مرفوع بصيغة يدعمها الآيفون مباشرة. الأعمال التي تُرفع من لوحة التحكم عبر زر "رفع من الجهاز" تعمل بشكل صحيح على كل الأجهزة.</p>
                      )}
                      <button onClick={() => window.open(normalizeVideoUrl(playingUrl), '_blank', 'noopener,noreferrer')} className="px-5 py-2.5 rounded-xl bg-accent-red hover:bg-accent-redHover text-xs font-bold text-white transition">محاولة فتح الرابط مباشرة</button>
                    </div>

                  {title.backdrop && <img src={title.backdrop} alt="" className="w-full h-full object-cover" />}
                  <div className="absolute inset-0 bg-gradient-to-t from-glass-950 via-black/40 to-transparent flex items-center justify-center">
                    <button onClick={handlePlay} className="w-[72px] h-[72px] rounded-3xl bg-accent-red hover:bg-accent-redHover flex items-center justify-center shadow-[0_0_30px_rgba(255,51,75,0.6)] transform hover:scale-110 transition">
                      <Icon name="play" className="w-8 h-8 text-white fill-current translate-x-0.5" />
                    </button>

                </div>

                <span className="text-xs px-3 py-1 rounded-full bg-accent-red text-white font-bold shadow-[0_0_12px_rgba(255,51,75,0.4)]">{TYPE_LABELS[title.type]}</span>
                <span className="text-xs text-slate-300 font-semibold">{title.year}</span>
                <RatingBadges imdb={title.imdbRating} rt={title.rtRating} />
                {ratingList.length > 0 && (
                  <span className="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-md bg-black/60 backdrop-blur-md text-amber-400 font-bold border border-amber-400/20 shadow-sm">
                    <Icon name="star" className="w-3 h-3" />{avgRating.toFixed(1)} ({ratingList.length})
                  </span>
                )}
                {movieWatched && (
                  <span className="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-md bg-emerald-500/15 backdrop-blur-md text-emerald-400 font-bold border border-emerald-500/30 shadow-sm">
                    <Icon name="check" className="w-3 h-3" />تمت المشاهدة
                  </span>
                )}
              </div>
              <h2 className="text-2xl md:text-3xl font-black mb-1 text-white">{title.name}</h2>
              {playingLabel && playingLabel !== title.name && (
                <p className="text-sm text-accent-cyan font-bold mb-3 flex items-center gap-1.5"><Icon name="play" className="w-3.5 h-3.5 fill-current" />{playingLabel.split(' · ').slice(1).join(' · ')}</p>
              )}
              {title.genres && title.genres.length > 0 && (
                <div className="flex gap-2 flex-wrap mb-4 mt-2">
                  {title.genres.map(g => <span key={g} className="text-xs px-3 py-1 rounded-xl glass-card text-slate-300 border border-white/5 font-semibold">{g}</span>)}

              {(title.director || title.writer) && (
                <div className="flex items-center gap-4 flex-wrap mb-6 -mt-3 text-xs text-slate-400 font-semibold">
                  {title.director && <span>الإخراج: <span className="text-slate-200">{title.director}</span></span>}

              <div className="flex items-center gap-3 flex-wrap mb-6">
                <button onClick={handlePlay} className="flex items-center gap-2.5 px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover text-sm font-bold text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition">
                  <Icon name="play" className="w-4 h-4 fill-current" />تشغيل
                </button>
                {isSeries && playingUrl && (
                  <button onClick={playNextEpisode} className="flex items-center gap-2.5 px-5 py-3 rounded-2xl glass-card border border-white/10 hover:border-accent-cyan text-sm font-bold text-slate-200 transition">
                    <Icon name="skipForward" className="w-4 h-4" />الحلقة التالية
                  </button>
                )}
                <button onClick={onLike} className={`flex items-center gap-2.5 px-5 py-3 rounded-2xl text-sm font-bold border transition ${liked ? 'bg-rose-500 text-white border-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.4)]' : 'glass-card border-white/10 text-slate-200 hover:border-white/20'}`}>
                  <Icon name="heart" className="w-4 h-4" />{title.likes || 0}
                </button>
                <button onClick={() => { if (!currentUser) { onOpenAuth('login'); return; } setShowAddToList(true); }} className="flex items-center gap-2.5 px-6 py-3 rounded-2xl glass-card border border-white/10 hover:border-accent-cyan text-sm font-bold text-slate-200 transition">
                  <Icon name="list" className="w-4 h-4 text-accent-cyan" />أضف لقائمتي
                </button>
              </div>
              {showAddToList && <AddToListModal currentUser={currentUser} title={title} onClose={() => setShowAddToList(false)} />}

              {isSeries && seasons.length > 0 && (
                <div className="mt-8 border-t border-white/10 pt-6">

                    {(seasonView || showAllEpisodes) && (

                        className="w-8 h-8 shrink-0 rounded-xl glass-card border border-white/10 hover:border-accent-cyan flex items-center justify-center text-accent-cyan transition">
                        <Icon name="chevronRight" className="w-4 h-4" />
                      </button>
                    )}
                    <Icon name="tv" className="w-5 h-5 text-accent-cyan" />
                    <h3 className="font-black text-lg text-white">
                      {showAllEpisodes ? 'كل الحلقات' : !seasonView ? 'المواسم' : `الموسم ${seasons[activeSeason] ? (seasons[activeSeason].number || activeSeason + 1) : ''}`}
                    </h3>

    function PasswordStrengthMeter({ password }) {
      const checks = React.useMemo(() => {
        const p = password || '';
        return {
          length: p.length >= 6,
          upperLower: /[a-z]/.test(p) && /[A-Z]/.test(p),
          number: /[0-9]/.test(p),
          symbol: /[^A-Za-z0-9]/.test(p),
        };
      }, [password]);
      const score = Object.values(checks).filter(Boolean).length;
      if (!password) return null;
      const levels = [
        { label: 'ضعيفة جدًا', color: 'bg-rose-500', text: 'text-rose-400' },
        { label: 'ضعيفة', color: 'bg-rose-500', text: 'text-rose-400' },
        { label: 'متوسطة', color: 'bg-amber-500', text: 'text-amber-400' },
        { label: 'جيدة', color: 'bg-accent-cyan', text: 'text-accent-cyan' },
        { label: 'قوية جدًا', color: 'bg-emerald-500', text: 'text-emerald-400' },
      ];
      const lvl = levels[Math.min(score, 4)];
      return (
        <div className="mt-2">
          <div className="flex items-center gap-1.5">
            {[0, 1, 2, 3].map(i => (
              <div key={i} className={`h-1.5 flex-1 rounded-full transition-all ${i < score ? lvl.color : 'bg-glass-800'}`}></div>
            ))}
          </div>
          <p className={`text-[11px] font-bold mt-1.5 ${lvl.text}`}>قوة كلمة المرور: {lvl.label}</p>
        </div>
      );
    }

          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" style={{ transition: 'opacity 0.28s ease-out', opacity: crossed ? 0.4 : 1 }} />
          <circle cx="12" cy="12" r="3" style={{ transition: 'opacity 0.28s ease-out, transform 0.28s ease-out', transformOrigin: '12px 12px', opacity: crossed ? 0.4 : 1, transform: crossed ? 'scale(0.55)' : 'scale(1)' }} />

      const [changingPass, setChangingPass] = useState(false);

      if (!currentUser) {
        return (

      const saveName = async () => {
        const trimmed = name.trim();

        setSavingName(false);

      const handleAvatarFile = (e) => {
        const file = e.target.files && e.target.files[0];

        setAvatarMsg({ text: '', ok: false });
        setUploading(true);
        compressImageToDataUrl(file)

          .catch(err => setAvatarMsg({ text: (err && err.message) || 'تعذر حفظ الصورة.', ok: false }))
          .finally(() => setUploading(false));
      };

      useEffect(() => {
        if (!oldPass.trim()) { setOldPassValid(null); return; }
        setOldPassChecking(true);
        const handle = setTimeout(async () => {
          try {

            setOldPassValid(snap.val() === oldPass.trim());

        return () => clearTimeout(handle);
      }, [oldPass, currentUser.id]);

      const newPassIsWeak = newPass && newPass.trim().length < 6;
      const newPassSameAsOld = newPass && oldPass && newPass.trim() === oldPass.trim();
      const passwordsMismatch = confirmPass && newPass !== confirmPass;
      const canSubmitPassword = oldPass.trim() && newPass.trim().length >= 6 && newPass === confirmPass && !newPassSameAsOld && !changingPass;

      const changePassword = async () => {
        setPassMsg({ text: '', ok: false });
        const oldTrim = oldPass.trim(), newTrim = newPass.trim(), confirmTrim = confirmPass.trim();
        if (!oldTrim || !newTrim || !confirmTrim) { setPassMsg({ text: 'الرجاء تعبئة كل الحقول.', ok: false }); return; }
        if (newTrim.length < 6) { setPassMsg({ text: 'كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل.', ok: false }); return; }
        if (newTrim !== confirmTrim) { setPassMsg({ text: 'كلمة المرور الجديدة غير متطابقة مع التأكيد.', ok: false }); return; }
        if (newTrim === oldTrim) { setPassMsg({ text: 'كلمة المرور الجديدة يجب أن تختلف عن الحالية.', ok: false }); return; }
        setChangingPass(true);
        try {
          const snap = await db.ref(`users/${currentUser.id}/password`).once('value');

          if (String(storedPass) !== oldTrim) { setPassMsg({ text: 'كلمة المرور الحالية غير صحيحة.', ok: false }); setChangingPass(false); return; }
          await db.ref(`users/${currentUser.id}`).update({ password: newTrim, passwordChangedAt: Date.now() });

            </div>
            {nameMsg.text && <p className={`text-xs font-bold mt-3 p-2.5 rounded-xl border ${nameMsg.ok ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'}`}>{nameMsg.text}</p>}

  <style>

    @keyframes scaleOutPanel { from { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } to { opacity: 0; transform: scale(0.94) translateY(10px); filter: blur(3px); } }
    @keyframes slideUpSheet { from { opacity: 0; transform: translateY(38px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideDownSheet { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(30px) scale(0.98); } }
    @keyframes fadeInContent { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(12px) scale(0.94); } }
    .toast-item { animation: toastIn 0.32s var(--liquid); }

    @keyframes itemPopOut { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.6) translateY(14px); } }
    .item-sink-in { animation: itemSinkIn 0.34s var(--spring); }

    @keyframes rowPopOut { 0% { opacity: 1; transform: scale(1) translateX(0); max-height: 80px; } 100% { opacity: 0; transform: scale(0.85) translateX(14px); max-height: 0; } }

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const firebaseConfig = {
      databaseURL: "https://mnste-36ca4-default-rtdb.europe-west1.firebasedatabase.app",
      storageBucket: "mnste-36ca4.firebasestorage.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    function uploadFile(file, folder, onProgress) {
      return new Promise((resolve, reject) => {
        const safeName = (file.name || `upload_${Date.now()}.jpg`).replace(/[^a-zA-Z0-9.\-_]/g, '_');
        const path = `${folder}/${Date.now()}_${safeName}`;
        const ref = storage.ref().child(path);
        let finished = false;
        let uploadTimer = setTimeout(() => {
          if (finished) return;
          try { task && task.cancel(); } catch (_) {}
          reject(new Error(`Firebase Storage لم يكمل الرفع خلال 35 ثانية. bucket=${storage.app.options.storageBucket || 'غير محدد'}`));
        }, 35000);
        let task;
        try {
          task = ref.put(file);
          task.on('state_changed',
            snap => {
              if (snap && snap.totalBytes) onProgress && onProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100));
            },
            err => {
              if (finished) return;
              finished = true; clearTimeout(uploadTimer);
              const code = err && err.code ? ` [${err.code}]` : '';
              reject(new Error(`Firebase Storage رفض رفع الملف${code}: ${err && err.message ? err.message : 'خطأ غير معروف'}`));
            },
            async () => {
              if (finished) return;
              clearTimeout(uploadTimer);
              try {
                const url = await Promise.race([
                  ref.getDownloadURL(),
                  new Promise((_, r) => setTimeout(() => r(new Error('تم الرفع، لكن Firebase لم يُرجع رابط التحميل خلال 15 ثانية.')), 15000))
                ]);
                finished = true;
                resolve(url);
              } catch (err) {
                finished = true;
                const code = err && err.code ? ` [${err.code}]` : '';
                reject(new Error(`تم رفع الملف لكن تعذر الحصول على رابط Firebase${code}: ${err && err.message ? err.message : 'خطأ غير معروف'}`));
              }
            }
          );
        } catch (err) {
          finished = true; clearTimeout(uploadTimer);
          reject(new Error(`تعذر بدء رفع Firebase: ${err && err.message ? err.message : err}`));
        }
      });
    }

    function compressImageToDataUrl(file, maxSize = 300, maxBytes = 260000) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) { reject(new Error('ملف غير صالح')); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height) { if (width > maxSize) { height = Math.round(height * (maxSize / width)); width = maxSize; } }
            else { if (height > maxSize) { width = Math.round(width * (maxSize / height)); height = maxSize; } }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            let quality = 0.8;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            while (dataUrl.length > maxBytes && quality > 0.35) { quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality); }
            if (dataUrl.length > maxBytes + 40000) { reject(new Error('الصورة كبيرة جدًا')); return; }
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error('تعذّرت معالجة هذه الصورة'));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error('تعذّرت قراءة الملف'));
        reader.readAsDataURL(file);
      });
    }

    const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const sanitizeKey = (s) => (s || '').replace(/[.#$\/\[\]]/g, '_');

    let toastListeners = [];
    let toastIdCounter = 0;
    function showToast(message, type = 'success') {
      const toast = { id: ++toastIdCounter, message, type };
      toastListeners.forEach(fn => fn(toast));
    }

    function pushNotification(toUsername, data) {
      if (!toUsername) return;
      db.ref(`notifications/${sanitizeKey(toUsername)}`).push({ ...data, date: Date.now(), read: false });
    }
    function stripSubtitleParams(url) {
      if (!url) return url;
      const subtitleKeys = ['sub_url', 'sub_file', 'sub_lang', 'sub_label', 'sub_default', 'ds_lang', 'lang'];
      try {
        const u = new URL(url, window.location.href);
        const isVidPlayer = /(?:vaplayer\.ru|vidapi\.ru|player\.cinadam\.xyz)$/i.test(u.hostname) || /\/embed\/(?:movie|tv)\//i.test(u.pathname);
        if (isVidPlayer) subtitleKeys.forEach(k => u.searchParams.delete(k));
        return u.toString();
      } catch (e) {
        let out = String(url).trim();
        subtitleKeys.forEach(k => {
          out = out.replace(new RegExp('([?&])' + k + '=[^&#]*&?', 'gi'), '$1').replace(/[?&]$/, '');
        });
        return out;
      }
    }

    function normalizeVideoUrl(url) {
      if (!url) return url;
      let clean = String(url).trim();
      clean = clean.replace(/^https?:\/\/(?:www\.)?(?:vaplayer\.ru|vidapi\.ru)(?=\/embed\/)/i, VIDAPI_EMBED_HOST);
      const drive = clean.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (drive) return `https://drive.google.com/file/d/${drive[1]}/preview`;
      const driveOpen = clean.match(/drive\.google\.com\/open\?id=([^&]+)/);
      if (driveOpen) return `https://drive.google.com/file/d/${driveOpen[1]}/preview`;
      const dropbox = clean.match(/^https?:\/\/(www\.)?dropbox\.com\/(.+)$/);
      if (dropbox && !clean.includes('raw=1')) clean = clean.replace('dropbox.com', 'dl.dropboxusercontent.com').split('?')[0];
      return stripSubtitleParams(clean);
    }

    function normalizeVideoSources(value) {
      let arr = [];
      if (Array.isArray(value)) arr = value;
      else if (value && typeof value === 'object') arr = Object.keys(value).map(k => value[k]);
      return arr
        .map((x, i) => {
          const url = normalizeVideoUrl(x && (x.url || x.videoUrl || x.src || ''));
          const label = String((x && (x.label || x.resolution || x.quality)) || (i + 1) + 'p').trim();
          const subtitleUrl = normalizeSubtitleUrl(x && (x.subtitleUrl || x.subtitle_url || x.subtitle || x.subUrl || ''));
          return url ? { label, resolution: label, url, subtitleUrl } : null;
        })
        .filter(Boolean)
        .filter((x, i, a) => a.findIndex(y => y.url === x.url) === i);
    }

    function normalizeTitlePlaybackData(title) {
      if (!title || typeof title !== 'object') return title;
      const clean = { ...title };
      clean.videoUrl = normalizeVideoUrl(clean.videoUrl || '');
      clean.videoSources = normalizeVideoSources(clean.videoSources);
      clean.subtitleUrl = normalizeSubtitleUrl(clean.subtitleUrl || clean.subtitleURL || '');
      clean.subtitleOffset = Number(clean.subtitleOffset) || 0;
      clean.seasons = Array.isArray(clean.seasons) ? clean.seasons.map(season => ({
        ...season,
        episodes: Array.isArray(season.episodes) ? season.episodes.map(ep => ({
          ...ep,
          videoUrl: normalizeVideoUrl(ep.videoUrl || ''),
          videoSources: normalizeVideoSources(ep.videoSources),
          subtitleUrl: normalizeSubtitleUrl(ep.subtitleUrl || ep.subtitleURL || ''),
          subtitleOffset: Number(ep.subtitleOffset) || 0
        })) : []
      })) : [];
      return clean;
    }

    function normalizeSubtitleUrl(url) {
      if (!url) return '';
      const value = String(url).trim();
      if (!value) return '';
      return value;
    }

    function srtToVtt(text) {
      let v = String(text || '').replace(/^\uFEFF/, '').replace(/\r/g, '').trim();
      if (/^WEBVTT(?:\s|$)/i.test(v)) return v;
      v = v.replace(/^(?:\d+\s*\n)?(?=\d{2}:\d{2}:\d{2}[,.]\d{3}\s+-->)/, '');
      v = v.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
      return 'WEBVTT\n\n' + v + '\n';
    }


    function shiftVttTimings(vtt, offsetMs) {
      const ms = Number(offsetMs) || 0;
      if (!ms) return String(vtt || '');
      const clamp = n => Math.max(0, n);
      const toMs = (h, m, sec, milli) => (((Number(h) * 60 + Number(m)) * 60 + Number(sec)) * 1000 + Number(milli));
      const fmt = total => {
        total = clamp(Math.round(total));
        const h = Math.floor(total / 3600000); total %= 3600000;
        const m = Math.floor(total / 60000); total %= 60000;
        const sec = Math.floor(total / 1000); const milli = total % 1000;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(milli).padStart(3,'0')}`;
      };
      return String(vtt || '').split('\n').map(line => line.replace(/(\d{1,2}):(\d{2}):(\d{2})[.,](\d{3})\s+-->\s+(\d{1,2}):(\d{2}):(\d{2})[.,](\d{3})/, (_,h1,m1,s1,ms1,h2,m2,s2,ms2) =>
        `${fmt(toMs(h1,m1,s1,ms1)+ms)} --> ${fmt(toMs(h2,m2,s2,ms2)+ms)}`)).join('\n');
    }

    function isFirebaseStorageUrl(url) {
      const s = String(url || '').trim();
      return /^https:\/\/(?:firebasestorage\.googleapis\.com|storage\.googleapis\.com)\//i.test(s)
        || /^https:\/\/[^/]+\.firebasestorage\.app\//i.test(s);
    }

    // ==== SUBTITLE ENGINE START ====
    const SUB_AD_RE = /opensubtitles|subscene|addic7ed|podnapisi|subdl|yts\.|yify|www\.|https?:\/\/|\.com\b|\.org\b|\.net\b|ترجمة\s*:|ترجمة وتعديل|تعديل التوقيت|اشترك|قناتنا|تليجرام|telegram/i;
    const SUB_TS_RE = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})\s*-->\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})/;

    function decodeSubBuffer(buf) {
      const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
      if (u8.length >= 2 && u8[0] === 0xff && u8[1] === 0xfe) return new TextDecoder('utf-16le').decode(u8.subarray(2));
      if (u8.length >= 2 && u8[0] === 0xfe && u8[1] === 0xff) return new TextDecoder('utf-16be').decode(u8.subarray(2));
      try { return new TextDecoder('utf-8', { fatal: true }).decode(u8).replace(/^\uFEFF/, ''); } catch (e) {}
      try { return new TextDecoder('windows-1256').decode(u8); } catch (e) {}
      return new TextDecoder('utf-8').decode(u8);
    }

    // يحصر كل مجموعة أقواس داخل عزل اتجاهي (عربي RLI أو لاتيني FSI) حتى يبقى القوسين مع محتواهم وما يهربون لأول/آخر السطر
    function wrapParenGroups(l) {
      return l.replace(/\([^()]*\)|\[[^\[\]]*\]/g, g => (/[A-Za-z0-9]/.test(g) ? '\u2068' : '\u2067') + g + '\u2069');
    }

    // يصلح الأقواس المعكوسة: سطر يبدأ بـ ")" قبل أي "(" بنفس العدد => نبدّل كل الأقواس
    function fixParens(l) {
      const pairs = [['(', ')'], ['[', ']'], ['{', '}']];
      let out = l;
      for (const [o, c] of pairs) {
        const nO = l.split(o).length - 1, nC = l.split(c).length - 1;
        if (!nO || nO !== nC) continue;
        let depth = 0, bad = false;
        for (const ch of l) { if (ch === o) depth++; else if (ch === c) { depth--; if (depth < 0) { bad = true; break; } } }
        if (bad) out = Array.from(out).map(ch => ch === o ? c : ch === c ? o : ch).join('');
      }
      return out;
    }

    // يصلح الأسطر المحفوظة بترتيب معكوس: علامة الترقيم بأول السطر بدل آخره (مثل ".مرحبا" أو "؟ماذا")
    function fixLeadPunct(l) {
      const m = l.match(/^([.,!?\u061F\u060C\u061B:\u2026]+)\s*([\s\S]*\S)$/);
      if (!m) return l;
      const lead = m[1], rest = m[2];
      if (!/[\u0600-\u06ff]/.test(rest)) return l;
      if (/[.,!?\u061F\u060C\u061B:\u2026]$/.test(rest)) return l; // السطر أصلًا ينتهي بعلامة
      return rest + Array.from(lead).reverse().join('');
    }

    function parseSubtitleCues(input) {
      const s = String(input || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
      const cues = [];
      const ms = (h, m, sec, f) => ((Number(h) || 0) * 3600 + Number(m) * 60 + Number(sec)) * 1000 + Number(String(f).padEnd(3, '0').slice(0, 3));
      for (const block of s.split(/\n{2,}/)) {
        const lines = block.split('\n');
        const i = lines.findIndex(l => SUB_TS_RE.test(l));
        if (i < 0) continue;
        const m = lines[i].match(SUB_TS_RE);
        const start = ms(m[1], m[2], m[3], m[4]);
        let end = ms(m[5], m[6], m[7], m[8]);
        const text = lines.slice(i + 1).join('\n')
          .replace(/\{\\[^}]*\}/g, '').replace(/<[^>]+>/g, '')
          .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&')
          .split('\n').map(l => { l = l.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').trim(); l = wrapParenGroups(fixParens(fixLeadPunct(l))); return l && /[\u0600-\u06ff]/.test(l) ? '\u200F' + l + '\u200F' : l; }).filter(Boolean).join('\n');
        if (!text) continue;
        if (end <= start) end = start + 1500;
        cues.push({ s: start, e: end, text });
      }
      cues.sort((a, b) => a.s - b.s);
      const isAd = c => SUB_AD_RE.test(c.text);
      for (let k = 0; k < 2 && cues.length > 1 && isAd(cues[0]); k++) cues.shift();
      for (let k = 0; k < 2 && cues.length > 1 && isAd(cues[cues.length - 1]); k++) cues.pop();
      return cues;
    }

    function subArabicRatio(cues) {
      let letters = 0, arabic = 0;
      for (const c of cues) for (const ch of c.text) {
        if (/[A-Za-z\u0600-\u06ff]/.test(ch)) { letters++; if (/[\u0600-\u06ff]/.test(ch)) arabic++; }
      }
      return letters ? arabic / letters : 0;
    }

    function cuesToVttText(cues, shiftMs) {
      const off = Number(shiftMs) || 0;
      const p = (n, l = 2) => String(n).padStart(l, '0');
      const fmt = t => { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600000); t %= 3600000; const m = Math.floor(t / 60000); t %= 60000; return `${p(h)}:${p(m)}:${p(Math.floor(t / 1000))}.${p(t % 1000, 3)}`; };
      return 'WEBVTT\n\n' + cues.map(c => `${fmt(c.s + off)} --> ${fmt(c.e + off)}\n${c.text}`).join('\n\n') + '\n';
    }
    function activeCueText(cues, tMs) {
      let lo = 0, hi = cues.length - 1, idx = -1;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (cues[mid].s <= tMs) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
      if (idx < 0) return '';
      const lines = [];
      for (let i = idx; i >= 0 && i > idx - 6; i--) if (cues[i].e > tMs) lines.unshift(cues[i].text);
      return lines.join('\n');
    }

    function subHash(str) { // cyrb53
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function subStoreKey(meta) {
      const nb = String((meta && meta.cinemanaId) || '').replace(/[^A-Za-z0-9_-]/g, '');
      if (nb) return 'c' + nb;
      const m = meta || {};
      return 't' + subHash([m.title || '', m.type || '', m.season || '', m.episode || ''].join('|').toLowerCase()) + (m.title ? '' : Date.now().toString(36));
    }

    const _subCache = new Map();

    async function subSave(meta, vtt, info = {}) {
      const key = subStoreKey(meta);
      await db.ref('subtitleFiles/' + key).set({
        vtt, source: info.source || 'manual', label: String(info.label || '').slice(0, 120), cues: info.cues || 0,
        bytes: vtt.length, title: String((meta && meta.title) || '').slice(0, 120), updated: Date.now()
      });
      _subCache.delete('fbsub:' + key);
      return 'fbsub:' + key;
    }

    async function subFetchWithTimeout(url, ms) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), ms);
      try { return await fetch(url, { headers: { Accept: 'text/vtt,text/plain,*/*' }, signal: ctl.signal }); }
      finally { clearTimeout(t); }
    }

    async function fetchSubtitleRaw(url) {
      const u = normalizeSubtitleUrl(url);
      if (!u) throw new Error('رابط الترجمة فارغ');
      if (/^fbsub:/i.test(u)) {
        const key = u.slice(6);
        let lastErr = null;
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const snap = await withTimeout(db.ref('subtitleFiles/' + key + '/vtt').once('value'), 15000, 'انتهت مهلة تحميل الترجمة');
            const v = snap.val();
            if (typeof v === 'string' && v.length) return v;
            throw new Error('الترجمة غير موجودة في قاعدة البيانات');
          } catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 500 * (attempt + 1))); }
        }
        throw lastErr || new Error('تعذر تحميل الترجمة');
      }
      const routes = [u];
      try {
        const parsed = new URL(u, window.location.href);
        if (parsed.origin !== window.location.origin) routes.push(`${CINEMANA_PROXY}/sub/fetch?url=${encodeURIComponent(u)}`);
      } catch (e) {}
      let lastErr = null;
      for (const r of routes) {
        try {
          const res = await subFetchWithTimeout(r, 20000);
          if (!res.ok) throw new Error('تعذر جلب ملف الترجمة (رمز ' + res.status + ')');
          return decodeSubBuffer(await res.arrayBuffer());
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('تعذر جلب ملف الترجمة');
    }

    async function loadSubtitleCues(url) {
      const u = normalizeSubtitleUrl(url);
      if (_subCache.has(u)) return _subCache.get(u);
      const cues = parseSubtitleCues(await fetchSubtitleRaw(u));
      if (!cues.length) throw new Error('ملف الترجمة فارغ أو غير صالح');
      if (_subCache.size > 20) _subCache.delete(_subCache.keys().next().value);
      _subCache.set(u, cues);
      return cues;
    }

    async function fetchSubtitleAsVtt(url) { // متوافق مع الاستدعاءات القديمة
      return cuesToVttText(await loadSubtitleCues(url), 0);
    }
    const SUB_PREF_DEFAULTS = { size: 100, color: '#ffffff', bg: 'outline', pos: 6, weight: 700 };
    function readSubPrefs() {
      try { return { ...SUB_PREF_DEFAULTS, ...(JSON.parse(localStorage.getItem('cinadam_sub_prefs') || '{}')) }; }
      catch (e) { return { ...SUB_PREF_DEFAULTS }; }
    }
    function readSubAdj(key) {
      try { return Number(localStorage.getItem('cinadam_subadj_' + subHash(String(key || '')))) || 0; } catch (e) { return 0; }
    }
    function writeSubAdj(key, ms) {
      try {
        const k = 'cinadam_subadj_' + subHash(String(key || ''));
        if (ms) localStorage.setItem(k, String(ms)); else localStorage.removeItem(k);
      } catch (e) {}
    }

    async function persistSubtitleToFirebase(url, folder = 'subtitles') {
      const rawUrl = normalizeSubtitleUrl(url);
      if (!rawUrl) return '';
      if (/^https?:\/\/firebasestorage\.googleapis\.com\//i.test(rawUrl) || /\.firebasestorage\.app\//i.test(rawUrl)) return rawUrl;
      const vtt = await fetchSubtitleAsVtt(rawUrl);
      const file = new File([vtt], `subtitle_${Date.now()}.vtt`, { type: 'text/vtt' });
      return uploadFile(file, folder, null);

    const TYPE_LABELS = { movie: 'فيلم', series: 'مسلسل', anime: 'أنمي' };
    const TYPE_PLURAL = { movie: 'الأفلام', series: 'المسلسلات', anime: 'الأنميات' };
    const COMPLAINT_TYPES = { add: 'طلب إضافة عمل', problem: 'مشكلة في التشغيل أو التحميل', suggestion: 'اقتراح عام' };

    const ORDINAL_ONES_F = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة'];
    const ORDINAL_TEENS_F = ['العاشرة', 'الحادية عشرة', 'الثانية عشرة', 'الثالثة عشرة', 'الرابعة عشرة', 'الخامسة عشرة', 'السادسة عشرة', 'السابعة عشرة', 'الثامنة عشرة', 'التاسعة عشرة'];
    const ORDINAL_TENS_F = ['', '', 'العشرون', 'الثلاثون', 'الأربعون', 'الخمسون', 'الستون', 'السبعون', 'الثمانون', 'التسعون'];

    function arabicOrdinalFeminine(n) {
      n = Number(n) || 0;
      if (n <= 0) return `رقم ${n}`;
      if (n < 10) return ORDINAL_ONES_F[n];
      if (n < 20) return ORDINAL_TEENS_F[n - 10];
      if (n < 100) {
        const tens = Math.floor(n / 10), ones = n % 10;
        return ones === 0 ? ORDINAL_TENS_F[tens] : `${ones === 1 ? 'الحادية' : ORDINAL_ONES_F[ones]} و${ORDINAL_TENS_F[tens]}`;
      }
      if (n === 100) return 'المئة';
      return `رقم ${n}`;
    }

    function episodeAutoLabel(ep) {
      const ord = arabicOrdinalFeminine(ep && ep.number);
      if (ep && ep.finality === 'season') return `الحلقة ${ord} والأخيرة من الموسم`;
      if (ep && ep.finality === 'series') return `الحلقة ${ord} والأخيرة`;
      return `الحلقة ${ord}`;
    }
    function hasArabicChars(str) {
      return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(str || '');
    }
    function BidiText({ children }) {
      const str = children == null ? '' : String(children);
      return <bdi dir={hasArabicChars(str) ? 'rtl' : 'ltr'}>{str}</bdi>;
    }
    function BidiJoined({ text, sep }) {
      const sp = sep || ' · ';
      const parts = String(text == null ? '' : text).split(sp);
      return (
        <>
          {parts.map((part, i) => (
            <React.Fragment key={i}>
              {i > 0 && <bdi dir="rtl">{sp}</bdi>}
              <BidiText>{part}</BidiText>
            </React.Fragment>
          ))}
        </>
      );

    function fmtDateTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' +
             d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

    async function checkAppealNotice(username) {
      if (!username) return null;
      const snap = await db.ref('appeals').orderByChild('username').equalTo(username).once('value');
      const data = snap.val() || {};
      const list = Object.keys(data).map(k => ({ id: k, ...data[k] })).filter(a => a.status !== 'pending' && !a.notifiedSeen);
      if (!list.length) return null;
      list.sort((a, b) => (b.respondedAt || 0) - (a.respondedAt || 0));
      const appeal = list[0];
      await db.ref(`appeals/${appeal.id}/notifiedSeen`).set(true);
      const typeLabel = appeal.type === 'deleted' ? 'محذوف' : 'محظور';
      const restoreLabel = appeal.type === 'deleted' ? 'وتمت استعادته' : 'وتمت إزالة الحظر عنه';
      const message = appeal.status === 'approved'
        ? `تمت الموافقة على طعن حساب (${username}) ${restoreLabel}.`
        : `لم تتم الموافقة على طعن حساب (${username})، وسيبقى ${typeLabel}.`;
      return { message, approved: appeal.status === 'approved' };
    }

    async function submitAppeal(username, type, reason) {
      const pendingSnap = await db.ref('appeals').orderByChild('username').equalTo(username).once('value');
      const data = pendingSnap.val() || {};
      const hasPending = Object.values(data).some(a => a.status === 'pending');
      if (hasPending) return { alreadyPending: true };
      await db.ref('appeals').push({ username, type, reason, status: 'pending', submittedAt: Date.now(), notifiedSeen: false });
      return { alreadyPending: false };
    }

    function isDirectVideo(url) {
      return /\.(mp4|webm|ogg|mov|m3u8)(\?.*)?$/i.test(url || '');
    }
    const VIDAPI_EMBED_HOST = 'https://player.cinadam.xyz';

    async function buildVidApiUrl(kind, rawId, season, episode) {
      const id = (rawId || '').trim();
      if (!id) return '';
      const base = kind === 'movie'
        ? `${VIDAPI_EMBED_HOST}/embed/movie/${id}`
        : `${VIDAPI_EMBED_HOST}/embed/tv/${id}/${Number(season) || 1}/${Number(episode) || 1}`;
      const params = new URLSearchParams();
      params.set('autoplay', '1');
      return `${base}?${params.toString()}`;
    }

    function VidApiHelper({ kind, season, episode, onGenerate, defaultId }) {
      const [id, setId] = useState(defaultId || '');
      useEffect(() => { if (defaultId) setId(defaultId); }, [defaultId]);
      const [generating, setGenerating] = useState(false);
      const generate = async () => {
        setGenerating(true);
        try {
          const url = await buildVidApiUrl(kind, id, season, episode);
          if (url) onGenerate(normalizeVideoUrl(url));
        } finally { setGenerating(false); }
      };
      return (
        <div className="glass-card rounded-2xl p-3.5 border border-accent-cyan/20 mt-3.5">
          <p className="text-[11px] font-bold text-accent-cyan mb-2 flex items-center gap-1.5"><Icon name="sparkles" className="w-3.5 h-3.5" />توليد رابط VidAPI بدون ترجمة خارجية</p>
          <div className="flex items-center gap-2">
            <input value={id} onChange={ev => setId(ev.target.value)} onKeyDown={ev => ev.key === 'Enter' && generate()}
              placeholder="معرف IMDB (مثال: tt1517268) أو TMDB (مثال: 385687)"
              className="flex-1 min-w-0 bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-accent-cyan" />
            <button type="button" onClick={generate} disabled={!id.trim() || generating} className="shrink-0 px-4 py-2 rounded-xl bg-accent-cyan text-glass-950 text-xs font-bold hover:brightness-110 transition disabled:opacity-40">{generating ? 'جاري...' : 'توليد الرابط'}</button>
          </div>

    const CINEMANA_PROXY = (() => {
      const configured = (typeof window !== 'undefined' && (window.CINEMANA_PROXY_URL || window.CINEMANA_PROXY)) ||
        (typeof localStorage !== 'undefined' ? localStorage.getItem('cinemana_proxy_url') : '') ||
        'http://localhost:8787';
      return String(configured || '').trim().replace(/\/+$/, '');
    })();
    const SUBTITLE_PUBLIC_BASE = (() => {
      const configured = (typeof window !== 'undefined' && (window.SUBTITLE_PUBLIC_BASE_URL || window.CINEMANA_SUBTITLE_PUBLIC_BASE)) ||
        (typeof localStorage !== 'undefined' ? localStorage.getItem('subtitle_public_base_url') : '') || '';
      return String(configured || '').trim().replace(/\/+$/, '');
    })();

    async function cinemanaFetch(path) {
      if (!CINEMANA_PROXY) throw new Error('لم يتم ضبط رابط بروكسي سينمانا. استخدم window.CINEMANA_PROXY_URL أو المسار /api/cinemana.');
      let res;
      try { res = await fetch(`${CINEMANA_PROXY}${path}`, { headers: { 'Accept': 'application/json' } }); }
      catch (e) { throw new Error('تعذر الاتصال ببروكسي سينمانا — تحقق من رابط الـWorker وCORS.'); }
      if (!res.ok) throw new Error('خطأ من بروكسي سينمانا (رمز ' + res.status + ')');
      const text = await res.text();
      if (!text) return [];
      try { return JSON.parse(text); } catch (e) { throw new Error('استجابة سينمانا غير صالحة JSON'); }
    }

    function cinemanaApiType(kind) {
      if (kind === 'tv') return 'series';
      if (kind === 'anime') return 'anime';
      return 'movie';
    }

    function cinemanaArray(data, keys = ['results', 'items', 'data', 'list']) {
      if (Array.isArray(data)) return data;
      if (data && typeof data === 'object') {
        for (const key of keys) if (Array.isArray(data[key])) return data[key];
      }
      return [];
    }

    async function cinemanaSearch(title, type) {
      const primary = cinemanaApiType(type);
      const types = type === 'anime' ? ['anime', 'series', 'movie'] : [primary];
      const out = [];
      const seen = new Set();
      let firstHardError = null;
      for (const apiType of types) {
        try {
          const usp = new URLSearchParams({ videoTitle: title, type: apiType });
          const data = await cinemanaFetch(`/search?${usp.toString()}`);
          cinemanaArray(data).forEach(r => {
            const k = String(r && (r.nb || r.id || r._id) || '');
            if (!k || seen.has(k)) return;
            seen.add(k); out.push({ ...r, _cinemanaType: apiType });
          });
        } catch (e) {
          if (!firstHardError) firstHardError = e;
        }
      }
      if (!out.length && firstHardError && type !== 'anime') throw firstHardError;
      return out;
    }

    async function cinemanaEpisodes(id) {
      const data = await cinemanaFetch(`/episodes/${encodeURIComponent(id)}`);
      return cinemanaArray(data, ['episodes', 'results', 'items', 'data', 'list']);
    }

    async function cinemanaVideos(id) {
      const data = await cinemanaFetch(`/videos/${encodeURIComponent(id)}`);
      return cinemanaArray(data, ['videos', 'files', 'results', 'items', 'data', 'list']);
    }

    function cinemanaVideoSources(videos) {
      const out = normalizeVideoSources((videos || []).map(v => ({
        url: v && (v.videoUrl || v.url || v.src),
        label: v && (v.resolution || v.quality || v.label),
        subtitleUrl: v && (v.subtitleUrl || v.subtitle_url || v.subtitle || v.subUrl)
      })));
      out.sort((a, b) => {
        const an = parseInt(String(a.label).match(/\d{3,4}/)?.[0] || '0', 10);
        const bn = parseInt(String(b.label).match(/\d{3,4}/)?.[0] || '0', 10);
        return bn - an;
      });
      return out;
    }

    function cinemanaTitle(item) {
      return String(item && (item.en_title || item.title || item.name || item.ar_title) || '').trim();
    }

    function cinemanaYear(item) {
      return String(item && (item.year || item.releaseYear || item.release_date) || '').slice(0, 4);
    }

    function cinemanaEpisodeSeason(ep) {
      return Number(ep && (ep.season ?? ep.seasonNumber ?? ep.season_num)) || 1;
    }
    function cinemanaEpisodeNumber(ep) {
      return Number(ep && (ep.episodeNummer ?? ep.episode ?? ep.episodeNumber ?? ep.number)) || 0;
    }

    async function tmdbFindBestByTitle(title, currentType, year) {
      const query = String(title || '').trim();
      if (!query) throw new Error('اسم العمل فارغ');
      const mediaOrder = currentType === 'movie' ? ['movie', 'tv'] : ['tv', 'movie'];
      const all = [];
      for (const media of mediaOrder) {
        try {
          const data = await tmdbFetch(`search/${media}`, { query, language: 'en-US', include_adult: 'false', page: 1 });
          (data.results || []).slice(0, 15).forEach(r => all.push({ ...r, _media: media }));
        } catch (e) {}
      }
      if (!all.length) throw new Error('لم يُعثر على العمل في TMDB بالاسم المرسل من سينمانا');
      const qn = normName(query);
      const y = Number(year) || 0;
      const titleOf = r => String(r.title || r.name || r.original_title || r.original_name || '');
      const yearOf = r => Number(String(r.release_date || r.first_air_date || '').slice(0, 4)) || 0;
      all.sort((a, b) => {
        const score = r => {
          const rn = normName(titleOf(r));
          let s = 0;
          if (rn === qn) s += 100;
          else if (rn.includes(qn) || qn.includes(rn)) s += 45;
          const ry = yearOf(r);
          if (y && ry === y) s += 25;
          else if (y && ry) s += Math.max(0, 10 - Math.abs(ry - y));
          s += Math.min(10, Number(r.popularity) || 0) * 0.15;
          if ((currentType === 'movie' && r._media === 'movie') || (currentType !== 'movie' && r._media === 'tv')) s += 12;
          return s;
        };
        return score(b) - score(a);
      });
      return all[0];
    }

    async function importFromTmdbTitle(title, currentType, year, opts) {
      const best = await tmdbFindBestByTitle(title, currentType, year);
      const media = best._media === 'movie' ? 'movie' : 'tv';
      return importFromTmdb(`https://www.themoviedb.org/${media}/${best.id}`, currentType, opts);
    }

    async function enrichTmdbSeasonsWithCinemana(seasons, cinEpisodes, onProgress) {
      const episodeMap = new Map();
      (cinEpisodes || []).forEach(ep => {
        const key = `${cinemanaEpisodeSeason(ep)}x${cinemanaEpisodeNumber(ep)}`;
        if (cinemanaEpisodeNumber(ep)) episodeMap.set(key, ep);
      });
      const tasks = [];
      (seasons || []).forEach((s, si) => (s.episodes || []).forEach((e, ei) => {
        const cinEp = episodeMap.get(`${Number(s.number) || 1}x${Number(e.number) || 1}`);
        if (cinEp && cinEp.nb != null) tasks.push({ si, ei, id: String(cinEp.nb) });
      }));
      const out = (seasons || []).map(s => ({ ...s, episodes: (s.episodes || []).map(e => ({ ...e, videoUrl: normalizeVideoUrl(e.videoUrl || ''), videoSources: normalizeVideoSources(e.videoSources) })) }));
      const chunkSize = 5;
      for (let i = 0; i < tasks.length; i += chunkSize) {
        const chunk = tasks.slice(i, i + chunkSize);
        const results = await Promise.all(chunk.map(async t => {
          try { return { ...t, sources: cinemanaVideoSources(await cinemanaVideos(t.id)) }; }
          catch (e) { return { ...t, sources: [] }; }
        }));
        results.forEach(r => {
          const ep = out[r.si] && out[r.si].episodes && out[r.si].episodes[r.ei];
          if (ep) ep.cinemanaId = String(r.id);
          if (!ep || !r.sources.length) return;
          ep.videoSources = r.sources;
          ep.videoUrl = r.sources[0].url;
          ep.subtitleUrl = r.sources[0].subtitleUrl || ep.subtitleUrl || '';
        });
        if (onProgress) onProgress(`تم ربط ${Math.min(i + chunk.length, tasks.length)} من ${tasks.length} حلقة من سينمانا...`);
      }
      return out;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 20000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } catch (e) {
        if (e && e.name === 'AbortError') throw new Error('انتهت مهلة الاتصال بالسيرفر. تأكد أن server.js يعمل وأن رابط البروكسي صحيح.');
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    async function subdlSearch(params) {
      const usp = new URLSearchParams(params || {});
      usp.set('languages', 'AR');
      usp.set('unpack', '1');
      usp.set('subs_per_page', '30');
      const url = `${CINEMANA_PROXY}/subdl/search?${usp.toString()}`;
      const res = await fetchWithTimeout(url, { headers: { Accept: 'application/json' } }, 20000);
      if (!res.ok) throw new Error('تعذر البحث في SubDL (رمز ' + res.status + ')');
      const data = await res.json();
      return Array.isArray(data && data.subtitles) ? data.subtitles : [];
    }

    async function subdlDownload(url) {
      if (!url) return '';
      const res = await fetchWithTimeout(`${CINEMANA_PROXY}/subdl/file?url=${encodeURIComponent(url)}`, { headers: { Accept: 'text/vtt,text/plain,*/*' } }, 30000);
      if (!res.ok) throw new Error('تعذر تنزيل الترجمة من SubDL (رمز ' + res.status + ')');
      const text = await res.text();
      if (!text || !/WEBVTT/i.test(text)) throw new Error('ملف الترجمة من SubDL غير صالح');
      return text;
    }

    async function withTimeout(promise, timeoutMs, message) {
      let timer;
      try {
        return await Promise.race([
          promise,
          new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), timeoutMs); })
        ]);
      } finally {
        clearTimeout(timer);
      }
    }

    async function subFindFile(file, meta) {
      if (!file) throw new Error('لم يتم اختيار ملف ترجمة.');
      const cues = parseSubtitleCues(decodeSubBuffer(await file.arrayBuffer()));
      if (!cues.length) throw new Error('الملف ليس SRT أو WebVTT صالحًا.');
      if (subArabicRatio(cues) < 0.3) throw new Error('الملف لا يبدو عربيًا — تأكد أنه ملف الترجمة العربية.');
      const url = await subSave(meta, cuesToVttText(cues, 0), { source: 'manual', label: file.name, cues: cues.length });
      return { url, cues: cues.length };
    }
    async function findAndStoreSubtitle({ cinemanaId, sourceId, altSourceIds = [], title, year, season, episode, type, onProgress }) {
      const ids = [sourceId, ...(Array.isArray(altSourceIds) ? altSourceIds : [])].map(x => String(x || '').trim()).filter(Boolean);
      const imdb = ids.find(x => /^tt\d+$/i.test(x)) || '';
      const tmdb = ids.find(x => /^\d+$/.test(x)) || '';
      const isMovie = type === 'movie';
      const usp = new URLSearchParams();
      if (cinemanaId) usp.set('nb', String(cinemanaId));
      if (title) usp.set('title', String(title));
      if (year) usp.set('year', String(year));
      usp.set('type', isMovie ? 'movie' : 'series');
      if (!isMovie) { usp.set('season', String(Number(season) || 1)); usp.set('episode', String(Number(episode) || 1)); }
      if (imdb) usp.set('imdb', imdb);
      if (tmdb) usp.set('tmdb', tmdb);
      if (!cinemanaId && !title && !imdb && !tmdb) throw new Error('لا يوجد عنوان أو معرّف للبحث عن الترجمة.');
      if (onProgress) onProgress('جاري البحث الذكي (سينمانا ثم SubDL)...');
      const res = await fetchWithTimeout(`${CINEMANA_PROXY}/sub/resolve?${usp.toString()}`, { headers: { Accept: 'application/json' } }, 45000);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        const why = (data.tried || []).slice(-3).map(t => `${t.source === 'cinemana' ? 'سينمانا' : 'SubDL'}${t.attempt ? ' (' + t.attempt + ')' : ''}: ${t.reason || ''}`).join(' | ');
        throw new Error((data.error || `فشل البحث (رمز ${res.status})`) + (why ? ' — ' + why : ''));
      }
      const sourceLabel = data.source === 'cinemana' ? 'سينمانا' : 'SubDL';
      if (onProgress) onProgress(`وُجدت ترجمة من ${sourceLabel} (${data.cues} سطر) — جاري الحفظ...`);
      const url = await subSave({ cinemanaId, title, type: isMovie ? 'movie' : 'series', season, episode }, data.vtt, { source: data.source, label: data.label, cues: data.cues });
      return { url, source: data.source, sourceLabel, cues: data.cues, lastEndSec: data.lastEndSec, durationSec: data.durationSec, label: data.label };
    }
    async function findAndStoreSubdlSubtitle(args) { return (await findAndStoreSubtitle(args)).url; } // اسم قديم

    async function prepareSubtitlesForPublish(payload, sourceId, onProgress, altSourceIds = []) {
      const out = JSON.parse(JSON.stringify(payload || {}));
      const type = out.type || 'movie';
      const sid = String(sourceId || out.sourceId || out.imdbId || out.imdb || out.tmdbId || (type !== 'movie' ? guessTvSourceId(out.seasons) : '') || '').trim();
      const ids = [sid, ...(Array.isArray(altSourceIds) ? altSourceIds : []), out.imdbId, out.tmdbId].filter(Boolean);
      let added = 0, skipped = 0, failed = 0;
      const failedItems = [];
      const jobs = [];
      if (type === 'movie') {
        if (out.subtitleUrl) skipped = 1;
        else jobs.push({ label: out.name || 'الفيلم', target: out, args: { cinemanaId: out.cinemanaId, title: out.name, year: out.year, type: 'movie' } });
      } else {
        (Array.isArray(out.seasons) ? out.seasons : []).forEach(se => (se.episodes || []).forEach(ep => {
          const sNum = Number(se.number) || 1, eNum = Number(ep.number) || 1;
          if (ep.subtitleUrl) { skipped++; return; }
          jobs.push({ label: `S${String(sNum).padStart(2, '0')}E${String(eNum).padStart(2, '0')}`, target: ep, args: { cinemanaId: ep.cinemanaId, title: out.name, year: out.year, season: sNum, episode: eNum, type } });
        }));
      }
      const total = jobs.length;
      let done = 0;
      const worker = async () => {
        while (jobs.length) {
          const job = jobs.shift();
          try {
            const r = await findAndStoreSubtitle({ sourceId: sid, altSourceIds: ids, ...job.args });
            job.target.subtitleUrl = r.url;
            added++;

    function SlidingTabs({ items, active, onChange, containerClassName = '', trackClassName = 'bg-accent-red shadow-[0_0_15px_rgba(255,51,75,0.4)]', getButtonClassName }) {
      const containerRef = useRef(null);
      const btnRefs = useRef({});
      const [style, setStyle] = useState(null);

      const measure = () => {
        const btn = btnRefs.current[active];
        const container = containerRef.current;
        if (!btn || !container) return;
        const cRect = container.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.width < 1 || bRect.height < 1) return;
        setStyle(prev => {
          const next = { left: bRect.left - cRect.left, top: bRect.top - cRect.top, width: bRect.width, height: bRect.height };
          if (prev && Math.abs(prev.left - next.left) < 0.5 && Math.abs(prev.top - next.top) < 0.5 && Math.abs(prev.width - next.width) < 0.5 && Math.abs(prev.height - next.height) < 0.5) return prev;
          return next;
        });
      };

      useLayoutEffect(measure, [active, items.map(i => i.key).join(',')]);
      useEffect(() => {
        const raf1 = requestAnimationFrame(() => requestAnimationFrame(measure));
        const t = setTimeout(measure, 360);
        const onResize = () => measure();
        window.addEventListener('resize', onResize);
        const ro = typeof ResizeObserver !== 'undefined' && containerRef.current ? new ResizeObserver(onResize) : null;
        if (ro && containerRef.current) ro.observe(containerRef.current);
        return () => { cancelAnimationFrame(raf1); clearTimeout(t); window.removeEventListener('resize', onResize); if (ro) ro.disconnect(); };
      }, [active]);

      return (
        <div ref={containerRef} className={`relative ${containerClassName}`}>
          {style && (
            <div className={`absolute rounded-xl pointer-events-none ${trackClassName}`}
              style={{ left: style.left, top: style.top, width: style.width, height: style.height, transition: 'left 0.45s var(--liquid, var(--spring)), top 0.45s var(--liquid, var(--spring)), width 0.45s var(--liquid, var(--spring)), height 0.45s var(--liquid, var(--spring))' }} />
          )}
          {items.map(it => {
            const isActive = active === it.key;
            return (
              <button key={it.key} ref={el => { if (el) btnRefs.current[it.key] = el; }} onClick={() => onChange(it.key)}
                className={`relative z-10 ${getButtonClassName ? getButtonClassName(isActive) : ''}`}>
                {it.render ? it.render(isActive) : it.label}
              </button>
            );
          })}
        </div>
      );
    }

    function StarRatingInput({ value, onChange, size = "w-7 h-7" }) {
      const [hover, setHover] = useState(0);
      const display = hover || value || 0;

      const handleMove = (e, n) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const frac = (e.clientX - rect.left) / rect.width;
        setHover(frac < 0.5 ? n - 0.5 : n);
      };
      const handleClick = (e, n) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const frac = (e.clientX - rect.left) / rect.width;
        onChange(frac < 0.5 ? n - 0.5 : n);
      };

      return (
        <div className="flex items-center gap-1" dir="ltr">
          {[1, 2, 3, 4, 5].map(n => {
            const frac = Math.max(0, Math.min(1, display - (n - 1)));
            return (
              <button key={n} type="button"
                onMouseMove={e => handleMove(e, n)}
                onClick={e => handleClick(e, n)}
                onMouseLeave={() => setHover(0)}
                className="star-btn">
                <FractionalStar fraction={frac} size={size} />
              </button>
            );

          {display > 0 && <span className="text-xs font-bold text-amber-400 mr-1.5">{display}</span>}

            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== toast.id)), 320);
          }, 3000);
        };
        toastListeners.push(handler);
        return () => { toastListeners = toastListeners.filter(fn => fn !== handler); };
      }, []);

      if (!toasts.length) return null;
      return (
        <div className="fixed z-[100] inset-x-0 bottom-24 md:bottom-8 flex flex-col items-center gap-2.5 px-4 pointer-events-none">

          <div className="relative aspect-[2/3] rounded-xl overflow-hidden glass-card shadow-lg group-hover:scale-[1.02] transition duration-300">
            {title.poster ? (
              <img src={title.poster} alt={title.name} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
            ) : (
              <div className="w-full h-full flex items-center justify-center text-slate-600"><Icon name="film" className="w-8 h-8" /></div>
            )}
            {watched && (
              <span title="تمت المشاهدة" className="absolute bottom-2 left-2 w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center shadow-[0_0_10px_rgba(16,185,129,0.6)]">
                <Icon name="check" className="w-3 h-3 text-white" />
              </span>
            )}
          </div>
          <p className="mt-2 text-sm font-bold text-slate-100 line-clamp-1 group-hover:text-accent-cyan transition"><bdi>{title.name}</bdi></p>
          <p className="text-xs text-slate-400 font-medium">{title.year || ''}</p>
        </button>
      );
    }

    function Row({ label, items, onOpen, watchedMap }) {
      if (!items.length) return null;
      return (
        <section className="mb-10">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-lg md:text-xl font-black text-slate-100 flex items-center gap-2.5">
              <span className="w-1.5 h-5 bg-accent-red rounded-full shadow-[0_0_12px_rgba(255,51,75,0.6)]"></span>{label}
            </h2>
          </div>
          <div className="flex gap-4 overflow-x-auto pb-3 pt-1 snap-x scrollbar-hide">
            {items.map(it => <PosterCard key={it.id} title={it} onOpen={onOpen} compact watched={watchedMap && isTitleWatched(watchedMap, it)} />)}
          </div>
        </section>
      );
    }

    function Hero({ items, onOpen }) {
      const [idx, setIdx] = useState(0);
      const [slide, setSlide] = useState(null);
      const [slideActive, setSlideActive] = useState(false);
      const [dragOffset, setDragOffset] = useState(0);
      const dragRef = useRef({ active: false, startX: 0, pointerId: null, offset: 0 });
      const transitionRef = useRef(null);
      const autoRef = useRef(null);
      const goRef = useRef(null);

      useEffect(() => {
        if (idx >= items.length) setIdx(0);
      }, [items.length, idx]);

      useEffect(() => () => {
        if (transitionRef.current) clearTimeout(transitionRef.current);
        if (autoRef.current) clearTimeout(autoRef.current);
      }, []);

      const finishSlide = () => {
        setSlide(current => {
          if (!current) return null;
          setIdx(current.to);
          return null;
        });
        setSlideActive(false);
        setDragOffset(0);
      };

      const go = (target, direction, fromOffset = 0) => {
        if (items.length < 2 || slide) return false;
        const next = ((target % items.length) + items.length) % items.length;
        if (next === idx) return false;
        const dir = direction || (next === (idx + 1) % items.length ? 'next' : 'prev');
        if (transitionRef.current) clearTimeout(transitionRef.current);
        setDragOffset(fromOffset);
        setSlide({ to: next, direction: dir, fromOffset });
        setSlideActive(false);
        requestAnimationFrame(() => requestAnimationFrame(() => setSlideActive(true)));
        transitionRef.current = setTimeout(finishSlide, 680);
        return true;
      };

      goRef.current = go;

      useEffect(() => {
        if (items.length < 2) return;
        const schedule = () => {
          autoRef.current = setTimeout(() => {
            if (!dragRef.current.active && !slide && goRef.current) goRef.current(idx + 1, 'next');
            schedule();
          }, 5200);
        };
        schedule();
        return () => { if (autoRef.current) clearTimeout(autoRef.current); };
      }, [items.length, idx, slide]);

      if (!items.length) return null;

      const getClientX = e => e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);

      const onPointerDown = e => {
        if (items.length < 2 || slide) return;
        if (e.target.closest && e.target.closest('button,a')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        dragRef.current = { active: true, startX: getClientX(e), pointerId: e.pointerId, offset: 0 };
        setDragOffset(0);
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const onPointerMove = e => {
        if (!dragRef.current.active || slide) return;
        const offset = getClientX(e) - dragRef.current.startX;
        dragRef.current.offset = offset;
        setDragOffset(offset);
      };

      const onPointerUp = e => {
        if (!dragRef.current.active) return;
        const offset = dragRef.current.offset;
        const pointerId = dragRef.current.pointerId;
        dragRef.current.active = false;
        try { e.currentTarget.releasePointerCapture(pointerId); } catch (_) {}
        if (offset < -55) goRef.current(idx + 1, 'next', offset);
        else if (offset > 55) goRef.current(idx - 1, 'prev', offset);
        else setDragOffset(0);
      };

      const onPointerCancel = () => {
        dragRef.current.active = false;
        setDragOffset(0);
      };

      const current = items[idx % items.length];
      const incoming = slide ? items[slide.to % items.length] : null;
      const direction = slide?.direction || (dragOffset < 0 ? 'next' : 'prev');
      const dragging = dragRef.current.active;
      const duration = '680ms cubic-bezier(.22,.61,.36,1)';

      const SlideContent = ({ item }) => (
        <div className="absolute inset-0 overflow-hidden">
          {item.backdrop && <img src={item.backdrop} alt="" draggable="false" className="absolute inset-0 w-full h-full object-cover" />}
          <div className="absolute inset-0 bg-gradient-to-t from-glass-950 via-glass-950/45 to-glass-950/5" />
          <div className="absolute inset-0 bg-gradient-to-r from-glass-950/35 via-transparent to-transparent" />
          <div className="absolute inset-x-0 bottom-0 p-5 pb-16 md:p-12 md:pb-10 max-w-2xl">
            <div className="flex items-center gap-2 mb-2 md:mb-3 flex-wrap">
              <span className="text-[10px] md:text-xs px-2.5 md:px-3 py-1 rounded-full bg-accent-red text-white font-bold shadow-[0_0_15px_rgba(255,51,75,0.4)]">{TYPE_LABELS[item.type]}</span>
              <RatingBadges imdb={item.imdbRating} rt={item.rtRating} />
            </div>
            <h1 className="text-2xl sm:text-3xl md:text-5xl font-black text-white leading-tight mb-2 md:mb-3 drop-shadow-md line-clamp-2"><bdi>{item.name}</bdi></h1>
            {item.description && <p className="hidden md:block text-slate-300 text-sm md:text-base line-clamp-3 mb-5 leading-relaxed font-medium max-w-xl">{item.description}</p>}
            <button type="button" onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); onOpen(item); }} className="flex items-center gap-2 px-5 md:px-6 py-2.5 md:py-3 rounded-xl bg-accent-red hover:bg-accent-redHover font-bold text-white shadow-[0_0_20px_rgba(255,51,75,0.5)] transition transform hover:scale-105 active:scale-95 text-sm md:text-base">
              <Icon name="play" className="w-4 h-4 md:w-5 md:h-5 fill-current" />مشاهدة الآن
            </button>
          </div>
        </div>
      );

      const currentTransform = slide
        ? (slideActive ? (direction === 'next' ? 'translate3d(-100%,0,0)' : 'translate3d(100%,0,0)') : `translate3d(${slide.fromOffset || 0}px,0,0)`)
        : `translate3d(${dragging ? dragOffset : 0}px,0,0)`;
      const incomingTransform = slide
        ? (slideActive ? 'translate3d(0,0,0)' : `translate3d(calc(${direction === 'next' ? '100%' : '-100%'} + ${slide.fromOffset || 0}px),0,0)`)
        : (dragging ? `translate3d(calc(${dragOffset < 0 ? '100%' : '-100%'} + ${dragOffset}px),0,0)` : 'translate3d(100%,0,0)');

      return (
        <section
          className="relative h-[390px] sm:h-[430px] md:h-[72vh] md:min-h-[520px] -mx-4 md:mx-0 mb-8 md:mb-10 md:rounded-3xl overflow-hidden glass-panel border border-white/10 shadow-2xl select-none"
          style={{ touchAction: 'pan-y' }}
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerCancel={onPointerCancel}
          onPointerLeave={e => { if (e.pointerType === 'mouse' && dragRef.current.active) onPointerUp(e); }}
        >
          <div className="absolute inset-0 overflow-hidden">
            <div className="absolute inset-0" style={{ transform: currentTransform, transition: slide ? `transform ${duration}` : 'none', willChange: 'transform' }}>
              <SlideContent item={current} />
            </div>
            {slide && (
              <div className="absolute inset-0" style={{ transform: incomingTransform, transition: `transform ${duration}`, willChange: 'transform' }}>
                <SlideContent item={incoming} />
              </div>
            )}
            {!slide && dragging && (
              <div className="absolute inset-0 pointer-events-none" style={{ transform: incomingTransform, transition: 'none', willChange: 'transform' }}>
                <SlideContent item={dragOffset < 0 ? items[(idx + 1) % items.length] : items[(idx - 1 + items.length) % items.length]} />
              </div>
            )}
          </div>

          {items.length > 1 && (
            <div className="absolute bottom-3 md:bottom-5 left-1/2 -translate-x-1/2 flex items-center gap-1.5 md:gap-2 px-2.5 py-1.5 rounded-full bg-black/60 backdrop-blur-xl border border-white/10 z-30 shadow-lg" onPointerDown={e => e.stopPropagation()}>
              {items.map((_, i) => (
                <button
                  type="button"
                  key={i}
                  aria-label={`انتقل إلى العرض ${i + 1}`}
                  onPointerDown={e => e.stopPropagation()}
                  onClick={e => { e.stopPropagation(); if (!slide) goRef.current(i, i === (idx + 1) % items.length ? 'next' : 'prev'); }}
                  className={`h-1.5 md:h-2 rounded-full transition-all duration-300 ${i === idx ? 'bg-accent-cyan w-5 md:w-6 shadow-[0_0_8px_rgba(0,240,255,0.8)]' : 'bg-white/35 w-1.5 md:w-2 hover:bg-white/60'}`}
                />
              ))}
            </div>
          )}
        </section>
      );
    }

    function HomeView({ items, onOpen, watchedMap }) {
      if (!items.length) return <EmptyState text="لا توجد أعمال منشورة بعد. تابعنا قريبًا!" />;
      const featured = items.filter(t => t.featured === true);
      const latest = [...items].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 12);
      const genreCounts = {};
      items.forEach(t => (t.genres || []).forEach(g => genreCounts[g] = (genreCounts[g] || 0) + 1));
      const topGenres = Object.keys(genreCounts).sort((a, b) => genreCounts[b] - genreCounts[a]).slice(0, 6);
      return (
        <div>
          {featured.length > 0 && <Hero items={featured} onOpen={onOpen} />}
          <Row label="أُضيف حديثًا" items={latest} onOpen={onOpen} watchedMap={watchedMap} />
          <Row label="أفلام" items={items.filter(t => t.type === 'movie').slice(0, 12)} onOpen={onOpen} watchedMap={watchedMap} />
          <Row label="مسلسلات" items={items.filter(t => t.type === 'series').slice(0, 12)} onOpen={onOpen} watchedMap={watchedMap} />
          <Row label="أنمي" items={items.filter(t => t.type === 'anime').slice(0, 12)} onOpen={onOpen} watchedMap={watchedMap} />
          {topGenres.map(g => (
            <Row key={g} label={`تصنيف: ${g}`} items={items.filter(t => (t.genres || []).includes(g)).slice(0, 12)} onOpen={onOpen} watchedMap={watchedMap} />
          ))}
        </div>
      );
    }

    const SORT_OPTIONS = [
      ['newest', 'الأحدث إضافةً'],
      ['imdb', 'الأعلى تقييم TMDB'],
      ['year', 'سنة الإصدار'],
      ['name', 'الاسم (أ-ي)'],
      ['popular', 'الأكثر مشاهدة'],
    ];

    function sortTitles(items, sortKey) {
      const arr = [...items];
      if (sortKey === 'imdb') arr.sort((a, b) => (parseFloat(b.imdbRating) || 0) - (parseFloat(a.imdbRating) || 0));
      else if (sortKey === 'year') arr.sort((a, b) => (b.year || 0) - (a.year || 0));
      else if (sortKey === 'name') arr.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      else if (sortKey === 'popular') arr.sort((a, b) => (b.views || 0) - (a.views || 0));
      else arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      return arr;
    }

    function TypeGrid({ title, items, onOpen, showGenreFilter, emptyText, watchedMap }) {
      const [genre, setGenre] = useState('');
      const [year, setYear] = useState('');
      const [sortKey, setSortKey] = useState('newest');
      const genres = showGenreFilter ? Array.from(new Set(items.flatMap(t => t.genres || []))) : [];
      const years = Array.from(new Set(items.map(t => t.year).filter(Boolean))).sort((a, b) => b - a);
      let filteredByGenre = genre ? items.filter(t => (t.genres || []).includes(genre)) : items;
      if (year) filteredByGenre = filteredByGenre.filter(t => String(t.year) === String(year));
      const filtered = sortTitles(filteredByGenre, sortKey);
      return (
        <div>
          <div className="flex items-center justify-between gap-3 flex-wrap mb-6">
            <h1 className="text-2xl md:text-3xl font-black text-slate-100">{title}</h1>
            {items.length > 0 && (
              <div className="flex items-center gap-2.5 flex-wrap">
                {years.length > 1 && (
                  <div className="relative shrink-0">
                    <select value={year} onChange={e => setYear(e.target.value)}
                      className="appearance-none bg-glass-900 border border-white/10 rounded-xl pl-8 pr-3 py-2.5 text-xs font-bold text-slate-200 outline-none focus:border-accent-cyan transition cursor-pointer">
                      <option value="">كل السنوات</option>
                      {years.map(y => <option key={y} value={y} className="bg-glass-950">{y}</option>)}
                    </select>
                    <Icon name="chevronDown" className="w-3 h-3 text-accent-cyan absolute top-1/2 -translate-y-1/2 left-2.5 pointer-events-none" />
                  </div>
                )}
                <div className="relative shrink-0">
                  <select value={sortKey} onChange={e => setSortKey(e.target.value)}
                    className="appearance-none bg-glass-900 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-xs font-bold text-slate-200 outline-none focus:border-accent-cyan transition cursor-pointer">
                    {SORT_OPTIONS.map(([k, l]) => <option key={k} value={k} className="bg-glass-950">{l}</option>)}
                  </select>
                  <Icon name="filter" className="w-3.5 h-3.5 text-accent-cyan absolute top-1/2 -translate-y-1/2 left-3 pointer-events-none" />
                </div>
              </div>
            )}
          </div>
          {showGenreFilter && genres.length > 0 && (
            <SlidingTabs
              containerClassName="flex gap-1.5 flex-wrap mb-6 bg-glass-900/80 p-1.5 rounded-2xl border border-white/5"
              items={[{ key: '__all__', label: 'الكل' }, ...genres.map(g => ({ key: g, label: g }))]}
              active={genre || '__all__'} onChange={(k) => setGenre(k === '__all__' ? '' : k)}
              trackClassName="bg-accent-cyan shadow-[0_0_15px_rgba(0,240,255,0.4)]"
              getButtonClassName={(isActive) => `text-xs px-4 py-2 rounded-xl font-bold ${isActive ? 'text-glass-950' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
            />
          )}
          {filtered.length === 0 ? (
            <EmptyState text={emptyText || 'لا توجد نتائج.'} />
          ) : (
            <div className="grid grid-cols-2 xs:grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 md:gap-5">
              {filtered.map(t => <PosterCard key={t.id} title={t} onOpen={onOpen} watched={watchedMap && isTitleWatched(watchedMap, t)} />)}
            </div>
          )}
        </div>
      );
    }

    function Header({ currentUser, view, setView, search, setSearch, onOpenAccount, onOpenProfile, onOpenTitleFromNotif }) {
      const [mobileSearchOpen, setMobileSearchOpen] = useState(false);
      const [showUserResults, setShowUserResults] = useState(false);
      const userResults = useUserSearch(search);
      const hasUserResults = showUserResults && search.trim().length > 0 && userResults.length > 0;
      const mobileSearchInputRef = useRef(null);

      useEffect(() => { setMobileSearchOpen(false); }, [view]);

      useEffect(() => {
        if (mobileSearchOpen) {
          const t = setTimeout(() => mobileSearchInputRef.current && mobileSearchInputRef.current.focus(), 60);
          return () => clearTimeout(t);
        }
      }, [mobileSearchOpen]);

      useEffect(() => {
        if (!mobileSearchOpen) return;
        const onDocPress = (e) => {
          if (!e.target.closest('[data-mobile-search-group]')) {
            setMobileSearchOpen(false);
          }
        };
        document.addEventListener('mousedown', onDocPress);
        document.addEventListener('touchstart', onDocPress);
        return () => {
          document.removeEventListener('mousedown', onDocPress);
          document.removeEventListener('touchstart', onDocPress);
        };
      }, [mobileSearchOpen]);

      const selectUser = (u) => {
        setSearch('');
        setShowUserResults(false);
        setMobileSearchOpen(false);
        onOpenProfile(u.username);
      };

      const UserResultsDropdown = () => (
        <div className="absolute z-50 top-full inset-x-0 mt-2 glass-panel border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
          <p className="px-3 pt-2.5 pb-1 text-[11px] font-bold text-slate-500">مستخدمون</p>
          <div className="pb-1.5">
            {userResults.map(u => (
              <button key={u.id} onMouseDown={e => { e.preventDefault(); selectUser(u); }}
                className="w-full flex items-center gap-3 px-3 py-2 hover:bg-white/5 transition text-right">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center font-black text-xs text-glass-950 overflow-hidden shrink-0">
                  {u.avatar ? <img src={u.avatar} alt="" className="w-full h-full object-cover" /> : (u.name || '?').charAt(0)}
                </div>
                <div className="min-w-0">
                  <p className="font-bold text-white text-xs truncate">{u.name}</p>
                  <p className="text-slate-400 text-[11px] truncate">@{u.username}</p>
                </div>
              </button>
            ))}
          </div>
        </div>
      );

      return (
        <header className="sticky top-0 z-40 glass-panel border-b border-white/10 shadow-lg">
          <div className="max-w-7xl mx-auto px-3 md:px-4 py-2.5 md:py-3 flex items-center justify-between gap-3">
            <div className="flex items-center gap-6 min-w-0">
              <button onClick={() => setView('home')} className="flex items-center gap-2 font-black text-lg md:text-xl text-white group shrink-0">
                <span className="w-9 h-9 shrink-0 rounded-xl overflow-hidden group-hover:scale-105 transition"><CinadamLogo className="w-full h-full" /></span>
                <span className="tracking-wide hidden xs:inline">Cina<span className="text-accent-cyan">dam</span></span>
              </button>

              <nav className="hidden md:block">
                <SlidingTabs
                  containerClassName="flex items-center gap-1.5 bg-glass-900/80 p-1 rounded-2xl border border-white/5"
                  items={[['home', 'الرئيسية'], ['movie', 'أفلام'], ['series', 'مسلسلات'], ['anime', 'أنمي'], ['lists', 'قوائمي']].map(([k, l]) => ({ key: k, label: l }))}
                  active={view} onChange={setView}
                  getButtonClassName={(isActive) => `px-4 py-2 rounded-xl text-sm font-semibold ${isActive ? 'text-white' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
                />
              </nav>
            </div>

            <div className="flex items-center gap-2 md:gap-3 shrink-0">
              <div className="relative hidden md:block md:w-72">
                <Icon name="search" className="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3.5 text-slate-400" />
                <input value={search} onChange={e => setSearch(e.target.value)}
                  onFocus={() => setShowUserResults(true)} onBlur={() => setTimeout(() => setShowUserResults(false), 150)}
                  placeholder="ابحث عن فيلم، مسلسل، أنمي أو مستخدم..."
                  className="w-full bg-glass-900 border border-white/10 rounded-2xl py-2.5 pr-10 pl-4 text-sm text-slate-100 outline-none focus:border-accent-cyan focus:ring-1 focus:ring-accent-cyan transition shadow-inner" />
                {hasUserResults && <UserResultsDropdown />}
              </div>

              <div data-mobile-search-group className="md:hidden contents">
                <button onClick={() => setMobileSearchOpen(v => !v)} className="md:hidden w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-slate-200 shrink-0">
                  <Icon name={mobileSearchOpen ? 'x' : 'search'} className="w-[18px] h-[18px]" />
                </button>
              </div>

              {currentUser && <NotificationsBell currentUser={currentUser} onOpenProfile={onOpenProfile} onOpenTitle={onOpenTitleFromNotif} />}

              <button onClick={onOpenAccount} className="w-10 h-10 rounded-2xl glass-card flex items-center justify-center hover:border-accent-cyan transition shrink-0 overflow-hidden">
                {currentUser && currentUser.avatar ? (
                  <img src={currentUser.avatar} alt="" className="w-full h-full object-cover" />
                ) : (
                  <Icon name="user" className={`w-5 h-5 ${currentUser ? 'text-accent-cyan' : 'text-slate-300'}`} />
                )}
              </button>
            </div>
          </div>
          <div data-mobile-search-group className={`mobile-search-morph md:hidden ${mobileSearchOpen ? 'open' : ''}`}>
            <div className="px-3 pb-3 -mt-1">
              <div className="relative">
                <Icon name="search" className="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3.5 text-slate-400" />
                <input ref={mobileSearchInputRef} value={search} onChange={e => setSearch(e.target.value)}
                  onFocus={() => setShowUserResults(true)} onBlur={() => setTimeout(() => setShowUserResults(false), 150)}
                  placeholder="ابحث عن فيلم، مسلسل، أنمي أو مستخدم..."
                  className="w-full bg-glass-900 border border-white/10 rounded-2xl py-2.5 pr-10 pl-4 text-sm text-slate-100 outline-none focus:border-accent-cyan focus:ring-1 focus:ring-accent-cyan transition shadow-inner" />
                {hasUserResults && <UserResultsDropdown />}
              </div>
            </div>
          </div>
        </header>
      );
    }

    function NotificationsBell({ currentUser, onOpenProfile, onOpenTitle }) {
      const [open, setOpen] = useState(false);
      const [items, setItems] = useState([]);

      useEffect(() => {
        const ref = db.ref(`notifications/${sanitizeKey(currentUser.username)}`).limitToLast(50);
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => (b.date || 0) - (a.date || 0));
          setItems(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser.username]);

      const unreadCount = items.filter(n => !n.read).length;

      const openPanel = () => {
        setOpen(o => !o);
        if (!open) {
          items.filter(n => !n.read).forEach(n => db.ref(`notifications/${sanitizeKey(currentUser.username)}/${n.id}/read`).set(true));
        }
      };

      const handleClick = (n) => {
        setOpen(false);

              setHidden(false);
            }
            lastY.current = y;

    function SubtitleOverlay({ videoRef, cues, shiftMs, prefs, lifted }) {
      const [text, setText] = useState('');
      const [boxH, setBoxH] = useState(360);
      const rootRef = useRef(null);
      useEffect(() => {
        let raf = 0, lastT = -1, lastText = '';
        setText('');
        const tick = () => {
          const v = videoRef.current;
          if (v) {
            const t = v.currentTime;
            if (t !== lastT) {
              lastT = t;
              const next = activeCueText(cues, t * 1000 - shiftMs);
              if (next !== lastText) { lastText = next; setText(next); }
            }
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [cues, shiftMs]);
      useEffect(() => {
        const el = rootRef.current;
        if (!el) return;
        setBoxH(el.clientHeight || 360);
        if (!window.ResizeObserver) return;
        const ro = new ResizeObserver(() => setBoxH(el.clientHeight || 360));
        ro.observe(el);
        return () => ro.disconnect();
      }, []);
      const fontPx = Math.max(12, Math.min(72, boxH * 0.046 * ((Number(prefs.size) || 100) / 100)));
      const bgStyle = prefs.bg === 'box' ? { background: 'rgba(0,0,0,0.65)', padding: '0.05em 0.5em', borderRadius: '0.3em' }
        : prefs.bg === 'solid' ? { background: '#000', padding: '0.05em 0.5em', borderRadius: '0.2em' } : {};
      const shadow = prefs.bg === 'outline' ? '0 0 3px #000, 0 0 3px #000, 1px 1px 2px #000, -1px -1px 2px #000, 0 2px 6px rgba(0,0,0,.95)' : 'none';
      return (
        <div ref={rootRef} className="absolute inset-0 pointer-events-none" style={{ zIndex: 15 }}>
          {text && (
            <div style={{ position: 'absolute', left: 0, right: 0, bottom: `calc(${Number(prefs.pos) || 0}% + ${lifted ? 46 : 0}px)`, transition: 'bottom .2s', textAlign: 'center', padding: '0 4%' }}>
              {text.split('\n').map((line, i) => (
                <div key={i}><span dir="rtl" style={{ ...bgStyle, display: 'inline-block', color: prefs.color, fontSize: fontPx + 'px', fontWeight: prefs.weight, lineHeight: 1.5, textShadow: shadow, fontFamily: "'Cairo', sans-serif", direction: 'rtl', unicodeBidi: 'isolate', textAlign: 'center' }}>{line}</span></div>
              ))}
            </div>
          )}
        </div>
      );
    }

    async function fetchIntroSegment(imdbId, seasonNumber, episodeNumber, durationSeconds) {
      const imdb = String(imdbId || '').trim();
      const season = Number(seasonNumber) || 0;
      const episode = Number(episodeNumber) || 0;
      if (!imdb || !season || !episode) return null;
      const cacheKey = `cinadam_intro_${imdb}_${season}_${episode}_${Math.round(Number(durationSeconds) || 0)}`;
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && Number.isFinite(cached.start) && Number.isFinite(cached.end) && cached.end > cached.start) return cached;
      } catch (e) {}

      const duration = Number(durationSeconds) || 0;
      const urls = [
        `https://api.skipdb.tv/api/segments?imdb_id=${encodeURIComponent(imdb)}&season=${season}&episode=${episode}${duration > 0 ? `&duration=${encodeURIComponent(duration)}` : ''}&type=intro`,
        `https://api.introdb.app/segments?imdb_id=${encodeURIComponent(imdb)}&season=${season}&episode=${episode}&segment_type=intro`
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url, { headers: { Accept: 'application/json' } });
          if (!res.ok) continue;
          const data = await res.json();
          const seg = data && data.segments ? data.segments.intro : data && data.intro;
          if (!seg) continue;
          const start = Number(seg.start_ms ?? (Number(seg.start_sec) * 1000) ?? (Number(seg.start) * 1000));
          const end = Number(seg.end_ms ?? (Number(seg.end_sec) * 1000) ?? (Number(seg.end) * 1000));
          if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start || end - start < 5000) continue;
          const out = { start: Math.max(0, start / 1000), end: Math.max(0, end / 1000) };
          try { localStorage.setItem(cacheKey, JSON.stringify(out)); } catch (e) {}
          return out;
        } catch (e) {}
      }
      return null;
    }

    function VideoPlayer({ src, subtitleUrl, subtitleOffset = 0, onError, trimStart, trimEnd, fitMobile, fitDesktop, crop, episodeLabel, onComplete, qualities, onQualityChange, startAt, introImdb, introSeason, introEpisode }) {

      const [subCues, setSubCues] = useState([]);

    }
    const normName = (s) => (s || '').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g, ' ').trim();
    const RECS_CACHE = {};

    function guessTitleSource(title) {
      if (title.type === 'movie') {
        const m = (title.videoUrl || '').match(/embed\/movie\/([^/?#]+)/);
        return m ? { kind: 'movie', id: m[1] } : null;
      }
      const id = guessTvSourceId(title.seasons);
      return id ? { kind: 'tv', id: id } : null;
    }
    async function fetchTmdbRecommendedNames(title) {
      if (RECS_CACHE[title.id]) return RECS_CACHE[title.id];
      const src = guessTitleSource(title);
      if (!src) return [];
      let tmdbId = src.id;
      if (/^tt\d+$/i.test(tmdbId)) {
        const found = await tmdbFetch(`find/${tmdbId.toLowerCase()}`, { external_source: 'imdb_id' });
        const list = src.kind === 'movie' ? found.movie_results : found.tv_results;
        if (!(list || []).length) return [];
        tmdbId = list[0].id;
      }
      const empty = { results: [] };
      const [rec, sim] = await Promise.all([
        tmdbFetch(`${src.kind}/${tmdbId}/recommendations`, { language: 'en-US' }).catch(() => empty),
        tmdbFetch(`${src.kind}/${tmdbId}/similar`, { language: 'en-US' }).catch(() => empty),
      ]);
      const out = [];
      [...(rec.results || []), ...(sim.results || [])].forEach(r => {
        const variants = [r.title, r.name, r.original_title, r.original_name].filter(Boolean).map(normName);
        if (variants.length) out.push(variants);
      });
      RECS_CACHE[title.id] = out;
      return out;
    }

    function computeSimilarTitles(title, all, recs) {
      const others = (all || []).filter(t => t.id !== title.id && t.status === 'published');
      if (!others.length) return [];
      const splitNames = (v) => (v || '').split(/[,،]/).map(x => x.trim().toLowerCase()).filter(Boolean);
      const tokens = (d) => new Set(((d || '').toLowerCase().match(/[a-z0-9\u0600-\u06ff]{4,}/g) || []));
      const N = others.length + 1;
      const useText = N >= 8;
      const df = {}, docs = {};
      if (useText) {
        [title, ...others].forEach(t => { const tk = tokens(t.description); docs[t.id] = tk; tk.forEach(w => { df[w] = (df[w] || 0) + 1; }); });
      }
      const g1 = new Set(title.genres || []);
      const dir1 = splitNames(title.director), wr1 = splitNames(title.writer);
      const firstWord = (n) => { const w = normName(n).split(' ').filter(x => x && x !== 'the'); return w.length && w[0].length >= 4 ? w[0] : ''; };
      const fw1 = firstWord(title.name);
      const rating1 = parseFloat(title.imdbRating) || 0;

      const scored = others.map(t => {
        let score = 0;
        const shared = (t.genres || []).filter(g => g1.has(g)).length;
        if (shared) score += shared * 3 + (shared / Math.max(g1.size, (t.genres || []).length, 1)) * 2;
        if (t.type === title.type) score += title.type === 'anime' ? 3 : 2;
        else if ((t.type === 'anime') !== (title.type === 'anime')) score -= 1;
        if (dir1.length && splitNames(t.director).some(n => dir1.includes(n))) score += 4;
        if (wr1.length && splitNames(t.writer).some(n => wr1.includes(n))) score += 2;
        if (fw1 && firstWord(t.name) === fw1) score += 4;
        const dy = Math.abs((Number(t.year) || 0) - (Number(title.year) || 0));
        if (t.year && title.year) score += dy <= 3 ? 1.5 : dy <= 8 ? 0.75 : 0;
        const r2 = parseFloat(t.imdbRating) || 0;
        if (rating1 && r2) score += Math.abs(rating1 - r2) <= 1 ? 1 : 0;
        score += r2 * 0.1;
        if (useText) {
          let overlap = 0;
          docs[t.id].forEach(w => { if (docs[title.id].has(w) && df[w] <= Math.max(2, N * 0.25)) overlap++; });
          score += Math.min(3, overlap * 0.6);
        }
        const nm = normName(t.name);
        const idx = (recs || []).findIndex(v => v.includes(nm));
        if (idx >= 0) score += Math.max(4, 10 - idx * 0.3);
        return { t, score };
      });
      return scored.filter(x => x.score >= 3).sort((a, b) => b.score - a.score || (b.t.createdAt || 0) - (a.t.createdAt || 0)).slice(0, 8).map(x => x.t);
    }

    function TitleModal({ title, allTitles, currentUser, liked, onLike, onClose, onOpenAuth, getRole, onOpenProfile, onOpen, watched, onMarkEpisodeWatched, onMarkMovieWatched, isEpisodeWatched }) {
      const [closing, requestClose] = useClosable(onClose);

      const [activeSeason, setActiveSeason] = useState(0);
      const [seasonView, setSeasonView] = useState(false);
      const [showAllEpisodes, setShowAllEpisodes] = useState(false);
      const [commentText, setCommentText] = useState('');
      const [comments, setComments] = useState([]);
      const [replyingTo, setReplyingTo] = useState(null);
      const [replyText, setReplyText] = useState('');
      const [videoError, setVideoError] = useState(false);
      const [copied, setCopied] = useState(false);

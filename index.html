                )}
                <button onClick={onToggleWatchlist} className={`flex items-center gap-2.5 px-6 py-3 rounded-2xl text-sm font-bold border transition ${inWatchlist ? 'bg-accent-cyan text-glass-950 border-accent-cyan shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card border-white/10 text-slate-200 hover:border-white/20'}`}>
                  <Icon name="bookmark" className="w-4 h-4" />{inWatchlist ? 'في قائمتي' : 'أضف لقائمتي'}
                </button>
                <button onClick={onLike} className={`flex items-center gap-2.5 px-5 py-3 rounded-2xl text-sm font-bold border transition ${liked ? 'bg-rose-500 text-white border-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.4)]' : 'glass-card border-white/10 text-slate-200 hover:border-white/20'}`}>
                  <Icon name="heart" className="w-4 h-4" />{title.likes || 0}
                </button>
              </div>

              {isSeries && seasons.length > 0 && (
                <div className="mt-8 border-t border-white/10 pt-6">
                  <div className="flex items-center gap-2.5 mb-4">
                    <Icon name="tv" className="w-5 h-5 text-accent-cyan" />
                    <h3 className="font-black text-lg text-white">الحلقات</h3>
                  </div>
                  {seasons.length > 1 && (
                    <div className="flex gap-2 flex-wrap mb-4">
                      {seasons.map((s, i) => (
                        <button key={i} onClick={() => setActiveSeason(i)} className={`text-xs px-4 py-2 rounded-xl font-bold transition ${activeSeason === i ? 'bg-accent-cyan text-glass-950 shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card text-slate-300 border border-white/5'}`}>الموسم {s.number || i + 1}</button>
                      ))}
                    </div>
                  )}
                  <div className="space-y-2.5">
                    {(seasons[activeSeason] && seasons[activeSeason].episodes || []).map((ep, ei) => (
                      <div key={ei} className="flex items-center gap-3 glass-card rounded-2xl p-3.5 border border-white/5 hover:border-white/10 transition">
                        <span className="w-8 h-8 shrink-0 rounded-xl bg-glass-700 flex items-center justify-center text-xs font-black text-accent-cyan">{ep.number != null ? ep.number : ei + 1}</span>
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-bold text-slate-100 truncate mb-1">{ep.title || `الحلقة ${ep.number != null ? ep.number : ei + 1}`}</p>
                          <RatingBadges imdb={ep.imdb} rt={ep.rt} size="xs" />
                        </div>
                        <button onClick={() => playEpisode(ep)} className="w-9 h-9 rounded-xl bg-accent-red hover:bg-accent-redHover flex items-center justify-center shrink-0 shadow-[0_0_10px_rgba(255,51,75,0.4)] transition"><Icon name="play" className="w-4 h-4 text-white fill-current translate-x-0.5" /></button>
                        {ep.downloadUrl && (
                          <a href={ep.downloadUrl} target="_blank" rel="noopener noreferrer" className="w-9 h-9 rounded-xl glass-card hover:bg-white/10 border border-white/10 flex items-center justify-center shrink-0 transition"><Icon name="download" className="w-4 h-4 text-accent-cyan" /></a>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="mt-8 border-t border-white/10 pt-6">
                <h3 className="font-black text-lg text-white flex items-center gap-2 mb-4">
                  <Icon name="star" className="w-5 h-5 text-amber-400" />التقييم والمراجعات ({ratingList.length})
                  {ratingList.length > 0 && <span className="text-sm text-amber-400 font-bold mr-1">· {avgRating.toFixed(1)} / 5</span>}
                </h3>
                {currentUser ? (
                  <div className="glass-card rounded-2xl p-4 border border-white/10 mb-6">
                    <p className="text-xs font-bold text-slate-300 mb-2.5">تقييمك الشخصي لهذا العمل</p>
                    <StarRatingInput value={myStars} onChange={setMyStars} />
                    <textarea value={myReview} onChange={e => setMyReview(e.target.value)} placeholder="اكتب مراجعتك الشخصية (اختياري)..." rows={3}
                      className="w-full mt-3 bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner"></textarea>
                    <div className="flex items-center gap-3 mt-3 flex-wrap">
                      <button onClick={submitRating} disabled={savingRating} className="px-5 py-2.5 rounded-xl bg-accent-cyan hover:brightness-110 text-xs font-bold text-glass-950 shadow-[0_0_15px_rgba(0,240,255,0.4)] transition disabled:opacity-50">{savingRating ? 'جارٍ الحفظ...' : 'حفظ التقييم والمراجعة'}</button>
                      {myStars > 0 && <button onClick={() => setDeleteMyRating(true)} className="px-4 py-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 text-xs font-bold transition">حذف تقييمي</button>}
                      {ratingMsg && <span className="text-xs font-bold text-emerald-400">{ratingMsg}</span>}
                    </div>
                  </div>
                ) : (
                  <button onClick={() => onOpenAuth('login')} className="w-full text-xs font-bold text-slate-300 mb-6 glass-card p-4 rounded-2xl text-center border border-white/10 hover:border-accent-cyan transition">سجّل الدخول لتقييم هذا العمل وكتابة مراجعة</button>
                )}
                {ratingList.filter(r => r.review).length > 0 && (
                  <div className="space-y-3 mb-8">
                    {ratingList.filter(r => r.review).map(r => (
                      <div key={r.uid} className="flex gap-3 items-start">
                        <button onClick={() => onOpenProfile && onOpenProfile(r.username)} className="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-xs font-black text-white shrink-0 shadow-md overflow-hidden">
                          {r.avatar ? <img src={r.avatar} alt="" className="w-full h-full object-cover" /> : (r.author || '?').charAt(0)}
                        </button>
                        <div className="flex-1 glass-card p-4 rounded-2xl border border-white/5">
                          <div className="flex items-center justify-between mb-1.5">
                            <button onClick={() => onOpenProfile && onOpenProfile(r.username)} className="text-xs font-bold text-accent-cyan hover:underline">{r.author}</button>
                            <div className="flex items-center gap-2">
                              <StarRatingDisplay value={r.stars} />
                              {(canModerate || (currentUser && currentUser.username === r.username)) && (
                                <button onClick={() => db.ref(`ratings/${title.id}/${r.uid}`).remove()} title="حذف" className="text-slate-500 hover:text-rose-400 transition"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                              )}
                            </div>
                          </div>
                          <p className="text-sm text-slate-200 leading-relaxed">{r.review}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="mt-8 border-t border-white/10 pt-6">
                <h3 className="font-black text-lg text-white flex items-center gap-2 mb-4"><Icon name="messageCircle" className="w-5 h-5 text-accent-cyan" />التعليقات ({comments.length})</h3>
                {currentUser ? (
                  <div className="flex gap-2.5 mb-6">
                    <input value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => e.key === 'Enter' && submitComment()} placeholder="أضف تعليقًا..." className="flex-1 bg-glass-900 border border-white/10 rounded-2xl px-5 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner" />
                    <button onClick={submitComment} className="px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover text-sm font-bold text-white shadow-[0_0_15px_rgba(255,51,75,0.4)] transition">نشر</button>
                  </div>
                ) : (
                  <button onClick={() => onOpenAuth('login')} className="w-full text-xs font-bold text-slate-300 mb-6 glass-card p-4 rounded-2xl text-center border border-white/10 hover:border-accent-cyan transition">سجّل الدخول لإضافة تعليق أو إعجاب</button>
                )}
                {comments.length === 0 ? (
                  <p className="text-sm text-slate-500 font-medium">لا توجد تعليقات بعد.</p>
                ) : (
                  <div className="space-y-4">
                    {[...comments].sort((a, b) => {
                      const diff = roleRank(b.username) - roleRank(a.username);
                      return diff !== 0 ? diff : (b.date || 0) - (a.date || 0);
                    }).map(c => {
                      const repliesList = c.replies ? Object.keys(c.replies).map(rk => ({ id: rk, ...c.replies[rk] })) : [];
                      const userKey = currentUser ? sanitizeKey(currentUser.username) : '';
                      const isCommentLiked = currentUser && c.likedBy && c.likedBy[userKey];
                      const cRole = roleRank(c.username);
                      return (
                        <div key={c.id} className="flex gap-3 items-start">
                          <button onClick={() => onOpenProfile && onOpenProfile(c.username)} className="w-8 h-8 rounded-xl bg-gradient-to-tr from-accent-red to-purple-600 flex items-center justify-center text-xs font-black text-white shrink-0 shadow-md overflow-hidden">
                            {c.avatar ? <img src={c.avatar} alt="" className="w-full h-full object-cover" /> : (c.author || '?').charAt(0)}
                          </button>
                          <div className="flex-1 glass-card p-4 rounded-2xl border border-white/5">
                            <div className="flex items-center justify-between mb-1">
                              <p className="text-xs font-bold text-accent-cyan flex items-center gap-1.5">
                                <button onClick={() => onOpenProfile && onOpenProfile(c.username)} className="hover:underline">{c.author}</button>
                                {cRole === 2 && <span className="text-[9px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold">مدير النظام</span>}
                                {cRole === 1 && <span className="text-[9px] px-2 py-0.5 rounded-full bg-accent-cyan/20 text-accent-cyan border border-accent-cyan/30 font-bold">مشرف النظام</span>}
                              </p>
                              <span className="text-slate-500 text-[10px] font-mono">{fmtDateTime(c.date)}</span>
                            </div>
                            <p className="text-sm text-slate-200 leading-relaxed">{c.text}</p>
                            <div className="flex items-center gap-5 mt-3">
                              <button onClick={() => toggleCommentLike(c.id, c)} className={`flex items-center gap-1.5 text-xs font-bold transition ${isCommentLiked ? 'text-rose-400' : 'text-slate-400 hover:text-slate-200'}`}><Icon name="heart" className="w-3.5 h-3.5" />{c.likes || 0}</button>
                              <button onClick={() => setReplyingTo(replyingTo && replyingTo.commentId === c.id && !replyingTo.mentionName ? null : { commentId: c.id, mentionName: null })} className="text-xs font-bold text-slate-400 hover:text-slate-200 transition">رد</button>
                              {canDeleteComment(c) && <button onClick={() => setDeleteCommentTarget({ id: c.id })} className="text-xs font-bold text-rose-400/80 hover:text-rose-400 transition mr-auto">حذف</button>}
                            </div>
                            {repliesList.length > 0 && (
                              <div className="mt-3 space-y-2 border-r-2 border-accent-cyan/30 pr-3 mr-1">
                                {repliesList.map(r => {
                                  const rRole = roleRank(r.username);
                                  const canDelReply = canModerate || (currentUser && currentUser.username === r.username);
                                  return (
                                  <div key={r.id} className="flex gap-2 items-start">
                                    <button onClick={() => onOpenProfile && onOpenProfile(r.username)} className="w-6 h-6 rounded-lg bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center text-[10px] font-black text-glass-950 shrink-0 overflow-hidden">
                                      {r.avatar ? <img src={r.avatar} alt="" className="w-full h-full object-cover" /> : (r.author || '?').charAt(0)}
                                    </button>
                                    <div className="flex-1 text-xs glass-panel p-3 rounded-xl border border-white/5">
                                      <div className="flex justify-between mb-1">
                                        <span className="font-bold text-accent-cyan flex items-center gap-1.5">
                                          {r.author}
                                          {rRole === 2 && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold">مدير النظام</span>}
                                          {rRole === 1 && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-accent-cyan/20 text-accent-cyan border border-accent-cyan/30 font-bold">مشرف النظام</span>}
                                        </span>
                                        <span className="text-[10px] text-slate-500 font-mono">{fmtDateTime(r.date)}</span>
                                      </div>
                                      <p className="text-slate-300">{r.mentionName && <span className="text-accent-cyan font-bold">@{r.mentionName}</span>} {r.text}</p>
                                      <div className="flex items-center gap-4 mt-1.5">
                                        <button onClick={() => setReplyingTo({ commentId: c.id, mentionName: r.author })} className="text-[11px] font-bold text-slate-500 hover:text-slate-300 transition">رد</button>
                                        {canDelReply && <button onClick={() => setDeleteCommentTarget({ id: c.id, replyId: r.id })} className="text-[11px] font-bold text-rose-400/80 hover:text-rose-400 transition">حذف</button>}
                                      </div>
                                    </div>
                                  </div>
                                  );
                                })}
                              </div>
                            )}
                            {replyingTo && replyingTo.commentId === c.id && (
                              <div className="mt-3">
                                {replyingTo.mentionName && (
                                  <div className="flex items-center gap-1.5 mb-1.5 text-[11px] text-slate-400 font-semibold">
                                    <span>الرد على <span className="text-accent-cyan">@{replyingTo.mentionName}</span></span>
                                    <button onClick={() => setReplyingTo({ commentId: c.id, mentionName: null })} className="text-slate-500 hover:text-rose-400 transition"><Icon name="x" className="w-3 h-3" /></button>
                                  </div>
                                )}
                                <div className="flex gap-2">
                                  <input value={replyText} onChange={e => setReplyText(e.target.value)} onKeyDown={e => e.key === 'Enter' && submitReply(c.id)} placeholder="اكتب ردك..." autoFocus className="flex-1 bg-glass-950 border border-white/10 rounded-xl px-4 py-2 text-xs text-slate-100 outline-none focus:border-accent-cyan" />
                                  <button onClick={() => submitReply(c.id)} className="px-4 py-2 rounded-xl bg-accent-red text-xs font-bold text-white">نشر</button>
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {similarTitles.length > 0 && onOpen && (
                <div className="mt-8 border-t border-white/10 pt-6">
                  <h3 className="font-black text-lg text-white flex items-center gap-2 mb-4"><Icon name="sparkles" className="w-5 h-5 text-accent-cyan" />أعمال مشابهة قد تعجبك</h3>
                  <div className="flex gap-4 overflow-x-auto pb-1 snap-x scrollbar-hide">
                    {similarTitles.map(t => <PosterCard key={t.id} title={t} onOpen={onOpen} compact />)}
                  </div>
                </div>
              )}
            </div>
          </div>

          {deleteCommentTarget && (
            <ConfirmDialog title="حذف هذا العنصر؟" body="لا يمكن التراجع عن هذا الإجراء." confirmLabel="نعم، احذف" cancelLabel="إلغاء"
              onCancel={() => setDeleteCommentTarget(null)}
              onConfirm={() => {
                if (deleteCommentTarget.replyId) deleteReply(deleteCommentTarget.id, deleteCommentTarget.replyId);
                else deleteComment(deleteCommentTarget.id);
                setDeleteCommentTarget(null);
              }} />
          )}
          {deleteMyRating && (
            <ConfirmDialog title="حذف تقييمك؟" body="سيتم حذف نجومك ومراجعتك لهذا العمل نهائيًا." confirmLabel="نعم، احذف" cancelLabel="إلغاء"
              onCancel={() => setDeleteMyRating(false)} onConfirm={removeMyRating} />
          )}
        </div>
      );
    }

    function RequestsView({ currentUser, onOpenAuth }) {
      const [type, setType] = useState('add');
      const [titleName, setTitleName] = useState('');
      const [message, setMessage] = useState('');
      const [sent, setSent] = useState(false);
      const [mine, setMine] = useState([]);

      useEffect(() => {
        if (!currentUser) return;
        const ref = db.ref('complaints');
        const cb = snap => {
          const data = snap.val();
          const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          setMine(list.filter(c => c.username === currentUser.username).sort((a, b) => b.date - a.date));
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser && currentUser.username]);

      if (!currentUser) {
        return (
          <div className="py-20 text-center">
            <div className="w-16 h-16 mx-auto mb-4 rounded-2xl glass-card flex items-center justify-center border border-white/5 text-slate-400">
              <Icon name="flag" className="w-8 h-8" />
            </div>
            <p className="text-slate-300 font-medium mb-4">سجّل الدخول لإرسال طلب أو شكوى ومتابعتها.</p>
            <button onClick={() => onOpenAuth('login')} className="px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition">تسجيل الدخول</button>
          </div>
        );
      }

      const submit = async () => {
        if (!message.trim()) return;
        await db.ref('complaints').push({ username: currentUser.username, name: currentUser.name, type, titleName: titleName.trim(), message: message.trim(), status: 'open', date: Date.now() });
        setMessage(''); setTitleName(''); setSent(true);
        setTimeout(() => setSent(false), 4000);
      };

      return (
        <div>
          <h1 className="text-2xl md:text-3xl font-black mb-6 text-slate-100">طلباتي وشكاواي</h1>
          <div className="glass-panel rounded-3xl p-5 md:p-7 mb-8 border border-white/10 shadow-xl">
            <div className="flex gap-2.5 flex-wrap mb-4">
              {Object.entries(COMPLAINT_TYPES).map(([k, l]) => (
                <button key={k} onClick={() => setType(k)} className={`text-xs px-4 py-2 rounded-xl font-bold transition ${type === k ? 'bg-accent-cyan text-glass-950 shadow-[0_0_15px_rgba(0,240,255,0.4)]' : 'glass-card text-slate-300 border border-white/5'}`}>{l}</button>
              ))}
            </div>
            <input value={titleName} onChange={e => setTitleName(e.target.value)} placeholder="اسم العمل (اختياري)" className="w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan mb-3 transition shadow-inner" />
            <textarea value={message} onChange={e => setMessage(e.target.value)} placeholder="اكتب تفاصيل طلبك أو مشكلتك..." rows={4} className="w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan mb-4 transition shadow-inner"></textarea>
            <button onClick={submit} className="px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition">إرسال الطلب</button>
            {sent && <p className="text-emerald-400 text-xs font-bold mt-3 bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20">تم إرسال طلبك بنجاح، سيتم مراجعته من الإدارة قريبًا.</p>}
          </div>

          <h2 className="font-black text-lg text-white mb-4">طلباتك السابقة</h2>
          {mine.length === 0 ? <p className="text-sm text-slate-500 font-medium">لا توجد طلبات سابقة.</p> : (
            <div className="space-y-3">
              {mine.map(c => (
                <div key={c.id} className="glass-card rounded-2xl p-4 border border-white/10">
                  <div className="flex items-start justify-between gap-4">
                    <div className="min-w-0">
                      <p className="text-xs text-accent-cyan font-bold mb-1.5">{COMPLAINT_TYPES[c.type] || c.type}{c.titleName ? ` · ${c.titleName}` : ''}</p>
                      <p className="text-sm text-slate-200 leading-relaxed">{c.message}</p>
                      <p className="text-[10px] text-slate-500 font-mono mt-2">{fmtDateTime(c.date)}</p>
                    </div>
                    <span className={`text-[11px] px-3 py-1 rounded-full font-bold shrink-0 ${c.status === 'resolved' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>{c.status === 'resolved' ? 'تم الحل' : 'قيد المراجعة'}</span>
                  </div>
                  {c.reply && (
                    <div className="mt-3 pt-3 border-t border-white/10 flex gap-2.5">
                      <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center shrink-0"><Icon name="shield" className="w-3.5 h-3.5 text-glass-950" /></div>
                      <div className="flex-1 min-w-0">
                        <p className="text-[11px] font-bold text-accent-cyan mb-1">رد الإدارة{c.replyBy ? ` · ${c.replyBy}` : ''}</p>
                        <p className="text-sm text-slate-200 leading-relaxed">{c.reply}</p>
                        <p className="text-[10px] text-slate-500 font-mono mt-1">{fmtDateTime(c.replyDate)}</p>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // صفحة الإعدادات: تغيير الاسم، الصورة، وكلمة المرور (المكان الوحيد لتعديل الملف الشخصي)
    function SettingsView({ currentUser, onUpdateName, onUpdateAvatar, onOpenAuth }) {
      const [name, setName] = useState(currentUser ? currentUser.name : '');
      const [nameMsg, setNameMsg] = useState({ text: '', ok: false });
      const [savingName, setSavingName] = useState(false);

      const [uploading, setUploading] = useState(false);
      const [avatarMsg, setAvatarMsg] = useState({ text: '', ok: false });
      const fileInputRef = useRef(null);

      const [oldPass, setOldPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [passMsg, setPassMsg] = useState({ text: '', ok: false });
      const [changingPass, setChangingPass] = useState(false);

      if (!currentUser) {
        return (
          <div className="py-20 text-center">
            <p className="text-slate-300 font-medium mb-4">سجّل الدخول للوصول إلى إعدادات حسابك.</p>
            <button onClick={() => onOpenAuth('login')} className="px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition">تسجيل الدخول</button>
          </div>
        );
      }

      const saveName = async () => {
        const trimmed = name.trim();
        if (!trimmed) { setNameMsg({ text: 'الرجاء إدخال اسم صالح.', ok: false }); return; }
        setSavingName(true);
        try { await onUpdateName(trimmed); setNameMsg({ text: 'تم حفظ الاسم بنجاح.', ok: true }); }
        catch (e) { setNameMsg({ text: 'تعذر حفظ الاسم، حاول مجددًا.', ok: false }); }
        setSavingName(false);
      };

      const handleAvatarFile = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setAvatarMsg({ text: '', ok: false });
        setUploading(true);
        compressImageToDataUrl(file)
          .then(dataUrl => Promise.resolve(onUpdateAvatar(dataUrl)).then(() => setAvatarMsg({ text: 'تم تحديث صورة الحساب.', ok: true })))
          .catch(err => setAvatarMsg({ text: (err && err.message) || 'تعذر حفظ الصورة.', ok: false }))
          .finally(() => setUploading(false));
      };

      const changePassword = async () => {
        setPassMsg({ text: '', ok: false });
        if (!oldPass || !newPass || !confirmPass) { setPassMsg({ text: 'الرجاء تعبئة كل الحقول.', ok: false }); return; }
        if (newPass.length < 4) { setPassMsg({ text: 'كلمة المرور الجديدة قصيرة جدًا.', ok: false }); return; }
        if (newPass !== confirmPass) { setPassMsg({ text: 'كلمة المرور الجديدة غير متطابقة مع التأكيد.', ok: false }); return; }
        setChangingPass(true);
        try {
          const snap = await db.ref(`users/${currentUser.id}/password`).once('value');
          const storedPass = snap.val();
          if (storedPass !== oldPass) { setPassMsg({ text: 'كلمة المرور القديمة غير صحيحة.', ok: false }); setChangingPass(false); return; }
          await db.ref(`users/${currentUser.id}/password`).set(newPass);
          setOldPass(''); setNewPass(''); setConfirmPass('');
          setPassMsg({ text: 'تم تغيير كلمة المرور بنجاح.', ok: true });
        } catch (e) { setPassMsg({ text: 'حدث خطأ، حاول مجددًا.', ok: false }); }
        setChangingPass(false);
      };

      const inputCls = "w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner";

      return (
        <div className="max-w-xl mx-auto pb-10">
          <h1 className="text-2xl md:text-3xl font-black mb-6 text-slate-100">الإعدادات</h1>

          <div className="glass-panel rounded-3xl p-5 md:p-7 mb-6 border border-white/10 shadow-xl">
            <h2 className="font-black text-lg text-white mb-4">صورة الحساب</h2>
            <div className="flex items-center gap-4 flex-wrap">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center font-black text-lg text-glass-950 overflow-hidden shrink-0">
                {currentUser.avatar ? <img src={currentUser.avatar} alt="" className="w-full h-full object-cover" /> : currentUser.name.charAt(0)}
              </div>
              <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={uploading}
                className="px-5 py-2.5 rounded-2xl glass-card border border-white/10 hover:border-accent-cyan text-sm font-bold text-slate-200 transition disabled:opacity-50">
                {uploading ? 'جارٍ الرفع...' : 'تغيير الصورة'}
              </button>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleAvatarFile} className="hidden" />
            </div>
            {avatarMsg.text && <p className={`text-xs font-bold mt-3 p-2.5 rounded-xl border ${avatarMsg.ok ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'}`}>{avatarMsg.text}</p>}
          </div>

          <div className="glass-panel rounded-3xl p-5 md:p-7 mb-6 border border-white/10 shadow-xl">
            <h2 className="font-black text-lg text-white mb-4">الاسم الظاهر</h2>
            <div className="flex flex-col sm:flex-row gap-3">
              <input value={name} onChange={e => setName(e.target.value)} className={inputCls} />
              <button onClick={saveName} disabled={savingName} className="shrink-0 px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_15px_rgba(255,51,75,0.4)] transition disabled:opacity-50">{savingName ? 'جارٍ الحفظ...' : 'حفظ'}</button>
            </div>
            {nameMsg.text && <p className={`text-xs font-bold mt-3 p-2.5 rounded-xl border ${nameMsg.ok ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'}`}>{nameMsg.text}</p>}
          </div>

          <div className="glass-panel rounded-3xl p-5 md:p-7 border border-white/10 shadow-xl">
            <h2 className="font-black text-lg text-white mb-4">تغيير كلمة المرور</h2>
            <div className="space-y-3">
              <input type="password" value={oldPass} onChange={e => setOldPass(e.target.value)} placeholder="كلمة المرور الحالية" className={inputCls} />
              <input type="password" value={newPass} onChange={e => setNewPass(e.target.value)} placeholder="كلمة المرور الجديدة" className={inputCls} />

    function FileUploadField({ label, value, onChange, folder, accept, compact }) {

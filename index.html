      const [ratings, setRatings] = useState({});
      const [myStars, setMyStars] = useState(0);
      const [reviewReplyingTo, setReviewReplyingTo] = useState(null);
      const [reviewReplyText, setReviewReplyText] = useState('');
      const [myFollowingSet, setMyFollowingSet] = useState({});
      const [showAddToList, setShowAddToList] = useState(false);

      useEffect(() => {
        if (!currentUser) { setMyFollowingSet({}); return; }
        const ref = db.ref(`following/${sanitizeKey(currentUser.username)}`);
        const cb = snap => setMyFollowingSet(snap.val() || {});
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser && currentUser.username]);
      const [myReview, setMyReview] = useState('');
      const [savingRating, setSavingRating] = useState(false);
      const [ratingMsg, setRatingMsg] = useState('');
      const [deleteCommentTarget, setDeleteCommentTarget] = useState(null);
      const [deleteMyRating, setDeleteMyRating] = useState(false);

      useEffect(() => {
        setPlayingUrl(null); setPlayingLabel(''); setActiveSeason(0); setSeasonView(false); setShowAllEpisodes(false); setCommentText(''); setReplyingTo(null); setVideoError(false); setResumeAt(0);
        const ref = db.ref(`comments/${title.id}`);
        const cb = snap => {
          const data = snap.val();
          const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];

        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [title.id]);

      useEffect(() => {
        const ref = db.ref(`ratings/${title.id}`);
        const cb = snap => {
          const data = snap.val() || {};
          setRatings(data);
          if (currentUser && data[currentUser.id]) {

          } else {
            setMyStars(0); setMyReview('');
          }
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [title.id, currentUser && currentUser.id]);


      const ratingList = Object.keys(ratings).map(uid => ({ uid, ...ratings[uid] })).sort((a, b) => (b.date || 0) - (a.date || 0));
      const followersRatings = ratingList.filter(r => myFollowingSet[sanitizeKey(r.username)]);

      const submitReviewReply = async (ratingUid) => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!reviewReplyText.trim()) return;
        await db.ref(`ratings/${title.id}/${ratingUid}/replies`).push({ author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', text: reviewReplyText.trim(), date: Date.now() });
        const targetRating = ratingList.find(r => r.uid === ratingUid);
        if (targetRating && targetRating.username && targetRating.username !== currentUser.username) {
          pushNotification(targetRating.username, { type: 'reviewReply', fromUsername: currentUser.username, fromName: currentUser.name, fromAvatar: currentUser.avatar || '', titleId: title.id, titleName: title.name, text: reviewReplyText.trim().slice(0, 80) });
        }
        setReviewReplyText(''); setReviewReplyingTo(null);
      };
      const avgRating = ratingList.length ? ratingList.reduce((s, r) => s + (r.stars || 0), 0) / ratingList.length : 0;
      const canModerate = currentUser && (() => { const role = getRole ? getRole(currentUser.username) : null; return role === 'admin' || role === 'moderator'; })();

      const submitRating = async () => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (!myStars) { setRatingMsg('الرجاء اختيار عدد النجوم أولًا.'); return; }
        setSavingRating(true); setRatingMsg('');
        const payload = { stars: myStars, review: myReview.trim(), author: currentUser.name, username: currentUser.username, avatar: currentUser.avatar || '', date: Date.now() };
        try {
          await db.ref(`ratings/${title.id}/${currentUser.id}`).set(payload);
          await db.ref(`userRatings/${currentUser.id}/${title.id}`).set({ stars: myStars, review: myReview.trim(), date: Date.now() });
          setRatingMsg('تم حفظ تقييمك بنجاح.');
        } catch (e) { setRatingMsg('تعذر حفظ التقييم.'); }
        setSavingRating(false);
        setTimeout(() => setRatingMsg(''), 3000);
      };

      const removeMyRating = async () => {
        if (!currentUser) return;
        await db.ref(`ratings/${title.id}/${currentUser.id}`).remove();
        await db.ref(`userRatings/${currentUser.id}/${title.id}`).remove();
        setMyStars(0); setMyReview(''); setDeleteMyRating(false);
      };

      const roleRank = (username) => {
        const role = getRole ? getRole(username) : null;
        return role === 'admin' ? 2 : role === 'moderator' ? 1 : 0;
      };

      const seasons = (title.seasons || [])
        .map(s => ({ ...s, episodes: (s.episodes || []).slice().sort((a, b) => (a.number || 0) - (b.number || 0)) }))
        .sort((a, b) => (a.number || 0) - (b.number || 0));
      const isSeries = title.type !== 'movie';

      const allEpisodesFlat = React.useMemo(() => {
        const flat = [];
        seasons.forEach(s => { (s.episodes || []).forEach(ep => flat.push({ ...ep, seasonNumber: s.number, episodeThumbnail: s.episodeThumbnail })); });
        return flat;
      }, [title.id, JSON.stringify(seasons.map(s => ({ n: s.number, c: (s.episodes || []).length })))]);

      const firstEpisode = () => {
        for (const s of seasons) { if (s.episodes && s.episodes.length) return { ep: s.episodes[0], seasonNumber: s.number }; }
        return null;
      };

      const getSavedVideoUrl = (item) => normalizeVideoUrl((item && item.videoUrl) || (((item && item.videoSources) || [])[0] || {}).url || '');
      const recoverMovieVideo = async () => {
        const results = await cinemanaSearch(title.name, title.type === 'anime' ? 'anime' : 'movie');
        const pick = results.find(r => String(cinemanaYear(r) || '') === String(title.year || '')) || results[0];
        if (!pick || pick.nb == null) throw new Error('ما لكيت العمل على سينمانا حتى أسترجع رابط التشغيل.');
        const sources = cinemanaVideoSources(await cinemanaVideos(String(pick.nb)));
        if (!sources.length) throw new Error('سينمانا ما رجّعت روابط فيديو لهذا الفيلم.');
        return { url: sources[0].url, sources, sourceId: String(pick.nb) };
      };

      const recoverEpisodeVideo = async (ep, seasonNumber) => {
        const results = await cinemanaSearch(title.name, title.type === 'anime' ? 'anime' : 'tv');
        const pick = results.find(r => String(cinemanaYear(r) || '') === String(title.year || '')) || results[0];
        if (!pick || pick.nb == null) throw new Error('ما لكيت المسلسل على سينمانا حتى أسترجع رابط الحلقة.');
        const eps = await cinemanaEpisodes(String(pick.nb));
        const targetSeason = Number(seasonNumber) || 1;
        const targetEpisode = Number(ep.number) || 1;
        const match = eps.find(e => cinemanaEpisodeSeason(e) === targetSeason && cinemanaEpisodeNumber(e) === targetEpisode);
        if (!match || match.nb == null) throw new Error(`ما لكيت الموسم ${targetSeason} الحلقة ${targetEpisode} على سينمانا.`);
        const sources = cinemanaVideoSources(await cinemanaVideos(String(match.nb)));
        if (!sources.length) throw new Error('سينمانا ما رجّعت روابط فيديو لهذه الحلقة.');
        return { url: sources[0].url, sources, sourceId: String(match.nb) };
      };

      const handlePlay = async () => {
        setVideoError(false); setResumeAt(0);
        try {
          if (title.type === 'movie') {
            let url = getSavedVideoUrl(title);
            let sources = normalizeVideoSources(title.videoSources);
            if (!url) {
              const recovered = await recoverMovieVideo();
              url = recovered.url; sources = recovered.sources;
            }
            setPlayingUrl(url);
            setPlayingMeta({ ...title, videoUrl: url, videoSources: sources, subtitleUrl: title.subtitleUrl || ((sources || [])[0] || {}).subtitleUrl || '', subtitleOffset: Number(title.subtitleOffset) || 0 });
            setPlayingLabel(title.name);
          } else {
            const found = firstEpisode();
            const ep = found ? found.ep : null;
            if (!ep) throw new Error('ماكو حلقات قابلة للتشغيل بهذا العمل.');
            await playEpisode(ep, found.seasonNumber);
          }
        } catch (e) {
          setVideoError(true);
          showToast(e.message || 'تعذّر تشغيل الفيديو', 'error');
        }
      };

      const playEpisode = async (ep, seasonNumber) => {
        setVideoError(false); setResumeAt(0);
        try {
          let url = getSavedVideoUrl(ep);
          let sources = normalizeVideoSources(ep.videoSources);
          if (!url) {
            const recovered = await recoverEpisodeVideo(ep, seasonNumber);
            url = recovered.url; sources = recovered.sources;
          }
          setPlayingUrl(url);
          setPlayingMeta({ ...ep, videoUrl: url, videoSources: sources, subtitleUrl: ep.subtitleUrl || ((sources || [])[0] || {}).subtitleUrl || '', subtitleOffset: Number(ep.subtitleOffset) || 0 });
          setPlayingSeasonNumber(seasonNumber != null ? seasonNumber : null);
          setPlayingLabel(`${title.name} · ${ep.title || `الحلقة ${ep.number != null ? ep.number : ''}`}`);
        } catch (e) {
          setVideoError(true);
          showToast(e.message || 'تعذّر تشغيل الحلقة', 'error');
        }
      };
      const openSeason = (i) => { setActiveSeason(i); setSeasonView(true); setShowAllEpisodes(false); };
      const openAllEpisodes = () => { setShowAllEpisodes(true); setSeasonView(false); };

      const playNextEpisode = () => {
        const season = seasons[activeSeason];
        if (!season) return;
        const idx = season.episodes.findIndex(e => e.videoUrl === playingMeta.videoUrl && e.number === playingMeta.number);
        if (idx > -1 && idx < season.episodes.length - 1) playEpisode(season.episodes[idx + 1], season.number);

    function PasswordStrengthMeter({ password }) {
      const checks = React.useMemo(() => {
        const p = password || '';
        return {
          length: p.length >= 6,
          upperLower: /[a-z]/.test(p) && /[A-Z]/.test(p),
          number: /[0-9]/.test(p),
          symbol: /[^A-Za-z0-9]/.test(p),
        };
      }, [password]);
      const score = Object.values(checks).filter(Boolean).length;
      if (!password) return null;
      const levels = [
        { label: 'ضعيفة جدًا', color: 'bg-rose-500', text: 'text-rose-400' },
        { label: 'ضعيفة', color: 'bg-rose-500', text: 'text-rose-400' },
        { label: 'متوسطة', color: 'bg-amber-500', text: 'text-amber-400' },
        { label: 'جيدة', color: 'bg-accent-cyan', text: 'text-accent-cyan' },
        { label: 'قوية جدًا', color: 'bg-emerald-500', text: 'text-emerald-400' },
      ];
      const lvl = levels[Math.min(score, 4)];
      return (
        <div className="mt-2">
          <div className="flex items-center gap-1.5">
            {[0, 1, 2, 3].map(i => (
              <div key={i} className={`h-1.5 flex-1 rounded-full transition-all ${i < score ? lvl.color : 'bg-glass-800'}`}></div>
            ))}
          </div>
          <p className={`text-[11px] font-bold mt-1.5 ${lvl.text}`}>قوة كلمة المرور: {lvl.label}</p>
        </div>
      );
    }

    function useUserSearch(query) {
      const [results, setResults] = useState([]);

      useEffect(() => {
        const q = query.trim().toLowerCase();
        if (!q) { setResults([]); return; }
        let active = true;
        const handle = setTimeout(() => {
          db.ref('users').orderByChild('username').startAt(q).endAt(q + '\uf8ff').limitToFirst(6).once('value')
            .then(snap => {
              if (!active) return;
              const data = snap.val() || {};
              const list = Object.keys(data).map(k => ({ id: k, ...data[k] })).filter(u => !u.banned && !u.deleted);
              list.sort((a, b) => (a.username || '').localeCompare(b.username || ''));
              setResults(list);
            })
            .catch(() => { if (active) setResults([]); });
        }, 300);
        return () => { active = false; clearTimeout(handle); };
      }, [query]);

      return results;
    }

    function ProfileLists({ username, isOwn, onOpen }) {

                <label className="text-xs font-bold text-slate-300 mb-1.5 block">من يشاهد هذي القائمة؟</label>

    function ProfileView({ username, currentUser, titles, onOpen, onOpenAuth, onOpenProfile }) {
      const [profileUser, setProfileUser] = useState(null);
      const [userRatings, setUserRatings] = useState({});
      const [loading, setLoading] = useState(true);
      const [followers, setFollowers] = useState({});
      const [following, setFollowing] = useState({});
      const [myFollowing, setMyFollowing] = useState({});
      const [followBusy, setFollowBusy] = useState(false);
      const [listModal, setListModal] = useState(null);
      const [shareCopied, setShareCopied] = useState(false);
      const targetUsername = username || (currentUser && currentUser.username);
      const isOwn = currentUser && targetUsername === currentUser.username;

      useEffect(() => {
        setLoading(true);
        if (!targetUsername) { setLoading(false); return; }
        let userId = null;
        const usersRef = db.ref('users').orderByChild('username').equalTo(targetUsername);
        const cb = snap => {
          const data = snap.val();
          const key = data ? Object.keys(data)[0] : null;
          if (!key) { setProfileUser(null); setLoading(false); return; }
          userId = key;
          setProfileUser({ id: key, ...data[key] });
          db.ref(`userRatings/${key}`).on('value', rs => { setUserRatings(rs.val() || {}); setLoading(false); });
        };
        usersRef.once('value', cb);
        return () => { if (userId) db.ref(`userRatings/${userId}`).off(); };
      }, [targetUsername]);

      useEffect(() => {
        if (!targetUsername) return;
        const followersRef = db.ref(`followers/${sanitizeKey(targetUsername)}`);
        const followingRef = db.ref(`following/${sanitizeKey(targetUsername)}`);
        const cb1 = snap => setFollowers(snap.val() || {});
        const cb2 = snap => setFollowing(snap.val() || {});
        followersRef.on('value', cb1);
        followingRef.on('value', cb2);
        return () => { followersRef.off('value', cb1); followingRef.off('value', cb2); };
      }, [targetUsername]);

      useEffect(() => {
        if (!currentUser) { setMyFollowing({}); return; }
        const ref = db.ref(`following/${sanitizeKey(currentUser.username)}`);
        const cb = snap => setMyFollowing(snap.val() || {});
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, [currentUser && currentUser.username]);

      if (!targetUsername) {
        return (
          <div className="py-20 text-center">
            <p className="text-slate-300 font-medium mb-4">سجّل الدخول لعرض ملفك الشخصي.</p>
            <button onClick={() => onOpenAuth('login')} className="px-6 py-3 rounded-2xl bg-accent-red hover:bg-accent-redHover font-bold text-sm text-white shadow-[0_0_20px_rgba(255,51,75,0.4)] transition">تسجيل الدخول</button>
          </div>
        );
      }
      if (loading) return <div className="py-20 text-center text-slate-400 font-bold">جارٍ التحميل...</div>;
      if (!profileUser) return <EmptyState text="هذا المستخدم غير موجود." />;

      const ratingEntries = Object.keys(userRatings).map(titleId => ({ titleId, ...userRatings[titleId] }));
      ratingEntries.sort((a, b) => (b.date || 0) - (a.date || 0));
      const withTitles = ratingEntries.map(r => ({ ...r, title: titles.find(t => t.id === r.titleId) })).filter(r => r.title);
      const avg = withTitles.length ? (withTitles.reduce((s, r) => s + (r.stars || 0), 0) / withTitles.length) : 0;
      const watchedPosters = withTitles.filter(r => r.title.poster);

      const followersUsernames = Object.keys(followers);
      const followingUsernames = Object.keys(following);
      const iAmFollowing = currentUser && !!myFollowing[sanitizeKey(targetUsername)];

      const toggleFollow = async () => {
        if (!currentUser) { onOpenAuth('login'); return; }
        if (isOwn) return;
        setFollowBusy(true);
        const meKey = sanitizeKey(currentUser.username), themKey = sanitizeKey(targetUsername);
        try {
          if (iAmFollowing) {
            await db.ref(`following/${meKey}/${themKey}`).remove();
            await db.ref(`followers/${themKey}/${meKey}`).remove();
          } else {
            await db.ref(`following/${meKey}/${themKey}`).set(true);
            await db.ref(`followers/${themKey}/${meKey}`).set(true);
            pushNotification(targetUsername, { type: 'follow', fromUsername: currentUser.username, fromName: currentUser.name, fromAvatar: currentUser.avatar || '' });
          }
        } finally { setFollowBusy(false); }
      };

      return (
        <div>
          <div className="glass-panel rounded-3xl p-6 md:p-8 mb-8 border border-white/10 shadow-xl flex items-center gap-5 flex-wrap">
            <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center font-black text-2xl text-glass-950 overflow-hidden shrink-0">
              {profileUser.avatar ? <img src={profileUser.avatar} alt="" className="w-full h-full object-cover" /> : (profileUser.name || '?').charAt(0)}
            </div>
            <div className="min-w-0">
              <h1 className="text-xl md:text-2xl font-black text-white flex items-center gap-2 flex-wrap">
                {profileUser.name}
                {profileUser.username === 'mavilovelife' && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold">مدير النظام</span>}
                {profileUser.isModerator && <span className="text-[10px] px-2 py-0.5 rounded-full bg-accent-cyan/20 text-accent-cyan border border-accent-cyan/30 font-bold">مشرف النظام</span>}
              </h1>

    const FIT_OPTIONS = [['contain', 'احتواء كامل (بدون قص)'], ['cover', 'ملء الشاشة (تمدد)'], ['crop', 'قص احترافي مخصص']];
    const CROP_ASPECTS = [['free', 'حر'], ['16:9', '16:9'], ['9:16', '9:16'], ['1:1', '1:1'], ['4:3', '4:3'], ['3:4', '3:4']];

    function parseAspectRatio(key) {
      if (!key || key === 'free') return null;
      const parts = key.split(':').map(Number);
      return parts[0] / parts[1];
    }

    function formatClock(sec) {
      sec = Math.max(0, sec || 0);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
      const p = n => String(n).padStart(2, '0');
      return h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
    }

    function resizeCropBox(handle, start, dxPct, dyPct, ratioLock) {
      const MIN = 5;
      let { x, y, w, h } = start;
      const anchorRight = x + w, anchorBottom = y + h;
      const anchorCenterX = x + w / 2, anchorCenterY = y + h / 2;
      let nx = x, ny = y, nw = w, nh = h;

      if (handle.includes('e')) nw = w + dxPct;
      if (handle.includes('w')) { nw = w - dxPct; nx = x + dxPct; }
      if (handle.includes('s')) nh = h + dyPct;
      if (handle.includes('n')) { nh = h - dyPct; ny = y + dyPct; }

      nw = Math.max(MIN, nw);
      nh = Math.max(MIN, nh);

      if (ratioLock) {
        const isEdgeH = handle === 'e' || handle === 'w';
        const isEdgeV = handle === 'n' || handle === 's';
        const driveW = isEdgeH ? true : isEdgeV ? false : Math.abs(dxPct) >= Math.abs(dyPct);
        if (driveW) nh = Math.max(MIN, nw / ratioLock); else nw = Math.max(MIN, nh * ratioLock);

        if (handle === 'e') { ny = anchorCenterY - nh / 2; }
        else if (handle === 'w') { nx = anchorRight - nw; ny = anchorCenterY - nh / 2; }
        else if (handle === 'n') { nx = anchorCenterX - nw / 2; ny = anchorBottom - nh; }
        else if (handle === 's') { nx = anchorCenterX - nw / 2; }
        else if (handle === 'ne') { ny = anchorBottom - nh; }
        else if (handle === 'sw') { nx = anchorRight - nw; }
        else if (handle === 'nw') { nx = anchorRight - nw; ny = anchorBottom - nh; }
      }

      nx = Math.max(0, Math.min(nx, 100 - nw));
      ny = Math.max(0, Math.min(ny, 100 - nh));
      nw = Math.min(nw, 100 - nx);
      nh = Math.min(nh, 100 - ny);
      return { x: nx, y: ny, w: nw, h: nh };
    }

    function CropStudioModal({ videoUrl, initial, onCancel, onSave }) {
      const videoRef = useRef(null);
      const stageRef = useRef(null);
      const dragRef = useRef(null);
      const [natural, setNatural] = useState({ w: 0, h: 0 });
      const [stageSize, setStageSize] = useState({ w: 0, h: 0 });
      const [boxPct, setBoxPct] = useState(() => ({
        x: initial && initial.x != null ? initial.x : 0,
        y: initial && initial.y != null ? initial.y : 0,
        w: initial && initial.width ? initial.width : 100,
        h: initial && initial.height ? initial.height : 100,
      }));
      const [rotation, setRotation] = useState(initial && initial.rotation ? initial.rotation : 0);
      const [aspect, setAspect] = useState('free');
      const [duration, setDuration] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const el = stageRef.current;
        if (!el || typeof ResizeObserver === 'undefined') return;
        const ro = new ResizeObserver(entries => {
          const cr = entries[0].contentRect;
          setStageSize({ w: cr.width, h: cr.height });
        });
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      useEffect(() => {
        const v = videoRef.current;
        if (!v) return;
        const onLoaded = () => { setNatural({ w: v.videoWidth || 0, h: v.videoHeight || 0 }); setDuration(v.duration || 0); setReady(true); };
        const onTime = () => setCurrentTime(v.currentTime || 0);
        const onPlay = () => setPlaying(true);
        const onPause = () => setPlaying(false);
        v.addEventListener('loadedmetadata', onLoaded);
        v.addEventListener('timeupdate', onTime);
        v.addEventListener('play', onPlay);
        v.addEventListener('pause', onPause);
        return () => {
          v.removeEventListener('loadedmetadata', onLoaded); v.removeEventListener('timeupdate', onTime);
          v.removeEventListener('play', onPlay); v.removeEventListener('pause', onPause);
        };
      }, [videoUrl]);

      const renderedRect = React.useMemo(() => {
        if (!natural.w || !natural.h || !stageSize.w || !stageSize.h) return { left: 0, top: 0, width: stageSize.w || 0, height: stageSize.h || 0 };
        const stageAspect = stageSize.w / stageSize.h, vidAspect = natural.w / natural.h;
        let w, h;
        if (vidAspect > stageAspect) { w = stageSize.w; h = w / vidAspect; } else { h = stageSize.h; w = h * vidAspect; }
        return { left: (stageSize.w - w) / 2, top: (stageSize.h - h) / 2, width: w, height: h };
      }, [natural, stageSize]);

      const ratioLock = React.useMemo(() => {
        const ar = parseAspectRatio(aspect);
        if (!ar || !natural.w || !natural.h) return null;
        return ar * (natural.h / natural.w);
      }, [aspect, natural]);

      useEffect(() => {
        if (!ratioLock) return;
        setBoxPct(prev => {
          const cx = prev.x + prev.w / 2, cy = prev.y + prev.h / 2;
          let w = prev.w, h = w / ratioLock;
          if (h > 100) { h = 100; w = h * ratioLock; }
          if (w > 100) { w = 100; h = w / ratioLock; }
          let x = Math.max(0, Math.min(cx - w / 2, 100 - w));
          let y = Math.max(0, Math.min(cy - h / 2, 100 - h));
          return { x, y, w, h };
        });
        // eslint-disable-next-line
      }, [ratioLock]);

      const beginDrag = (e, mode) => {
        e.preventDefault(); e.stopPropagation();
        dragRef.current = { mode, startX: e.clientX, startY: e.clientY, startBox: { ...boxPct } };
        try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
      };
      const onDragMove = (e) => {
        const drag = dragRef.current;
        if (!drag || !renderedRect.width || !renderedRect.height) return;
        const dxPct = (e.clientX - drag.startX) / renderedRect.width * 100;
        const dyPct = (e.clientY - drag.startY) / renderedRect.height * 100;
        if (drag.mode === 'move') {
          const nx = Math.max(0, Math.min(drag.startBox.x + dxPct, 100 - drag.startBox.w));
          const ny = Math.max(0, Math.min(drag.startBox.y + dyPct, 100 - drag.startBox.h));
          setBoxPct({ ...drag.startBox, x: nx, y: ny });
        } else {
          setBoxPct(resizeCropBox(drag.mode, drag.startBox, dxPct, dyPct, ratioLock));
        }
      };
      const endDrag = () => { dragRef.current = null; };

      const resetAll = () => { setBoxPct({ x: 0, y: 0, w: 100, h: 100 }); setRotation(0); setAspect('free'); };
      const togglePlay = () => { const v = videoRef.current; if (!v) return; if (v.paused) v.play(); else v.pause(); };
      const seek = (val) => { const v = videoRef.current; if (!v) return; v.currentTime = val; setCurrentTime(val); };
      const confirm = () => onSave({ active: true, x: boxPct.x, y: boxPct.y, width: boxPct.w, height: boxPct.h, rotation });

      const corners = [['nw', '0%', '0%', 'nwse-resize'], ['ne', '100%', '0%', 'nesw-resize'], ['sw', '0%', '100%', 'nesw-resize'], ['se', '100%', '100%', 'nwse-resize']];
      const edges = [['n', '50%', '0%', 'ns-resize', 'w-9 h-2.5 rounded-full'], ['s', '50%', '100%', 'ns-resize', 'w-9 h-2.5 rounded-full'], ['w', '0%', '50%', 'ew-resize', 'w-2.5 h-9 rounded-full'], ['e', '100%', '50%', 'ew-resize', 'w-2.5 h-9 rounded-full']];

      return ReactDOM.createPortal((
        <div className="modal-backdrop fixed inset-0 z-[80] bg-black flex flex-col" onClick={e => e.stopPropagation()} style={{ touchAction: 'none' }}>
          <div className="flex items-center justify-between px-4 py-3 border-b border-white/10 shrink-0">
            <span className="flex items-center gap-2 font-black text-white text-sm"><Icon name="crop" className="w-4 h-4 text-accent-cyan" />قص الفيديو الاحترافي</span>
            <button type="button" onClick={onCancel} className="w-9 h-9 rounded-xl glass-card border border-white/10 hover:border-accent-cyan flex items-center justify-center text-slate-300 hover:text-white transition"><Icon name="x" className="w-4 h-4" /></button>
          </div>

          <div ref={stageRef} className="relative flex-1 min-h-0 bg-black overflow-hidden select-none" style={{ touchAction: 'none' }}>
            {!ready && (
              <div className="absolute inset-0 flex items-center justify-center">
                <div className="w-10 h-10 rounded-full border-2 border-white/20 border-t-accent-cyan animate-spin"></div>
              </div>
            )}
            <video ref={videoRef} src={videoUrl} muted playsInline webkit-playsinline="true" preload="metadata"
              className="absolute inset-0 w-full h-full pointer-events-none" style={{ objectFit: 'contain' }} />
            {ready && renderedRect.width > 0 && (
              <div className="absolute" style={{ left: renderedRect.left, top: renderedRect.top, width: renderedRect.width, height: renderedRect.height, overflow: 'hidden' }}>
                <div
                  onPointerDown={e => beginDrag(e, 'move')} onPointerMove={onDragMove} onPointerUp={endDrag}
                  className="absolute cursor-move border-2 border-white"
                  style={{ left: `${boxPct.x}%`, top: `${boxPct.y}%`, width: `${boxPct.w}%`, height: `${boxPct.h}%`, boxShadow: '0 0 0 2000px rgba(0,0,0,0.65)' }}>
                  <div className="absolute left-0 right-0 top-1/2 -translate-y-1/2 border-t border-dashed border-white/50 pointer-events-none"></div>
                  <div className="absolute top-0 bottom-0 left-1/2 -translate-x-1/2 border-r border-dashed border-white/50 pointer-events-none"></div>
                  {corners.map(([id, left, top, cursor]) => (
                    <div key={id} onPointerDown={e => beginDrag(e, id)} onPointerMove={onDragMove} onPointerUp={endDrag}
                      className="absolute w-4 h-4 bg-white rounded-md border border-glass-950 shadow-md -translate-x-1/2 -translate-y-1/2"
                      style={{ left, top, cursor }}></div>
                  ))}
                  {edges.map(([id, left, top, cursor, sizeCls]) => (
                    <div key={id} onPointerDown={e => beginDrag(e, id)} onPointerMove={onDragMove} onPointerUp={endDrag}
                      className={`absolute bg-white border border-glass-950 shadow-md -translate-x-1/2 -translate-y-1/2 ${sizeCls}`}
                      style={{ left, top, cursor }}></div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className="px-4 py-3 border-t border-white/10 shrink-0 space-y-3">
            <div className="flex items-center gap-3">
              <button type="button" onClick={togglePlay} className="w-8 h-8 rounded-lg glass-card border border-white/10 flex items-center justify-center text-accent-cyan shrink-0">
                <Icon name={playing ? 'pause' : 'play'} className="w-3.5 h-3.5" />
              </button>
              <span className="text-xs font-mono text-accent-cyan shrink-0">{formatClock(currentTime)}</span>
              <input type="range" min="0" max={duration || 0} step="0.05" value={currentTime}
                onChange={e => seek(Number(e.target.value))} className="w-full accent-accent-cyan" />
              <span className="text-xs font-mono text-slate-400 shrink-0">{formatClock(duration)}</span>
            </div>

            <div className="grid sm:grid-cols-2 gap-3 items-center">
              <div className="flex items-center gap-2">
                <span className="text-[11px] font-bold text-slate-400 shrink-0 w-12">الدوران</span>
                <input type="range" min="-45" max="45" step="1" value={rotation} onChange={e => setRotation(Number(e.target.value))} className="w-full accent-accent-cyan" />
                <div className="flex items-center gap-1 shrink-0">
                  <input type="number" min="-45" max="45" value={rotation}
                    onChange={e => setRotation(Math.max(-45, Math.min(45, Number(e.target.value) || 0)))}
                    className="w-14 bg-glass-900 border border-white/10 rounded-lg px-2 py-1 text-xs text-white text-center" />
                  <span className="text-[11px] text-slate-400">°</span>
                </div>
              </div>
              <div className="flex items-center gap-2 sm:justify-end">
                <span className="text-[11px] font-bold text-slate-400 shrink-0">نسبة القص</span>
                <select value={aspect} onChange={e => setAspect(e.target.value)} className="bg-glass-900 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white outline-none focus:border-accent-cyan">
                  {CROP_ASPECTS.map(([k, l]) => <option key={k} value={k} className="bg-glass-950">{l}</option>)}
                </select>
              </div>
            </div>

            <div className="flex gap-3 pt-1">
              <button type="button" onClick={resetAll} className="flex-1 py-2.5 rounded-xl glass-card border border-white/10 text-xs font-bold text-slate-300 hover:bg-white/5 transition">إعادة ضبط</button>
              <button type="button" onClick={confirm} disabled={!ready} className="flex-1 py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-xs font-black hover:brightness-110 shadow-[0_0_15px_rgba(0,240,255,0.4)] transition disabled:opacity-50">تأكيد القص</button>
            </div>
          </div>
        </div>
      ), document.body);
    }

    function AdminContentForm({ initial, defaultType, onDone }) {
      const [form, setForm] = useState(() => {
        if (!initial) return emptyForm(defaultType);
        const cleanedInitial = normalizeTitlePlaybackData(initial);
        return { ...emptyForm(defaultType), ...cleanedInitial, genresText: (cleanedInitial.genres || []).join(', '), seasons: cleanedInitial.seasons ? JSON.parse(JSON.stringify(cleanedInitial.seasons)) : [] };
      });
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');
      const [activeSeasonIdx, setActiveSeasonIdx] = useState(0);
      const [editingEpisodeIdx, setEditingEpisodeIdx] = useState(null);
      const [sourceId, setSourceId] = useState('');
      const [subtitleSourceIds, setSubtitleSourceIds] = useState([]);
      const [bannerData, setBannerData] = useState(null);
      const [bannerLoading, setBannerLoading] = useState(false);
      const [bannerError, setBannerError] = useState('');
      const [showAllBanners, setShowAllBanners] = useState(false);
      const [bannerSource, setBannerSource] = useState('tmdb');
      const [seasonStills, setSeasonStills] = useState({});

      const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
      const fetchBanners = () => {
        const src = sourceId || guessTvSourceId(form.seasons);
        if (!src) return;
        setBannerLoading(true); setBannerError('');
        loadTvBannerData(src)
          .then(d => setBannerData(d))
          .catch(e => setBannerError(e.message || 'تعذّر جلب البنرات.'))
          .finally(() => setBannerLoading(false));
      };
      useEffect(() => {
        if (form.type === 'movie' || !form.seasons.length || bannerData) return;
        fetchBanners();
        // eslint-disable-next-line
      }, [form.seasons.length > 0, sourceId, form.type]);
      const stillsSeasonNumber = form.seasons[activeSeasonIdx] ? form.seasons[activeSeasonIdx].number : null;
      useEffect(() => {
        if (bannerSource !== 'stills' || !bannerData || !bannerData.tmdbId || stillsSeasonNumber == null) return;
        const key = String(stillsSeasonNumber);
        if (seasonStills[key]) return;
        let cancelled = false;
        tmdbFetch(`tv/${bannerData.tmdbId}/season/${key}`, { language: 'en-US' })
          .then(sd => { if (!cancelled) setSeasonStills(prev => ({ ...prev, [key]: (sd.episodes || []).filter(ep => ep.still_path).map(ep => TMDB_IMG + 'w780' + ep.still_path) })); })
          .catch(() => { if (!cancelled) setSeasonStills(prev => ({ ...prev, [key]: [] })); });
        return () => { cancelled = true; };
        // eslint-disable-next-line
      }, [bannerSource, bannerData, stillsSeasonNumber]);

      const bannerOptionsFor = (seasonNumber) => {
        if (!bannerData) return [];
        const seen = new Set(), out = [];
        const add = (url, kind) => { if (url && !seen.has(url)) { seen.add(url); out.push({ url, kind }); } };
        if (bannerSource === 'fanart') {
          ((bannerData.seasons || {})[String(seasonNumber)] || []).forEach(u => add(u, 'season'));
          (bannerData.tv || []).forEach(u => add(u, 'tv'));
        } else if (bannerSource === 'stills') {
          (seasonStills[String(seasonNumber)] || []).forEach(u => add(u, 'still'));
        } else {
          (bannerData.tmdb || []).forEach(u => add(u, 'tmdb'));
        }
        return out;
      };

      const pickBanner = (url) => {
        updateSeasonField(activeSeasonIdx, 'episodeThumbnail', url);
      };

      const applyTmdb = (result) => {
        setSourceId(result.sourceId || '');
        setSubtitleSourceIds([result.imdbId, result.tmdbId].filter(Boolean));
        setBannerData(result.bannerData || null);
        setShowAllBanners(false);
        setForm(prev => ({ ...prev, ...result.patch }));
        setActiveSeasonIdx(0);
        setEditingEpisodeIdx(null);
        setError('');
      };

      const addSeason = () => setForm(prev => {
        const seasons = [...prev.seasons, { number: prev.seasons.length + 1, year: '', poster: '', episodeThumbnail: '', episodes: [] }];
        setActiveSeasonIdx(seasons.length - 1);
        setEditingEpisodeIdx(null);
        return { ...prev, seasons };
      });
      const removeSeason = (si) => setForm(prev => {
        const seasons = prev.seasons.filter((_, i) => i !== si);
        setActiveSeasonIdx(idx => Math.max(0, Math.min(idx, seasons.length - 1)));
        setEditingEpisodeIdx(null);
        return { ...prev, seasons };
      });
      const duplicateSeason = (si) => setForm(prev => {
        const src = prev.seasons[si];
        const copy = JSON.parse(JSON.stringify(src));
        copy.number = prev.seasons.length + 1;
        return { ...prev, seasons: [...prev.seasons, copy] };
      });
      const moveSeason = (si, dir) => setForm(prev => {
        const arr = [...prev.seasons];
        const ni = si + dir;
        if (ni < 0 || ni >= arr.length) return prev;
        [arr[si], arr[ni]] = [arr[ni], arr[si]];
        return { ...prev, seasons: arr };
      });
      const updateSeasonNumber = (si, val) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, number: val }) }));
      const updateSeasonField = (si, key, val) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, [key]: val }) }));

      const addEpisode = (si) => {
        setForm(prev => {
          const seasons = prev.seasons.map((s, i) => i !== si ? s : { ...s, episodes: [...s.episodes, emptyEpisode(s.episodes.length + 1)] });
          return { ...prev, seasons };
        });
      };
      const removeEpisode = (si, ei) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, episodes: s.episodes.filter((_, j) => j !== ei) }) }));
      const duplicateEpisode = (si, ei) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => {
        if (i !== si) return s;
        const src = s.episodes[ei];
        const copy = JSON.parse(JSON.stringify(src));
        copy.number = s.episodes.length + 1;
        copy.title = src.title ? `${src.title} (نسخة)` : '';
        return { ...s, episodes: [...s.episodes, copy] };
      }) }));
      const moveEpisode = (si, ei, dir) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => {
        if (i !== si) return s;
        const arr = [...s.episodes];
        const ni = ei + dir;
        if (ni < 0 || ni >= arr.length) return s;
        [arr[ei], arr[ni]] = [arr[ni], arr[ei]];
        return { ...s, episodes: arr };
      }) }));
      const updateEpisode = (si, ei, key, val) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, episodes: s.episodes.map((e, j) => j !== ei ? e : { ...e, [key]: val }) }) }));
      const replaceEpisode = (si, ei, newEp) => setForm(prev => ({ ...prev, seasons: prev.seasons.map((s, i) => i !== si ? s : { ...s, episodes: s.episodes.map((e, j) => j !== ei ? e : newEp) }) }));

      const save = async () => {
        setError('');
        if (!form.name.trim()) { setError('الرجاء إدخال اسم العمل.'); return; }
        setSaving(true);
        let payload = {
          name: form.name.trim(),
          type: form.type,
          year: Number(form.year) || null,
          genres: form.genresText.split(',').map(s => s.trim()).filter(Boolean),
          poster: form.poster.trim(),
          backdrop: form.backdrop.trim(),
          description: form.description.trim(),
          director: form.director.trim(),
          writer: form.writer.trim(),
          imdbRating: form.imdbRating.trim(),
          rtRating: form.rtRating.trim(),
          featured: form.featured === true,
          status: form.status === 'published' ? 'published' : 'draft',
          sourceId: sourceId || '',
          createdAt: initial ? (initial.createdAt || Date.now()) : Date.now(),
          likes: initial ? (initial.likes || 0) : 0,
          views: initial ? (initial.views || 0) : 0,
        };
        if (form.type === 'movie') {
          payload.videoUrl = normalizeVideoUrl(form.videoUrl.trim());
          payload.videoSources = normalizeVideoSources(form.videoSources);
          payload.subtitleUrl = normalizeSubtitleUrl(form.subtitleUrl || '');
          payload.subtitleOffset = Number(form.subtitleOffset) || 0;
          payload.cinemanaId = String(form.cinemanaId || '');
          payload.trimStart = Number(form.trimStart) || 0;
          payload.trimEnd = Number(form.trimEnd) || 0;
          payload.fitMobile = form.fitMobile || 'contain';
          payload.fitDesktop = form.fitDesktop || 'contain';
          payload.crop = form.crop || {};
          payload.seasons = [];
        } else {
          payload.seasons = form.seasons.map(s => ({
            number: Number(s.number) || 1,
            year: Number(s.year) || null,
            poster: (s.poster || '').trim(),
            episodeThumbnail: (s.episodeThumbnail || '').trim(),
            episodes: (s.episodes || []).map(e => ({
              number: Number(e.number) || 1, title: (e.title || '').trim(), videoUrl: normalizeVideoUrl((e.videoUrl || '').trim()), videoSources: normalizeVideoSources(e.videoSources), subtitleUrl: normalizeSubtitleUrl(e.subtitleUrl || ''), subtitleOffset: Number(e.subtitleOffset) || 0, cinemanaId: String(e.cinemanaId || ''), imdb: (e.imdb || '').trim(), rt: (e.rt || '').trim(),
              trimStart: Number(e.trimStart) || 0, trimEnd: Number(e.trimEnd) || 0, introStart: Number(e.introStart) || 0, introEnd: Number(e.introEnd) || 0, fitMobile: e.fitMobile || 'contain', fitDesktop: e.fitDesktop || 'contain', crop: e.crop || {}, finality: e.finality || 'none'
            }))
          }));
          payload.videoUrl = '';
        }
        if (payload.status === 'published') {
          try {
            const prepared = await prepareSubtitlesForPublish(payload, sourceId, msg => setError(msg), subtitleSourceIds);
            payload = prepared.payload;
            setError(prepared.failed ? `تم تجهيز العمل، لكن تعذر جلب ${prepared.failed} ترجمة. ${prepared.failedItems.slice(0, 4).join(' | ')}` : '');
          } catch (e) {
            setError('تعذر تجهيز الترجمة تلقائيًا، سيتم حفظ العمل بدونها.');
          }

    function AdminComplaints({ currentUser }) {
      const [list, setList] = useState([]);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [replyDrafts, setReplyDrafts] = useState({});
      const [savingReplyId, setSavingReplyId] = useState(null);

      useEffect(() => {
        const ref = db.ref('complaints');
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => b.date - a.date);
          setList(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      const toggleStatus = (c) => db.ref(`complaints/${c.id}/status`).set(c.status === 'resolved' ? 'open' : 'resolved');
      const remove = async (id) => { await db.ref(`complaints/${id}`).remove(); setDeleteTarget(null); };

      const sendReply = async (c) => {
        const text = (replyDrafts[c.id] || '').trim();
        if (!text) return;
        setSavingReplyId(c.id);
        try {
          await db.ref(`complaints/${c.id}`).update({ reply: text, replyDate: Date.now(), replyBy: (currentUser && currentUser.name) || 'الإدارة', status: 'resolved' });
          setReplyDrafts(prev => ({ ...prev, [c.id]: '' }));
        } finally { setSavingReplyId(null); }
      };

      if (!list.length) return <p className="text-sm text-slate-500 font-medium">لا توجد شكاوى أو طلبات حاليًا.</p>;

      return (
        <div className="space-y-3">
          {list.map(c => (
            <div key={c.id} className="glass-card rounded-2xl p-4 border border-white/10">
              <div className="flex items-start justify-between gap-4">
                <div className="min-w-0">
                  <p className="text-xs text-accent-cyan font-bold mb-1.5">{COMPLAINT_TYPES[c.type] || c.type}{c.titleName ? ` · ${c.titleName}` : ''}</p>
                  <p className="text-sm text-slate-200 leading-relaxed">{c.message}</p>
                  <p className="text-[10px] text-slate-500 font-mono mt-2">من {c.name} (@{c.username}) · {fmtDateTime(c.date)}</p>
                </div>
                <span className={`text-[11px] px-3 py-1 rounded-full font-bold shrink-0 ${c.status === 'resolved' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>{c.status === 'resolved' ? 'تم الحل' : 'قيد المراجعة'}</span>
              </div>

              {c.reply && (
                <div className="mt-3 pt-3 border-t border-white/10">
                  <p className="text-[11px] font-bold text-emerald-400 mb-1">ردك السابق:</p>
                  <p className="text-sm text-slate-300">{c.reply}</p>
                </div>
              )}

              <div className="flex gap-2 mt-3">
                <input value={replyDrafts[c.id] || ''} onChange={e => setReplyDrafts(prev => ({ ...prev, [c.id]: e.target.value }))}
                  placeholder={c.reply ? 'تعديل الرد...' : 'اكتب ردًا يظهر للمستخدم...'}
                  className="flex-1 min-w-0 bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-accent-cyan" />
                <button onClick={() => sendReply(c)} disabled={savingReplyId === c.id} className="shrink-0 px-4 py-2 rounded-xl bg-accent-cyan text-glass-950 text-xs font-bold hover:brightness-110 transition disabled:opacity-50">{savingReplyId === c.id ? '...' : 'إرسال الرد'}</button>
              </div>

              <div className="flex gap-2.5 mt-3">
                <button onClick={() => toggleStatus(c)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl glass-card border border-white/10 hover:border-accent-cyan text-xs font-bold text-slate-200 transition"><Icon name="check" className="w-3.5 h-3.5 text-emerald-400" />{c.status === 'resolved' ? 'إعادة فتح' : 'تحديد كمحلول'}</button>
                <button onClick={() => setDeleteTarget(c.id)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 text-xs font-bold transition"><Icon name="trash-2" className="w-3.5 h-3.5" />حذف</button>

          )}
        </div>
      );
    }

    function AdminAppeals({ currentUser }) {
      const [list, setList] = useState([]);
      const [busyId, setBusyId] = useState(null);

      useEffect(() => {
        const ref = db.ref('appeals');
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
          setList(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      const decide = async (appeal, approve) => {
        setBusyId(appeal.id);
        try {
          if (approve) {
            const snap = await db.ref('users').orderByChild('username').equalTo(appeal.username).once('value');
            const data = snap.val() || {};
            const key = Object.keys(data)[0];
            if (key) {
              if (appeal.type === 'deleted') await db.ref(`users/${key}`).update({ deleted: false, deletedAt: null });
              else await db.ref(`users/${key}`).update({ banned: false, banReason: null, banUntil: null });
            }
          }
          await db.ref(`appeals/${appeal.id}`).update({ status: approve ? 'approved' : 'rejected', respondedAt: Date.now() });
          logAuditAction(currentUser, approve ? 'الموافقة على طعن' : 'رفض طعن', `@${appeal.username}`);
        } finally { setBusyId(null); }
      };

      if (!list.length) return <p className="text-sm text-slate-500 font-medium">لا توجد طعون حاليًا.</p>;

      return (
        <div className="space-y-3">
          {list.map(a => (
            <div key={a.id} className="glass-card rounded-2xl p-4 border border-white/10">
              <div className="flex items-start justify-between gap-4">
                <div className="min-w-0">
                  <p className="text-xs text-accent-cyan font-bold mb-1.5">طعن على حساب @{a.username} · {a.type === 'deleted' ? 'حساب محذوف' : 'حساب محظور'}</p>
                  <p className="text-sm text-slate-200 leading-relaxed">{a.reason}</p>
                  <p className="text-[10px] text-slate-500 font-mono mt-2">قُدّم بتاريخ {fmtDateTime(a.submittedAt)}{a.respondedAt ? ` · تم الرد بتاريخ ${fmtDateTime(a.respondedAt)}` : ''}</p>
                </div>
                <span className={`text-[11px] px-3 py-1 rounded-full font-bold shrink-0 ${a.status === 'approved' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : a.status === 'rejected' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                  {a.status === 'approved' ? 'تمت الموافقة' : a.status === 'rejected' ? 'مرفوض' : 'قيد المراجعة'}
                </span>
              </div>
              {a.status === 'pending' && (
                <div className="flex gap-2.5 mt-3">
                  <button onClick={() => decide(a, true)} disabled={busyId === a.id} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold transition disabled:opacity-50"><Icon name="check" className="w-3.5 h-3.5" />قبول الطعن واستعادة الحساب</button>
                  <button onClick={() => decide(a, false)} disabled={busyId === a.id} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 text-xs font-bold transition disabled:opacity-50"><Icon name="x" className="w-3.5 h-3.5" />رفض الطعن</button>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    function BanDialog({ user, onCancel, onConfirm }) {
      const [reason, setReason] = useState('');
      const [kind, setKind] = useState('permanent');
      const [days, setDays] = useState(7);
      const [error, setError] = useState('');
      const [closing, requestClose] = useClosable(onCancel, 240);
      const [closingConfirm, setClosingConfirm] = useState(false);

      const confirm = () => {
        if (!reason.trim()) { setError('كتابة سبب الحظر إلزامية.'); return; }
        const until = kind === 'temporary' ? Date.now() + (Number(days) || 1) * 86400000 : null;
        setClosingConfirm(true);
        setTimeout(() => onConfirm(reason.trim(), until), 240);
      };
      const isClosing = closing || closingConfirm;

      return (
        <div className={`${isClosing ? 'modal-backdrop-out' : 'modal-backdrop'} fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4`} onClick={requestClose}>
          <div onClick={e => e.stopPropagation()} className={`${isClosing ? 'modal-panel-out' : 'modal-panel'} glass-panel border border-white/10 rounded-3xl max-w-sm w-full p-6 shadow-2xl`}>
            <h3 className="font-black text-lg text-white mb-1">حظر @{user.username}</h3>
            <p className="text-xs text-slate-400 mb-4">كتابة السبب إلزامية ويظهر للمستخدم عند محاولة الدخول.</p>
            <textarea value={reason} onChange={e => setReason(e.target.value)} rows={3} placeholder="سبب الحظر (إلزامي)..."
              className="w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner mb-3"></textarea>
            <div className="flex gap-2.5 mb-3">
              <button onClick={() => setKind('permanent')} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${kind === 'permanent' ? 'bg-rose-500 text-white' : 'glass-card border border-white/10 text-slate-300'}`}>دائم</button>
              <button onClick={() => setKind('temporary')} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${kind === 'temporary' ? 'bg-rose-500 text-white' : 'glass-card border border-white/10 text-slate-300'}`}>مؤقت</button>
            </div>
            {kind === 'temporary' && (
              <div className="flex items-center gap-2.5 mb-3">
                <input type="number" min="1" value={days} onChange={e => setDays(e.target.value)} className="w-20 bg-glass-900 border border-white/10 rounded-xl px-3 py-2 text-sm text-white text-center" />
                <span className="text-xs text-slate-400 font-bold">يوم من الآن</span>
              </div>
            )}
            {error && <p className="text-rose-400 text-xs font-bold mb-3 bg-rose-500/10 p-2.5 rounded-xl border border-rose-500/20">{error}</p>}
            <div className="flex gap-3">
              <button onClick={requestClose} className="flex-1 py-2.5 rounded-xl glass-card border border-white/10 text-sm font-bold text-slate-300 hover:bg-white/5 transition">إلغاء</button>
              <button onClick={confirm} className="flex-1 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-sm font-bold text-white transition">تأكيد الحظر</button>
            </div>
          </div>
        </div>
      );
    }

    function AppealModal({ username, type, message, outcomeOnly, initialStage, onClose }) {
      const [closing, requestClose] = useClosable(onClose, 260);
      const [stage, setStage] = useState(initialStage || 'notice');
      const [reason, setReason] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState('');

      const send = async () => {
        if (!reason.trim()) { setError('الرجاء كتابة سبب توضيحي للطعن.'); return; }
        setSubmitting(true); setError('');
        try {
          const res = await submitAppeal(username, type, reason.trim());
          setStage(res.alreadyPending ? 'pending' : 'submitted');
        } catch (e) { setError('حدث خطأ، حاول مرة أخرى.'); }
        setSubmitting(false);
      };

      return (
        <div className={`${closing ? 'modal-backdrop-out' : 'modal-backdrop'} fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4`} onClick={stage === 'form' ? undefined : requestClose}>
          <div onClick={e => e.stopPropagation()} className={`${closing ? 'modal-panel-out' : 'modal-panel'} glass-panel border border-white/10 rounded-3xl max-w-sm w-full p-6 shadow-2xl`}>
            {stage === 'notice' && (
              <>
                <h3 className="font-black text-lg text-white mb-2">إشعار بخصوص حسابك</h3>
                <p className="text-sm text-slate-300 leading-relaxed mb-5">{message}</p>
                {outcomeOnly ? (
                  <button onClick={requestClose} className="w-full py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-sm font-bold hover:brightness-110 transition">حسنًا</button>
                ) : (
                  <div className="flex gap-3">
                    <button onClick={() => setStage('form')} className="flex-1 py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-sm font-bold hover:brightness-110 transition">تقديم طعن</button>
                    <button onClick={requestClose} className="flex-1 py-2.5 rounded-xl glass-card border border-white/10 text-sm font-bold text-slate-300 hover:bg-white/5 transition">إغلاق</button>
                  </div>
                )}
              </>
            )}
            {stage === 'form' && (
              <>
                <h3 className="font-black text-lg text-white mb-2">تقديم طعن</h3>
                <p className="text-xs text-slate-400 mb-3">اكتب سببًا توضيحيًا يوضح لماذا تعتقد أن هذا الإجراء غير صحيح. سيتم الرد على طعنك خلال يومين كحد أقصى.</p>
                <textarea value={reason} onChange={e => setReason(e.target.value)} rows={4} placeholder="سبب الطعن..."
                  className="w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner mb-3"></textarea>
                {error && <p className="text-rose-400 text-xs font-bold mb-3 bg-rose-500/10 p-2.5 rounded-xl border border-rose-500/20">{error}</p>}
                <div className="flex gap-3">
                  <button onClick={send} disabled={submitting} className="flex-1 py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-sm font-bold hover:brightness-110 transition disabled:opacity-50">{submitting ? '...' : 'إرسال الطعن'}</button>
                  <button onClick={requestClose} className="flex-1 py-2.5 rounded-xl glass-card border border-white/10 text-sm font-bold text-slate-300 hover:bg-white/5 transition">إلغاء</button>
                </div>
              </>
            )}
            {stage === 'submitted' && (
              <>
                <h3 className="font-black text-lg text-white mb-2">تم إرسال طعنك</h3>
                <p className="text-sm text-slate-300 leading-relaxed mb-5">سيتم مراجعة طعنك والرد عليه خلال يومين كحد أقصى.</p>
                <button onClick={requestClose} className="w-full py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-sm font-bold hover:brightness-110 transition">حسنًا</button>
              </>
            )}
            {stage === 'pending' && (
              <>
                <h3 className="font-black text-lg text-white mb-2">لديك طعن قيد المراجعة</h3>
                <p className="text-sm text-slate-300 leading-relaxed mb-5">طعنك السابق لا يزال قيد المراجعة من قِبل الإدارة، وسيتم الرد عليه خلال يومين كحد أقصى.</p>
                <button onClick={requestClose} className="w-full py-2.5 rounded-xl bg-accent-cyan text-glass-950 text-sm font-bold hover:brightness-110 transition">حسنًا</button>
              </>
            )}
          </div>
        </div>
      );
    }

    function AdminUsers({ currentUser }) {
      const [list, setList] = useState([]);
      const [query, setQuery] = useState('');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [banTarget, setBanTarget] = useState(null);
      const [busyId, setBusyId] = useState(null);

      useEffect(() => {
        const ref = db.ref('users');
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setList(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      const toggleModerator = async (u) => {
        setBusyId(u.id);
        const next = !u.isModerator;
        try {
          await db.ref(`users/${u.id}/isModerator`).set(next);
          await db.ref(`moderators/${sanitizeKey(u.username)}`).set(next ? true : null);
          logAuditAction(currentUser, next ? 'منح شارة إشراف' : 'إزالة شارة إشراف', `@${u.username}`);
        } finally { setBusyId(null); }
      };

      const confirmBan = async (reason, until) => {
        const u = banTarget;
        setBusyId(u.id);
        try {
          await db.ref(`users/${u.id}`).update({ banned: true, banReason: reason, banUntil: until });
          logAuditAction(currentUser, 'حظر مستخدم', `@${u.username} — ${reason}${until ? ' (مؤقت إلى ' + fmtDateTime(until) + ')' : ' (دائم)'}`);
        } finally { setBusyId(null); setBanTarget(null); }
      };

      const unban = async (u) => {
        setBusyId(u.id);
        try {
          await db.ref(`users/${u.id}`).update({ banned: false, banReason: null, banUntil: null });
          logAuditAction(currentUser, 'إلغاء حظر مستخدم', `@${u.username}`);
        } finally { setBusyId(null); }
      };

      const removeUser = async (u) => {
        await db.ref(`users/${u.id}`).update({ deleted: true, deletedAt: Date.now() });
        if (u.isModerator) await db.ref(`moderators/${sanitizeKey(u.username)}`).remove();
        logAuditAction(currentUser, 'حذف حساب مستخدم', `@${u.username}`);
        setDeleteTarget(null);
      };

      const restoreUser = async (u) => {
        setBusyId(u.id);
        try {
          await db.ref(`users/${u.id}`).update({ deleted: false, deletedAt: null });
          logAuditAction(currentUser, 'استعادة حساب مستخدم', `@${u.username}`);
        } finally { setBusyId(null); }
      };

      const filtered = query.trim()
        ? list.filter(u => (u.username || '').toLowerCase().includes(query.trim().toLowerCase()) || (u.name || '').toLowerCase().includes(query.trim().toLowerCase()))
        : list;

      return (
        <div>
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="بحث بالاسم أو اسم المستخدم..."
            className="w-full bg-glass-900 border border-white/10 rounded-2xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-accent-cyan transition shadow-inner mb-5" />

          {filtered.length === 0 ? (
            <p className="text-sm text-slate-500 font-medium">لا يوجد مستخدمون مطابقون.</p>
          ) : (
            <div className="space-y-3">
              {filtered.map(u => (
                <div key={u.id} className="glass-card rounded-2xl p-4 border border-white/10 flex items-center gap-3.5 flex-wrap">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center font-black text-glass-950 shrink-0 overflow-hidden">
                    {u.avatar ? <img src={u.avatar} alt="" className="w-full h-full object-cover" /> : (u.name || '?').charAt(0)}
                  </div>
                  <div className="min-w-[140px] flex-1">
                    <p className="font-bold text-white text-sm truncate flex items-center gap-1.5">
                      {u.name}
                      {u.username === 'mavilovelife' && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold">مدير النظام</span>}
                      {u.isModerator && <span className="text-[10px] px-2 py-0.5 rounded-full bg-accent-cyan/20 text-accent-cyan border border-accent-cyan/30 font-bold">مشرف النظام</span>}
                      {u.banned && <span className="text-[10px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold">محظور{u.banUntil ? ' مؤقتًا' : ''}</span>}
                      {u.deleted && <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-500/20 text-slate-300 border border-slate-500/30 font-bold">محذوف</span>}
                    </p>
                    <p className="text-xs text-slate-400">@{u.username}</p>
                    {u.banned && u.banReason && <p className="text-[11px] text-rose-300 mt-1">السبب: {u.banReason}{u.banUntil ? ` · إلى ${fmtDateTime(u.banUntil)}` : ''}</p>}
                  </div>
                  {u.username !== 'mavilovelife' && (
                    <>
                      <button onClick={() => toggleModerator(u)} disabled={busyId === u.id}
                        className={`text-xs px-4 py-2 rounded-xl font-bold transition disabled:opacity-50 ${u.isModerator ? 'bg-accent-cyan/20 text-accent-cyan border border-accent-cyan/30' : 'glass-card border border-white/10 hover:border-accent-cyan text-slate-200'}`}>
                        {u.isModerator ? 'إزالة شارة الإشراف' : 'منح شارة مشرف النظام'}
                      </button>
                      <button onClick={() => u.banned ? unban(u) : setBanTarget(u)} disabled={busyId === u.id}
                        className={`text-xs px-4 py-2 rounded-xl font-bold transition disabled:opacity-50 ${u.banned ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/10 border border-amber-500/20 text-amber-400 hover:bg-amber-500/20'}`}>
                        {u.banned ? 'إلغاء الحظر' : 'حظر الحساب'}
                      </button>
                      {u.deleted ? (
                        <button onClick={() => restoreUser(u)} disabled={busyId === u.id}
                          className="text-xs px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold transition disabled:opacity-50">استعادة الحساب</button>
                      ) : (
                        <button onClick={() => setDeleteTarget(u)} title="حذف الحساب"
                          className="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 flex items-center justify-center text-rose-400 transition shrink-0"><Icon name="trash-2" className="w-4 h-4" /></button>
                      )}
                    </>
                  )}
                </div>
              ))}
            </div>
          )}

          {deleteTarget && (
            <ConfirmDialog title="حذف هذا الحساب؟" body={`سيتم حذف حساب @${deleteTarget.username} نهائيًا ولا يمكن التراجع عن هذا الإجراء. سيظهر له إشعار بالحذف إذا حاول الدخول لاحقًا.`}
              confirmLabel="نعم، احذف" cancelLabel="إلغاء" onCancel={() => setDeleteTarget(null)} onConfirm={() => removeUser(deleteTarget)} />
          )}
          {banTarget && <BanDialog user={banTarget} onCancel={() => setBanTarget(null)} onConfirm={confirmBan} />}
        </div>
      );
    }

    function logAuditAction(currentUser, action, details) {
      if (!currentUser) return;
      db.ref('auditLog').push({ by: currentUser.name, byUsername: currentUser.username, action, details: details || '', date: Date.now() });
    }

    function AdminAuditLog() {
      const [list, setList] = useState([]);
      useEffect(() => {
        const ref = db.ref('auditLog').limitToLast(200);
        const cb = snap => {
          const data = snap.val();
          const arr = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
          arr.sort((a, b) => (b.date || 0) - (a.date || 0));
          setList(arr);
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);
      if (!list.length) return <p className="text-sm text-slate-500 font-medium">لا يوجد نشاط مسجّل بعد.</p>;

        <div className="space-y-2.5">
          {list.map(l => (
            <div key={l.id} className="glass-card rounded-2xl p-3.5 border border-white/10 flex items-start gap-3">
              <div className="w-8 h-8 rounded-xl bg-glass-700 flex items-center justify-center text-accent-cyan shrink-0"><Icon name="shield" className="w-4 h-4" /></div>
              <div className="min-w-0 flex-1">
                <p className="text-sm text-slate-200"><span className="font-bold text-accent-cyan">{l.by}</span> — {l.action}</p>
                {l.details && <p className="text-xs text-slate-400 mt-0.5">{l.details}</p>}
                <p className="text-[10px] text-slate-500 font-mono mt-1">{fmtDateTime(l.date)}</p>
              </div>
            </div>
          ))}
